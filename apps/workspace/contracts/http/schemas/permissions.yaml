UserSearchResult:
  type: object
  additionalProperties: false
  required: [users]
  properties:
    users:
      type: array
      maxItems: 20
      items:
        $ref: ./identity.yaml#/PublicUser

TeamRole:
  type: string
  enum: [admin, editor, viewer]

TeamMembership:
  type: object
  additionalProperties: false
  required: [user, role, grantedBy, createdAt, updatedAt]
  properties:
    user:
      $ref: ./identity.yaml#/PublicUser
    role:
      $ref: "#/TeamRole"
    grantedBy:
      $ref: ./identity.yaml#/PublicUser
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

TeamMemberList:
  type: object
  additionalProperties: false
  required: [owner, members]
  properties:
    owner:
      $ref: ./identity.yaml#/PublicUser
    members:
      type: array
      items:
        $ref: "#/TeamMembership"

UpsertTeamMembership:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: "#/TeamRole"

GrantRole:
  type: string
  enum: [editor, viewer]

NodeGrant:
  type: object
  additionalProperties: false
  required: [user, role, effectiveRole, grantedBy, createdAt, updatedAt]
  properties:
    user:
      $ref: ./identity.yaml#/PublicUser
    role:
      $ref: "#/GrantRole"
    effectiveRole:
      $ref: "#/GrantRole"
    grantedBy:
      $ref: ./identity.yaml#/PublicUser
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

NodeGrantList:
  type: object
  additionalProperties: false
  required: [grants]
  properties:
    grants:
      type: array
      items:
        $ref: "#/NodeGrant"

UpsertNodeGrant:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: "#/GrantRole"

GrantRemovalResult:
  type: object
  additionalProperties: false
  required: [effectiveRole]
  properties:
    effectiveRole:
      oneOf:
        - $ref: "#/GrantRole"
        - type: "null"

LinkSharingRole:
  description: Access for signed-in users. Anonymous visitors always receive viewer access.
  type: string
  enum: [editor, viewer]

NodeLinkSharing:
  type: object
  additionalProperties: false
  required:
    - enabled
    - role
    - createdBy
    - updatedBy
    - createdAt
    - updatedAt
    - owner
    - expiresAt
  properties:
    enabled:
      type: boolean
    role:
      $ref: "#/LinkSharingRole"
    owner:
      type: object
      description: Owner of the Space that holds the Node.
      additionalProperties: false
      required: [username, kind]
      properties:
        username:
          type: string
        kind:
          type: string
          enum: [human, agent]
        claimed:
          type: boolean
          description: Present only for an agent. Whether a human has claimed it.
    expiresAt:
      type: [string, "null"]
      format: date-time
      description: |
        When the link stops working because its owner, an unclaimed agent, expires. The date moves
        30 days out while the agent stays active or someone opens its handoff page. Null when the owner
        does not expire.
    createdBy:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
    updatedBy:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
    createdAt:
      type: [string, "null"]
      format: date-time
    updatedAt:
      type: [string, "null"]
      format: date-time

UpdateNodeLinkSharing:
  type: object
  additionalProperties: false
  required: [enabled, role]
  properties:
    enabled:
      type: boolean
    role:
      $ref: "#/LinkSharingRole"
