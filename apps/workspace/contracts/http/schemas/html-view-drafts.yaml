HtmlViewDraft:
  type: object
  required: [id, kind, state, spaceId, parentNodeId, name, targetResourceId, baseEtag, byteSize, createdAt, expiresAt, decidedAt, published, supersededBy]
  properties:
    id:
      type: string
    kind:
      type: string
      enum: [create, replace]
    state:
      type: string
      enum: [pending, published, rejected, expired, conflicted, superseded]
    publishWhen:
      type: string
      enum: [merge, publish]
      description: Present only for pending drafts. Merge the source pull request while it is open; otherwise publish manually.
    supersededBy:
      type: [string, "null"]
      description: Successor draft ID when superseded.
    spaceId:
      type: string
    sourceWorktreeId:
      type: [string, "null"]
      description: Source pull request. Always returned by current servers, nullable when unlinked. Publishing waits until it is merged.
    parentNodeId:
      type: [string, "null"]
    name:
      type: string
    targetResourceId:
      type: [string, "null"]
    baseEtag:
      type: [string, "null"]
      description: Quoted strong ETag of the target at intake.
    byteSize:
      type: integer
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    decidedAt:
      type: [string, "null"]
      format: date-time
    published:
      type: [object, "null"]
      required: [nodeId, resourceId, etag]
      properties:
        nodeId:
          type: string
        resourceId:
          type: string
        etag:
          type: string
          description: Quoted strong ETag of the published Blob.
HtmlViewDraftEnvelope:
  type: object
  required: [draft]
  properties:
    draft:
      $ref: '#/HtmlViewDraft'
SubmitHtmlViewDraft:
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, spaceId, name, html]
      properties:
        kind:
          type: string
          const: create
        spaceId:
          type: string
        parentNodeId:
          type: [string, "null"]
        name:
          type: string
          description: Trimmed name; .univer.html is appended when absent.
        sourceWorktreeId:
          type: string
          minLength: 1
          maxLength: 255
          description: A reviewable pull request that has not been discarded. Merged pull requests are accepted.
        html:
          type: string
          description: Structurally valid HTML View, at most 512 KiB UTF-8.
    - type: object
      additionalProperties: false
      required: [kind, resourceId, etag, html]
      properties:
        kind:
          type: string
          const: replace
        resourceId:
          type: string
        etag:
          type: string
          description: One quoted strong ETag, as returned by Blob content.
        sourceWorktreeId:
          type: string
          minLength: 1
          maxLength: 255
          description: A reviewable pull request that has not been discarded. Merged pull requests are accepted.
        html:
          type: string
          description: Structurally valid HTML View, at most 512 KiB UTF-8.
    - type: object
      required: [kind, draftId, html]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: revise
        draftId:
          type: string
          description: Author-owned pending, unexpired draft. A successor inherits its destination and base ETag; the old draft is atomically superseded.
        sourceWorktreeId:
          type: string
          description: Override the source PR; otherwise inherit the previous draft's source.
        html:
          type: string
          description: Structurally valid HTML View, at most 512 KiB UTF-8.
  discriminator:
    propertyName: kind
