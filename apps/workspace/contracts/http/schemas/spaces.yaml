SpaceType:
  type: string
  enum: [personal, team]

SpaceRole:
  type: string
  enum: [owner, admin, editor, viewer]

SpaceCapabilities:
  type: object
  additionalProperties: false
  required:
    - browseRoot
    - createAtRoot
    - renameSpace
    - manageMembers
    - viewTrash
    - createIssue
    - triageIssues
    - manageIssueLabels
    - propose
  properties:
    browseRoot:
      type: boolean
    createAtRoot:
      type: boolean
    renameSpace:
      type: boolean
    manageMembers:
      type: boolean
    viewTrash:
      type: boolean
    createIssue:
      type: boolean
      description: The caller may open Issues and comment in this Team Space.
    triageIssues:
      type: boolean
      description: The caller may edit, close, label, assign and reference files on any Issue.
    manageIssueLabels:
      type: boolean
      description: The caller may create, change and delete this Space's Issue labels.
    propose:
      type: boolean
      description: |
        The caller may fork this Team Space and open Team Worktrees in it, as its owner, as a Space Member,
        or as a signed-in reader that the Space's `proposals` setting admits while it reads publicly.

SpaceSummary:
  type: object
  additionalProperties: false
  required: [id, type, name, publicRead]
  properties:
    id:
      type: string
    type:
      $ref: "#/SpaceType"
    name:
      type: string
    publicRead:
      type: boolean
      description: Whether anyone with a link can browse and open this Space read-only.

SpaceView:
  allOf:
    - $ref: "#/SpaceSummary"
    - type: object
      required: [accessRole, affiliation, capabilities, owner, description, slug, fullName, proposals, acceptAfterHours]
      properties:
        proposals:
          $ref: "#/SpaceProposals"
        acceptAfterHours:
          $ref: "#/SpaceAcceptAfterHours"
        slug:
          type: [string, "null"]
          description: URL-safe name unique among the owner's Team Spaces (case-insensitive). Null for a Personal Space and for a Team Space created before slugs existed.
        fullName:
          type: [string, "null"]
          description: |
            `<owner.username>/<slug>` for a Team Space with a slug and `<owner.username>/personal` for a Personal Space.
            Null for a Team Space without a slug. Computed by the server; it changes when the owner renames their username.
        description:
          type: string
          maxLength: 350
          description: Short plain-text summary of the Space. Empty when none has been set.
        owner:
          type: object
          additionalProperties: false
          required: [id, username]
          properties:
            id:
              type: string
            username:
              type: string
          description: The authoritative Space owner, including when viewed by another User.
        affiliation:
          $ref: "#/SpaceAffiliation"
        accessRole:
          $ref: "#/SpaceRole"
        capabilities:
          $ref: "#/SpaceCapabilities"
  unevaluatedProperties: false

SpaceList:
  type: object
  additionalProperties: false
  required: [spaces]
  properties:
    spaces:
      type: array
      items:
        $ref: "#/SpaceView"

SpaceProposals:
  type: string
  enum: [members, accountable, anyone]
  description: |
    Who besides its Space Members may fork a Team Space and propose changes to it. `members` admits no one
    else. `accountable` also admits any person and any claimed agent who can read the Space. `anyone` also
    admits unclaimed agents. It takes effect only while `publicRead` is true. A proposer who is not a
    Space Member can only write its own proposals, holds at most 3 open ones in the Space, and sees no
    one else's. Moving back to `members`, or turning `publicRead` off, freezes such a proposer's drafts,
    while a ready proposal stays for the members to review, merge or discard. Personal Spaces report
    `members`.

SpaceAcceptAfterHours:
  type: [integer, "null"]
  minimum: 1
  maximum: 720
  description: |
    Hours after an Issue is submitted for acceptance at which the server accepts it and closes it as
    completed, unless someone sends it back first. A send-back stops the clock and the next submission
    restarts it. Such an acceptance has no actor. `null`, the default, turns it off. Personal Spaces
    report `null`.

SpaceSlug:
  type: string
  minLength: 1
  maxLength: 100
  pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  description: Letters, digits, `.`, `_` and `-`, starting with a letter or digit. Compared case-insensitively. `personal` is reserved.

CreateTeamSpace:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    slug:
      $ref: "#/SpaceSlug"
      description: Omit to let the server derive one from the name (lowercased, unsafe characters replaced by `-`, `repo-<id8>` when nothing is left, numeric suffix on conflict).
    publicRead:
      type: boolean
      description: Whether anyone with a link can read the Space without signing in. Omit to keep it private.
    proposals:
      $ref: "#/SpaceProposals"
      description: Omit for `members`.

PatchSpace:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    slug:
      $ref: "#/SpaceSlug"
      description: Team Spaces only. The previous slug is not reserved or redirected.
    publicRead:
      type: boolean
    proposals:
      $ref: "#/SpaceProposals"
      description: Team Spaces only. The owner or an admin may change it.
    acceptAfterHours:
      $ref: "#/SpaceAcceptAfterHours"
      description: Team Spaces only. The owner or an admin may change it. `72` is the suggested value when turning it on.
    description:
      type: string
      maxLength: 350
      description: Plain text. Surrounding whitespace is trimmed; an empty string clears the description.

SpaceStar:
  type: object
  additionalProperties: false
  required: [starred, starCount]
  properties:
    starred:
      type: boolean
      description: Whether the authenticated User has starred this Space.
    starCount:
      type: integer
      minimum: 0
      description: Total stars on the Space, calculated from unique User-Space relations.

SpaceAffiliation:
  type: string
  enum: [owner, member, none]
  description: Ownership or Team membership, independent of the effective access role. Public readers have none.

MySpaceView:
  allOf:
    - $ref: "#/SpaceView"
    - type: object
      required: [affiliation]
      properties:
        affiliation:
          type: string
          enum: [owner, member]

MySpaceList:
  type: object
  additionalProperties: false
  required: [spaces]
  properties:
    spaces:
      type: array
      items:
        $ref: "#/MySpaceView"

SpacePins:
  type: object
  additionalProperties: false
  required: [customized, limit, spaces]
  properties:
    customized:
      type: boolean
      description: True when at least one stored pin is still eligible. Otherwise spaces contains the first eight owned or joined Spaces.
    limit:
      type: integer
      const: 12
      description: Maximum number of pins accepted by the server.
    spaces:
      type: array
      maxItems: 12
      description: Eligible Spaces in pin order, or the default order when customized is false.
      items:
        $ref: "#/SpaceView"

SetSpacePins:
  type: object
  additionalProperties: false
  required: [spaceIds]
  properties:
    spaceIds:
      type: array
      minItems: 1
      maxItems: 12
      uniqueItems: true
      items:
        type: string
        minLength: 1
      description: Ordered owned or joined Spaces, or public Spaces starred by the current User.
