SpaceType:
  type: string
  enum: [personal, team]

SpaceRole:
  type: string
  enum: [owner, admin, editor, viewer]

SpaceCapabilities:
  type: object
  additionalProperties: false
  required:
    - browseRoot
    - createAtRoot
    - renameSpace
    - manageMembers
    - viewTrash
    - createIssue
    - triageIssues
    - manageIssueLabels
  properties:
    browseRoot:
      type: boolean
    createAtRoot:
      type: boolean
    renameSpace:
      type: boolean
    manageMembers:
      type: boolean
    viewTrash:
      type: boolean
    createIssue:
      type: boolean
      description: The caller may open Issues and comment in this Team Space.
    triageIssues:
      type: boolean
      description: The caller may edit, close, label, assign and reference files on any Issue.
    manageIssueLabels:
      type: boolean
      description: The caller may create, change and delete this Space's Issue labels.

SpaceSummary:
  type: object
  additionalProperties: false
  required: [id, type, name, publicRead]
  properties:
    id:
      type: string
    type:
      $ref: "#/SpaceType"
    name:
      type: string
    publicRead:
      type: boolean
      description: Whether anyone with a link can browse and open this Space read-only.

SpaceView:
  allOf:
    - $ref: "#/SpaceSummary"
    - type: object
      required: [accessRole, capabilities, owner, description]
      properties:
        description:
          type: string
          maxLength: 350
          description: Short plain-text summary of the Space. Empty when none has been set.
        owner:
          type: object
          additionalProperties: false
          required: [id, username]
          properties:
            id:
              type: string
            username:
              type: string
          description: The authoritative Space owner, including when viewed by another User.
        accessRole:
          $ref: "#/SpaceRole"
        capabilities:
          $ref: "#/SpaceCapabilities"
  unevaluatedProperties: false

SpaceList:
  type: object
  additionalProperties: false
  required: [spaces]
  properties:
    spaces:
      type: array
      items:
        $ref: "#/SpaceView"

CreateTeamSpace:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    publicRead:
      type: boolean
      description: Whether anyone with a link can read the Space without signing in. Omit to keep it private.

PatchSpace:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    publicRead:
      type: boolean
    description:
      type: string
      maxLength: 350
      description: Plain text. Surrounding whitespace is trimmed; an empty string clears the description.

SpaceStar:
  type: object
  additionalProperties: false
  required: [starred, starCount]
  properties:
    starred:
      type: boolean
      description: Whether the authenticated User has starred this Space.
    starCount:
      type: integer
      minimum: 0
      description: Total stars on the Space, calculated from unique User-Space relations.
