SubmitSkillDraft:
  type: object
  additionalProperties: false
  required: [name, spaceId]
  oneOf:
    - required: [files]
    - required: [from]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    spaceId:
      type: string
      description: Author-owned Personal Space or repository Space with root creation permission.
    replace:
      type: boolean
      default: false
      description: Capture every current file and ETag as the immutable replacement base.
    files:
      type: array
      minItems: 1
      maxItems: 100
      description: UTF-8 text without NUL. SKILL.md is limited to 64 KiB; total bytes to 20 MiB. Auxiliary text over 256 KiB produces a warning.
      items:
        type: object
        additionalProperties: false
        required: [path, text]
        properties:
          path:
            type: string
            maxLength: 1024
          text:
            type: string
    from:
      $ref: '#/SkillDraftFrom'
    keep:
      type: array
      default: []
      uniqueItems: true
      description: Base file paths to retain untouched. Must be absent from files.
      items:
        type: string
    review:
      type: array
      maxItems: 500
      default: []
      items:
        $ref: '#/SkillReviewFinding'
        unevaluatedProperties: false
SkillReviewFinding:
  type: object
  required: [rule, path, quote, impact, suggestion]
  properties:
    rule:
      type: string
      enum: [requires-shell, requires-binary, requires-local-io, unavailable-tool, suspicious-instruction]
    path:
      type: string
      minLength: 1
      maxLength: 1024
    quote:
      type: string
      minLength: 1
      maxLength: 200
      description: Verbatim file evidence. Quotes not found at path are dropped and counted.
    impact:
      type: string
      minLength: 1
      maxLength: 2000
    suggestion:
      type: string
      minLength: 1
      maxLength: 2000
SkillVerifiedReviewFinding:
  allOf:
    - $ref: '#/SkillReviewFinding'
    - type: object
      required: [line, severity]
      properties:
        line:
          type: integer
          minimum: 1
        severity:
          type: string
          const: warn
SkillScanFinding:
  type: object
  required: [rule, severity, path, line, message]
  properties:
    rule:
      type: string
      enum: [frontmatter-invalid, reserved-name, size-limit, unsafe-path, text-too-large, script-file, facade-script, executable-binary, office-asset, media-asset, missing-reference, ignored-field, hidden-text, name-conflict, hub-verdict]
    severity:
      type: string
      enum: [block, warn, info]
    path:
      type: string
    line:
      type: [integer, "null"]
      minimum: 1
    message:
      type: string
SkillBaseFile:
  type: object
  required: [path, resourceId, etag]
  properties:
    path:
      type: string
    resourceId:
      type: string
      description: Resource identity captured at intake. Current content also available via the draft content endpoint.
    etag:
      type: string
      description: Quoted strong ETag captured at intake.
SkillDraft:
  type: object
  required: [id, kind, state, name, spaceId, previewPath, files, base, keep, removedPaths, scan, review, source, unverifiedReviewCount, compatibility, createdAt, expiresAt, decidedAt, published]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      enum: [create, replace]
    state:
      type: string
      enum: [pending, published, rejected, expired, conflicted]
    name:
      type: string
    spaceId:
      type: string
    previewPath:
      type: string
      description: Author-private browser route /drafts/skills/{id}.
    files:
      type: array
      items:
        type: object
        required: [path, byteSize, sha256, kind, mediaType]
        properties:
          path:
            type: string
          byteSize:
            type: integer
            minimum: 0
          sha256:
            type: string
          kind:
            type: string
            enum: [text, binary]
          mediaType:
            type: string
    base:
      type: [array, "null"]
      description: Null for create; complete replacement file manifest captured at intake otherwise. Original bytes are not snapshotted.
      items:
        $ref: '#/SkillBaseFile'
    keep:
      type: array
      items:
        type: string
    removedPaths:
      type: array
      description: Base paths publication would move to Trash. No permanent byte deletion.
      items:
        type: string
    scan:
      type: array
      items:
        $ref: '#/SkillScanFinding'
    review:
      type: array
      items:
        $ref: '#/SkillVerifiedReviewFinding'
    source:
      oneOf:
        - $ref: '#/ResolvedSkillSource'
        - type: "null"
      description: Exact source version reread at intake. Null for authored files.
    unverifiedReviewCount:
      type: integer
      minimum: 0
    compatibility:
      type: string
      enum: [ready, degraded, blocked]
      description: Blocked for static blocks; degraded for any warning or verified review; ready otherwise.
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    decidedAt:
      type: [string, "null"]
      format: date-time
    published:
      type: [object, "null"]
      required: [folderNodeId]
      properties:
        folderNodeId:
          type: string
SkillDraftEnvelope:
  type: object
  required: [draft]
  properties:
    draft:
      $ref: '#/SkillDraft'
ResolvedSkillSource:
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, hub, owner, repo, commit, path, pageUrl]
      properties:
        kind:
          type: string
          const: git
        hub:
          type: string
          enum: [github, skills-sh]
        owner:
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          maxLength: 255
        repo:
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          maxLength: 255
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        path:
          type: string
          maxLength: 1024
          description: Repository-relative scope folder. Empty for the entire repository.
        pageUrl:
          type: string
          maxLength: 2048
    - type: object
      additionalProperties: false
      required: [kind, owner, slug, version, pageUrl]
      properties:
        kind:
          type: string
          const: clawhub
        owner:
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          maxLength: 255
        slug:
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          maxLength: 255
        version:
          type: string
          pattern: '^[A-Za-z0-9_.+-]+$'
          maxLength: 255
        pageUrl:
          type: string
          maxLength: 2048
    - type: object
      additionalProperties: false
      required: [kind, nodeId, etag]
      properties:
        kind:
          type: string
          const: space
        nodeId:
          type: string
          format: uuid
        etag:
          type: string
          minLength: 1
          maxLength: 100
          description: Quoted Blob ETag or digest of the folder identity, paths and file ETags.
SkillDraftFrom:
  type: object
  additionalProperties: false
  required: [source, skill]
  properties:
    source:
      $ref: '#/ResolvedSkillSource'
    skill:
      type: string
      minLength: 1
      maxLength: 1024
      description: Candidate path returned by source read. Use . for a root Skill.
    overrides:
      type: array
      maxItems: 100
      default: []
      description: Replace or add UTF-8 text files; null deletes a path. Paths must be unique and safe. SKILL.md must remain valid and match name.
      items:
        type: object
        additionalProperties: false
        required: [path, text]
        properties:
          path:
            type: string
            minLength: 1
            maxLength: 1024
          text:
            type: [string, "null"]
ReadSkillSource:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    source:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 4096
          description: GitHub repo/tree/blob URL, skills.sh URL, owner/repo/skill, npx skills add command, ClawHub owner URL/install command, or Space node UUID.
        - $ref: '#/ResolvedSkillSource'
    skill:
      type: string
      minLength: 1
      maxLength: 1024
    path:
      type: string
      minLength: 1
      maxLength: 1024
      description: Relative text path. Requires skill.
    cursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: Opaque continuation for the same pinned source, Skill and path. Requires path.
SkillSourceFileInfo:
  type: object
  required: [path, byteSize, kind]
  properties:
    path:
      type: string
    byteSize:
      type: integer
      minimum: 0
    kind:
      type: string
      enum: [text, binary]
SkillSourceResult:
  oneOf:
    - type: object
      additionalProperties: false
      required: [source, candidates]
      properties:
        source:
          $ref: '#/ResolvedSkillSource'
        candidates:
          type: array
          items:
            type: object
            required: [name, description, path, fileCount, problems]
            properties:
              name:
                type: string
              description:
                type: string
              path:
                type: string
              fileCount:
                type: integer
                minimum: 1
              problems:
                type: array
                items:
                  type: string
    - type: object
      additionalProperties: false
      required: [source, skill, scan]
      properties:
        source:
          $ref: '#/ResolvedSkillSource'
        skill:
          type: object
          required: [name, description, path, files, content]
          properties:
            name:
              type: string
            description:
              type: string
            path:
              type: string
            files:
              type: array
              items:
                $ref: '#/SkillSourceFileInfo'
            content:
              type: string
        scan:
          type: array
          items:
            $ref: '#/SkillScanFinding'
    - type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        truncated:
          type: boolean
          const: true
        cursor:
          type: string
