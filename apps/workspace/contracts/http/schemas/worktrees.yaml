WorktreeKind:
  type: string
  enum: [user, team]

WorktreeVisibility:
  type: string
  enum: [private, space]

WorktreeState:
  type: string
  enum: [draft, ready, merging, merged, discarded]

WorktreeCapabilities:
  type: object
  additionalProperties: false
  required:
    - review
    - editDraft
    - addUnit
    - changeVisibility
    - markReady
    - reopen
    - merge
    - discard
  properties:
    review:
      type: boolean
    editDraft:
      type: boolean
    addUnit:
      type: boolean
    changeVisibility:
      type: boolean
    markReady:
      type: boolean
    reopen:
      type: boolean
    merge:
      type: boolean
    discard:
      type: boolean

WorktreeSummary:
  type: object
  additionalProperties: false
  required:
    - createdVia
    - id
    - number
    - name
    - summary
    - kind
    - teamSpace
    - visibility
    - state
    - creator
    - claimer
    - unitCount
    - processedAt
    - createdAt
    - updatedAt
    - capabilities
    - issue
  properties:
    createdVia:
      $ref: ./identity.yaml#/WriteSource
    id:
      type: string
    number:
      type: [integer, "null"]
      minimum: 1
      description: |
        Repository-level number shown as `#N`. A Team Worktree shares the Team Space's Issue number sequence;
        a User Worktree is numbered per creator. Null for Worktrees created before numbering existed.
    name:
      type: string
    summary:
      type: [string, "null"]
    kind:
      $ref: "#/WorktreeKind"
    teamSpace:
      oneOf:
        - $ref: ./spaces.yaml#/SpaceSummary
        - type: "null"
    visibility:
      $ref: "#/WorktreeVisibility"
    state:
      $ref: "#/WorktreeState"
    creator:
      $ref: ./identity.yaml#/PublicUser
    claimer:
      description: |
        The person who claimed the authoring agent, who can merge the pull request as its author can.
        Null when a person or an unclaimed agent is the author.
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
    pendingPageDrafts:
      type: integer
      minimum: 0
      description: Pending, unexpired HTML View drafts linked to this Worktree, regardless of author. Always returned by current servers.
    unitCount:
      type: integer
      minimum: 0
    processedAt:
      type: [string, "null"]
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    capabilities:
      $ref: "#/WorktreeCapabilities"
    issue:
      description: |
        The Issue in the same Team Space that this pull request serves. Null when none is linked, and
        for a caller who cannot read the Team Space.
      oneOf:
        - $ref: "#/WorktreeIssue"
        - type: "null"

WorktreeIssue:
  type: object
  additionalProperties: false
  required: [number, title, state]
  properties:
    number:
      type: integer
      minimum: 1
    title:
      type: string
    state:
      $ref: ./issues.yaml#/IssueState

WorktreeUnitTarget:
  type: object
  additionalProperties: false
  required: [spaceId, parentNodeId]
  properties:
    spaceId:
      type: string
    parentNodeId:
      type: [string, "null"]

MergeResult:
  type: string
  enum: [pending, merged, unchanged, removed, conflict, failed]
  description: Removed means this Unit was excluded from content publication. Product deletion is complete only when the Worktree is merged and its merge Operation is completed.

WorktreeUnitChange:
  type: string
  enum: [modified, added, deleted, unchanged]

ActivationState:
  type: string
  enum:
    - notApplicable
    - waitingForMerge
    - pending
    - completed
    - failed
    - discarded

WorktreeUnit:
  type: object
  additionalProperties: false
  required:
    - unitId
    - resourceId
    - nodeId
    - source
    - name
    - unitType
    - target
    - draftHeadRevision
    - change
    - mergeResult
    - activationState
    - freshness
  properties:
    unitId:
      type: string
    resourceId:
      type: string
    nodeId:
      type: [string, "null"]
      description: Null when the document no longer has a product Node, including after permanent deletion.
    source:
      type: string
      enum: [trunk, worktree]
    name:
      type: string
    unitType:
      $ref: ./nodes.yaml#/UnitType
    target:
      oneOf:
        - $ref: "#/WorktreeUnitTarget"
        - type: "null"
    draftHeadRevision:
      type: integer
      minimum: 0
    change:
      $ref: "#/WorktreeUnitChange"
    mergeResult:
      $ref: "#/MergeResult"
    activationState:
      $ref: "#/ActivationState"
    freshness:
      description: Null for a Worktree-local Unit, for a Unit that Trunk no longer holds, and once the Worktree leaves draft and ready.
      oneOf:
        - $ref: "#/WorktreeUnitFreshness"
        - type: "null"

WorktreeUnitFreshness:
  type: object
  additionalProperties: false
  description: How far Trunk has moved since this Trunk Unit joined the Worktree. Advice only; it never blocks a merge.
  required: [label, baselineTrunkRevision, revisionsBehind, addedAt]
  properties:
    label:
      type: string
      enum: [current, behind, stale]
      description: current when Trunk has not moved. stale when Trunk is more than 100 revisions ahead or the Unit joined more than 7 days ago. behind otherwise.
    baselineTrunkRevision:
      type: integer
      minimum: 1
      description: The Trunk revision the Worktree copy started from.
    revisionsBehind:
      type: integer
      minimum: 0
      description: Trunk revisions committed since the baseline.
    addedAt:
      type: string
      format: date-time
      description: When the Unit joined the Worktree.

WorktreeDetail:
  allOf:
    - $ref: "#/WorktreeSummary"
    - type: object
      required: [units]
      properties:
        units:
          type: array
          items:
            $ref: "#/WorktreeUnit"
        checks:
          description: Present on a single pull request read. Null when the reader cannot review it.
          oneOf:
            - $ref: "#/WorktreeChecksSummary"
            - type: "null"

WorktreeChecksSummary:
  type: object
  additionalProperties: false
  description: How many checks declared in Trunk's `.agents/checks.md` pass, fail, or have no counting result.
  required: [passed, failed, missing]
  properties:
    passed:
      type: integer
      minimum: 0
    failed:
      type: integer
      minimum: 0
    missing:
      type: integer
      minimum: 0

WorktreeCheckName:
  type: string
  pattern: "^[a-z0-9-]{1,40}$"

WorktreeCheckResult:
  type: object
  additionalProperties: false
  required: [reporter, state, summary, reportedAt, current, counts]
  properties:
    reporter:
      $ref: ./identity.yaml#/PublicUser
    state:
      type: string
      enum: [passed, failed]
    summary:
      type: string
    reportedAt:
      type: string
      format: date-time
    current:
      type: boolean
      description: >-
        Reported on the content the pull request has now, or merged with. The server names the content from every
        Unit's draft and Trunk head revisions and the pending page and file drafts. A Trunk edit to one of its Units, or
        a reopen that changes its content, leaves earlier results out of date.
    counts:
      type: boolean
      description: Current, and reported by someone who may merge the pull request now.

WorktreeCheck:
  type: object
  additionalProperties: false
  required: [name, declared, state, results]
  properties:
    name:
      $ref: "#/WorktreeCheckName"
    declared:
      type: boolean
      description: Declared in Trunk's `.agents/checks.md`. A name that is only reported is kept and shown but not required.
    state:
      type: string
      enum: [passed, failed, missing]
      description: failed when any counting result failed, passed when one passed and none failed, missing otherwise.
    results:
      type: array
      description: Every result on this name, newest first, with out-of-date ones and those that do not count.
      items:
        $ref: "#/WorktreeCheckResult"

WorktreeChecks:
  type: object
  additionalProperties: false
  required: [checks]
  properties:
    checks:
      type: array
      description: Declared checks in file order, then reported names that are not declared.
      items:
        $ref: "#/WorktreeCheck"

ReportWorktreeCheck:
  type: object
  additionalProperties: false
  required: [state]
  properties:
    state:
      type: string
      enum: [passed, failed]
    summary:
      type: string
      maxLength: 1000
      description: What was checked and found.

WorktreeCheckEnvelope:
  type: object
  additionalProperties: false
  required: [check]
  properties:
    check:
      $ref: "#/WorktreeCheck"

WorktreeEnvelope:
  type: object
  additionalProperties: false
  required: [worktree]
  properties:
    worktree:
      $ref: "#/WorktreeDetail"

WorktreeSummaryEnvelope:
  type: object
  additionalProperties: false
  required: [worktree]
  properties:
    worktree:
      $ref: "#/WorktreeSummary"

WorktreeList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, hasCreatedWorktree]
  properties:
    hasCreatedWorktree:
      type: boolean
      description: Whether the authenticated user has a product Worktree creation record, including merged and discarded Worktrees. Independent of list filters and pagination; other users' Team Worktrees do not count.
    items:
      type: array
      items:
        $ref: "#/WorktreeSummary"
    nextCursor:
      type: [string, "null"]

CreateUserWorktree:
  type: object
  additionalProperties: false
  required: [kind, name, summary]
  properties:
    kind:
      const: user
    name:
      type: string
      minLength: 1
      maxLength: 100
    summary:
      type: [string, "null"]
      maxLength: 1000

CreateTeamWorktree:
  type: object
  additionalProperties: false
  required: [kind, teamSpaceId, visibility, name, summary]
  properties:
    kind:
      const: team
    teamSpaceId:
      type: string
    visibility:
      $ref: "#/WorktreeVisibility"
    name:
      type: string
      minLength: 1
      maxLength: 100
    summary:
      type: [string, "null"]
      maxLength: 1000
    issueNumber:
      $ref: "#/IssueNumberLink"

IssueNumberLink:
  type: [integer, "null"]
  minimum: 1
  description: |
    Links the Team Worktree to the Issue with this number in its Team Space; null removes the link.
    The caller must be able to read the Team Space. A number with no Issue there is `INVALID_INPUT`.

CreateWorktree:
  oneOf:
    - $ref: "#/CreateUserWorktree"
    - $ref: "#/CreateTeamWorktree"

PatchWorktree:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    summary:
      type: [string, "null"]
      maxLength: 1000
    visibility:
      $ref: "#/WorktreeVisibility"
    issueNumber:
      $ref: "#/IssueNumberLink"

AddTrunkUnit:
  type: object
  additionalProperties: false
  required: [source, resourceId]
  properties:
    source:
      const: trunk
    resourceId:
      type: string

CreateWorktreeLocalUnit:
  type: object
  additionalProperties: false
  required:
    - source
    - name
    - unitType
    - targetSpaceId
    - targetParentNodeId
  properties:
    source:
      const: worktree
    name:
      type: string
      minLength: 1
      maxLength: 255
    unitType:
      $ref: ./nodes.yaml#/UnitType
    targetSpaceId:
      type: string
    targetParentNodeId:
      type: [string, "null"]
    initialData:
      type: object
      description: >-
        Complete initial Univer Unit data for unitType. When omitted, the
        server creates a blank Unit. The server always overrides id with the
        Unit identity reserved from the Idempotency-Key and resets rev to the
        initial revision.
      additionalProperties: true

AddWorktreeUnit:
  oneOf:
    - $ref: "#/AddTrunkUnit"
    - $ref: "#/CreateWorktreeLocalUnit"

WorktreeUnitEnvelope:
  type: object
  additionalProperties: false
  required: [unit]
  properties:
    unit:
      $ref: "#/WorktreeUnit"

WorktreeOpenMode:
  type: string
  enum: [draft, trunk, mergePreview]

OpenWorktreeUnit:
  type: object
  additionalProperties: false
  required: [mode]
  properties:
    mode:
      $ref: "#/WorktreeOpenMode"

OpenedWorktreeUnit:
  type: object
  additionalProperties: false
  required: [unitId, unitType, editorMode]
  properties:
    unitId:
      type: string
    unitType:
      $ref: ./nodes.yaml#/UnitType
    editorMode:
      $ref: ./resources.yaml#/EditorMode

CollaborationScope:
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: trunk
    - type: object
      additionalProperties: false
      required: [kind, worktreeId]
      properties:
        kind:
          type: string
          enum: [worktree, mergePreview]
        worktreeId:
          type: string

WorktreeUnitOpenView:
  type: object
  additionalProperties: false
  required: [unit, collaborationScope]
  properties:
    unit:
      $ref: "#/OpenedWorktreeUnit"
    collaborationScope:
      $ref: "#/CollaborationScope"

ProtocolMutation:
  type: object
  additionalProperties: false
  required: [id, data]
  properties:
    id:
      type: string
      minLength: 1
    data:
      type: string

WorktreeChangeset:
  type: object
  additionalProperties: false
  required:
    - unitID
    - type
    - baseRev
    - revision
    - userID
    - memberID
    - sid
    - reqId
    - mutations
  properties:
    unitID:
      type: string
    type:
      type: integer
      enum: [1, 2, 3, 5, 6]
      description: Univer protocol Unit type.
    baseRev:
      type: integer
      minimum: 1
    revision:
      type: integer
      minimum: 2
    userID:
      type: string
      description: Ignored on input and replaced with the authenticated User ID.
    memberID:
      type: string
      description: Ignored on input and replaced with a server-owned member ID.
    sid:
      type: string
      minLength: 1
    reqId:
      type: integer
      minimum: 1
    mutations:
      type: array
      items:
        $ref: "#/ProtocolMutation"
    mutationSize:
      type: integer
      minimum: 0
    additionalFields:
      type: string
    createTime:
      type: integer
      minimum: 0

SubmitWorktreeChangeset:
  type: object
  additionalProperties: false
  required: [changeset]
  properties:
    changeset:
      $ref: "#/WorktreeChangeset"

WorktreeChangesetError:
  type: object
  additionalProperties: false
  required: [code, message, retryable]
  properties:
    code:
      type: string
    message:
      type: string
    retryable:
      type: boolean
    details:
      type: object
      additionalProperties: true

WorktreeChangesetSubmitResult:
  oneOf:
    - type: object
      additionalProperties: false
      required: [status, changeset]
      properties:
        status:
          type: string
          enum: [committed, already-committed]
        changeset:
          $ref: "#/WorktreeChangeset"
    - type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          type: string
          enum: [rejected, retry]
        error:
          $ref: "#/WorktreeChangesetError"

WorktreeOperationResponse:
  type: object
  additionalProperties: false
  required: [operation, worktree]
  properties:
    operation:
      $ref: ./operations.yaml#/OperationView
    worktree:
      $ref: "#/WorktreeSummary"

MergeWorktree:
  type: object
  additionalProperties: false
  properties:
    pageDraftIds:
      type: array
      description: |
        IDs of the drafts the merger reviewed in `GET /api/worktrees/{worktreeId}/html-view-drafts` with state
        `pending` or `conflicted`, which for an unmerged pull request are its pending, unexpired drafts, pages and
        files alike. Order does not matter. Omit it when the merger did not review the pages. The name predates
        file drafts and is kept for existing clients.
      items:
        type: string
        minLength: 1

WorktreeMergeResponse:
  type: object
  additionalProperties: false
  required: [operation, worktree, publishedPages]
  properties:
    operation:
      $ref: ./operations.yaml#/OperationView
    worktree:
      $ref: "#/WorktreeSummary"
    publishedPages:
      type: array
      description: Pages and files this merge published as the merger. Already published drafts are omitted on replay.
      items:
        type: object
        additionalProperties: false
        required: [draftId, name, nodeId]
        properties:
          draftId:
            type: string
          name:
            type: string
          nodeId:
            type: string
