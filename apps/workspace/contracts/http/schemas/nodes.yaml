UnitType:
  type: string
  enum: [sheet, doc, slide, board, base, pdf]

AccessRole:
  type: string
  enum: [owner, admin, editor, viewer]

NodeCapabilities:
  type: object
  additionalProperties: false
  required: [browseChildren, createChildren, rename, move, trash, share]
  properties:
    browseChildren:
      type: boolean
    createChildren:
      type: boolean
    rename:
      type: boolean
    move:
      type: boolean
    trash:
      type: boolean
    share:
      type: boolean

ResourceCapabilities:
  type: object
  additionalProperties: false
  required: [openContent, editContent, downloadContent]
  properties:
    openContent:
      type: boolean
    editContent:
      type: boolean
    downloadContent:
      type: boolean

UniverResourceSummary:
  type: object
  additionalProperties: false
  required: [id, kind, unitId, unitType, capabilities]
  properties:
    id:
      type: string
    kind:
      type: string
      const: univer
    unitId:
      type: string
    unitType:
      $ref: "#/UnitType"
    capabilities:
      $ref: "#/ResourceCapabilities"

BlobAvailability:
  type: string
  enum: [ready, quarantined]

BlobResourceSummary:
  type: object
  additionalProperties: false
  required: [id, kind, mediaType, byteSize, availability, capabilities]
  properties:
    id:
      type: string
    kind:
      type: string
      const: blob
    mediaType:
      type: string
    byteSize:
      type: integer
      minimum: 0
    availability:
      $ref: "#/BlobAvailability"
    capabilities:
      $ref: "#/ResourceCapabilities"

ResourceSummary:
  oneOf:
    - $ref: "#/UniverResourceSummary"
    - $ref: "#/BlobResourceSummary"
  discriminator:
    propertyName: kind
    mapping:
      univer: "#/UniverResourceSummary"
      blob: "#/BlobResourceSummary"

NodeSummary:
  type: object
  additionalProperties: false
  required:
    - id
    - spaceId
    - parentNodeId
    - name
    - resource
    - hasChildren
    - updatedAt
    - accessRole
    - capabilities
  properties:
    id:
      type: string
    spaceId:
      type: string
    parentNodeId:
      type: [string, "null"]
    name:
      type: string
    resource:
      oneOf:
        - $ref: "#/ResourceSummary"
        - type: "null"
    hasChildren:
      type: boolean
    updatedAt:
      type: string
      format: date-time
    accessRole:
      $ref: "#/AccessRole"
    capabilities:
      $ref: "#/NodeCapabilities"

Breadcrumb:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string

NodePage:
  type: object
  additionalProperties: false
  required:
    - space
    - parentNode
    - navigationRootNodeId
    - breadcrumbs
    - nodes
    - nextCursor
  properties:
    space:
      $ref: ./spaces.yaml#/SpaceSummary
    parentNode:
      oneOf:
        - $ref: "#/NodeSummary"
        - type: "null"
    navigationRootNodeId:
      type: [string, "null"]
    breadcrumbs:
      type: array
      items:
        $ref: "#/Breadcrumb"
    nodes:
      type: array
      items:
        $ref: "#/NodeSummary"
    nextCursor:
      type: [string, "null"]

NodeOwner:
  type: object
  description: |
    Owner of the Personal Space that holds the Node, shown to every reader as the file's author.
    It carries no ID, username or Email.
  additionalProperties: false
  required: [displayName, kind]
  properties:
    displayName:
      type: string
    kind:
      type: string
      enum: [human, agent]
    claimed:
      type: boolean
      description: Present only for an agent. Whether a human has claimed it.

NodeResponse:
  type: object
  additionalProperties: false
  required: [node, space, owner, breadcrumbs, navigationRootNodeId, copiedFromNodeId]
  properties:
    node:
      $ref: "#/NodeSummary"
    space:
      $ref: ./spaces.yaml#/SpaceSummary
    owner:
      description: Null for a Node in a Team Space, which has no single author.
      oneOf:
        - $ref: "#/NodeOwner"
        - type: "null"
    breadcrumbs:
      type: array
      items:
        $ref: "#/Breadcrumb"
    navigationRootNodeId:
      type: [string, "null"]
    copiedFromNodeId:
      description: The Node this file was copied from, returned only to the copy's owner and editors. Every other reader, anonymous included, gets null, because a link-shared source's Node ID is its access link. Also null for a file that is not a copy, and after the source is permanently deleted. The reader may be unable to open the source.
      type: [string, "null"]

CopyNode:
  type: object
  additionalProperties: false
  required: [target]
  properties:
    name:
      description: Name of the copy. Defaults to the name of the source.
      type: string
      minLength: 1
      maxLength: 255
    target:
      oneOf:
        - $ref: "#/CopyToPersonalSpace"
        - $ref: "#/CopyToWorktree"
      discriminator:
        propertyName: kind
        mapping:
          personalSpace: "#/CopyToPersonalSpace"
          worktree: "#/CopyToWorktree"

CopyToPersonalSpace:
  description: The root of the caller's Personal Space.
  type: object
  additionalProperties: false
  required: [kind]
  properties:
    kind:
      type: string
      const: personalSpace

CopyToWorktree:
  description: A new file in a draft pull request, which lands at the given place when the pull request is merged. Sheet, Doc and Slide only.
  type: object
  additionalProperties: false
  required: [kind, worktreeId, spaceId, parentNodeId]
  properties:
    kind:
      type: string
      const: worktree
    worktreeId:
      type: string
    spaceId:
      type: string
    parentNodeId:
      type: [string, "null"]

CopyNodeResponse:
  oneOf:
    - $ref: ./resources.yaml#/ResourceCreateResponse
    - $ref: "#/CopyIntoWorktreeResponse"

CopyIntoWorktreeResponse:
  type: object
  additionalProperties: false
  required: [operation, unit]
  properties:
    operation:
      $ref: ./operations.yaml#/OperationView
    unit:
      $ref: ./worktrees.yaml#/WorktreeUnit

CreateNode:
  type: object
  additionalProperties: false
  required: [spaceId, parentNodeId, name]
  properties:
    spaceId:
      type: string
    parentNodeId:
      type: [string, "null"]
    name:
      type: string
      minLength: 1
      maxLength: 255

PatchNode:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    parentNodeId:
      type: [string, "null"]

CreateNodeReport:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 1000

NodeReport:
  type: object
  additionalProperties: false
  required: [id]
  properties:
    id:
      type: string
