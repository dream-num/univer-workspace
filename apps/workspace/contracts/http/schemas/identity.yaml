User:
  type: object
  additionalProperties: false
  required: [id, username, displayName, avatarUrl]
  properties:
    id:
      type: string
    username:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: [string, "null"]
      format: uri

PublicUser:
  $ref: "#/User"

ExternalIdentitySummary:
  type: object
  additionalProperties: false
  required: [provider, providerUsername]
  properties:
    provider:
      type: string
      enum: [github, google, discord]
    providerUsername:
      type: string

AuthenticationMethods:
  type: object
  additionalProperties: false
  required: [password, email, externalIdentities]
  properties:
    password:
      type: boolean
    email:
      type: [string, "null"]
      format: email
      description: Verified Email address used for passwordless sign-in, when the User has one.
    externalIdentities:
      type: array
      items:
        $ref: "#/ExternalIdentitySummary"

AnonymousSession:
  type: object
  additionalProperties: false
  required: [authenticated, githubOAuthEnabled, googleOAuthEnabled, discordOAuthEnabled, passwordAuthEnabled, emailAuthEnabled]
  properties:
    authenticated:
      const: false
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean

AuthenticatedSession:
  type: object
  additionalProperties: false
  required:
    - authenticated
    - githubOAuthEnabled
    - googleOAuthEnabled
    - discordOAuthEnabled
    - passwordAuthEnabled
    - emailAuthEnabled
    - trialDeployment
    - user
    - authenticationMethods
  properties:
    authenticated:
      const: true
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean
    trialDeployment:
      type: boolean
      description: Whether this deployment is a trial environment without a data durability guarantee.
    user:
      $ref: "#/User"
    authenticationMethods:
      $ref: "#/AuthenticationMethods"

SessionView:
  oneOf:
    - $ref: "#/AnonymousSession"
    - $ref: "#/AuthenticatedSession"

PasswordRegistration:
  type: object
  additionalProperties: false
  required: [username, displayName, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    password:
      type: string
      minLength: 8
      maxLength: 200

PasswordLogin:
  type: object
  additionalProperties: false
  required: [username, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    password:
      type: string

EmailLoginCodeRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254

EmailLoginCodeIssued:
  type: object
  additionalProperties: false
  required: [expiresIn, resendAfter]
  properties:
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime of the emailed code in seconds.
    resendAfter:
      type: integer
      minimum: 1
      description: Seconds before another code may be requested for the same address.

EmailLogin:
  type: object
  additionalProperties: false
  required: [email, code]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    code:
      type: string
      pattern: "^[0-9]{6}$"

CliAuthorizationStart:
  type: object
  additionalProperties: false
  required:
    - deviceCode
    - userCode
    - verificationUri
    - verificationUriComplete
    - expiresIn
    - interval
  properties:
    deviceCode:
      type: string
      minLength: 40
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
    verificationUri:
      type: string
      pattern: ^/
    verificationUriComplete:
      type: string
      pattern: ^/
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime in seconds.
    interval:
      type: integer
      minimum: 1
      description: Minimum polling interval in seconds.

CliAuthorizationApproval:
  type: object
  additionalProperties: false
  required: [userCode]
  properties:
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$"

CliAuthorizationExchange:
  type: object
  additionalProperties: false
  required: [deviceCode]
  properties:
    deviceCode:
      type: string
      minLength: 40

CliAuthorizationPending:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      const: pending

DiscordBotLogin:
  type: object
  additionalProperties: false
  required: [discordUserId]
  properties:
    discordUserId:
      type: string
      description: Stable Discord snowflake User ID from a trusted Bot event.
      pattern: "^[1-9][0-9]{0,19}$"
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    avatarUrl:
      type: [string, "null"]
      format: uri

PasswordChange:
  type: object
  additionalProperties: false
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
    newPassword:
      type: string
      minLength: 8
      maxLength: 200

UserProfilePatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    avatarUrl:
      type: [string, "null"]
      format: uri

WriteSource:
  type: string
  enum: [browser, agent, unknown]
  description: |
    Entry point of the Session that made a write. `browser` = the Workspace web app's sign-in routes.
    `agent` = any non-browser entry point (uvw CLI, Workspace Agent, OAuth clients, Discord bot); it does not
    identify who was typing. `unknown` = recorded before attribution existed, or by a Session issued before it.

McpScope:
  type: string
  enum: [read, write, publish, "worktree:merge"]

PersonalAccessToken:
  type: object
  additionalProperties: false
  required: [id, name, scopes, createdAt, expiresAt, lastUsedAt, revokedAt]
  properties:
    id:
      type: string
    name:
      type: string
    scopes:
      type: array
      items:
        $ref: "#/McpScope"
    createdAt:
      type: integer
      description: Unix epoch milliseconds.
    expiresAt:
      type: [integer, "null"]
    lastUsedAt:
      type: [integer, "null"]
    revokedAt:
      type: [integer, "null"]

PersonalAccessTokenList:
  type: object
  additionalProperties: false
  required: [tokens]
  properties:
    tokens:
      type: array
      items:
        $ref: "#/PersonalAccessToken"

PersonalAccessTokenCreate:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    scopes:
      type: array
      minItems: 1
      items:
        $ref: "#/McpScope"
      description: Defaults to all scopes.
    expiresAt:
      type: [integer, "null"]
      description: Unix epoch milliseconds in the future. Defaults to null (no expiry).

PersonalAccessTokenCreated:
  type: object
  additionalProperties: false
  required: [token, record]
  properties:
    token:
      type: string
      description: Plaintext token, shown once.
    record:
      $ref: "#/PersonalAccessToken"

TokenExchangeRequest:
  type: object
  required: [grant_type, client_id, client_secret, subject_token, subject_token_type]
  properties:
    grant_type:
      type: string
      enum: [urn:ietf:params:oauth:grant-type:token-exchange]
    client_id:
      type: string
    client_secret:
      type: string
    subject_token:
      type: string
      description: A personal access token or an MCP OAuth access token.
    subject_token_type:
      type: string
      enum: [urn:ietf:params:oauth:token-type:access_token]
    resource:
      type: string
      description: Required for OAuth access tokens; ignored for personal access tokens.

TokenExchangeSubject:
  type: object
  additionalProperties: false
  required: [kind, id, client_id]
  properties:
    kind:
      type: string
      enum: [pat, oauth]
    id:
      type: string
    client_id:
      type: [string, "null"]
      description: The OAuth client the grant was issued to; null for personal access tokens.

OAuthTokenError:
  type: object
  additionalProperties: false
  required: [error]
  properties:
    error:
      type: string
      enum: [invalid_request, invalid_grant, unauthorized_client, invalid_client]
    error_description:
      type: string
      description: Present for dynamically registered MCP clients.

McpAuthorizationCodeRequest:
  type: object
  description: Authorization code grant for a dynamically registered (public) MCP client.
  required: [grant_type, code, client_id, redirect_uri, code_verifier, resource]
  properties:
    grant_type:
      type: string
      enum: [authorization_code]
    code:
      type: string
    client_id:
      type: string
    redirect_uri:
      type: string
      description: The exact redirect URI of the authorization request, including a loopback port.
    code_verifier:
      type: string
    resource:
      type: string
      description: Must equal the `resource` of the authorization request.

McpRefreshTokenRequest:
  type: object
  description: Refresh token grant for a dynamically registered MCP client. The refresh token rotates.
  required: [grant_type, refresh_token, client_id, resource]
  properties:
    grant_type:
      type: string
      enum: [refresh_token]
    refresh_token:
      type: string
    client_id:
      type: string
    resource:
      type: string
      description: Must equal the resource the grant was issued for.
    scope:
      type: string
      description: Ignored; a refreshed grant keeps its granted scopes.

McpTokenResponse:
  type: object
  additionalProperties: false
  required: [access_token, token_type, expires_in, refresh_token, scope]
  properties:
    access_token:
      type: string
      description: A `uvw_at_` access token bound to the grant's resource.
    token_type:
      type: string
      enum: [Bearer]
    expires_in:
      type: integer
    refresh_token:
      type: string
      description: A `uvw_rt_` refresh token. Presenting a rotated one within 60 seconds fails; later it revokes the grant.
    scope:
      type: string
      description: Granted MCP scopes, space-separated.

AuthorizationServerMetadata:
  type: object
  additionalProperties: false
  required:
    - issuer
    - authorization_endpoint
    - token_endpoint
    - registration_endpoint
    - revocation_endpoint
    - response_types_supported
    - grant_types_supported
    - code_challenge_methods_supported
    - token_endpoint_auth_methods_supported
    - revocation_endpoint_auth_methods_supported
    - scopes_supported
  properties:
    issuer:
      type: string
      description: The configured `PUBLIC_ORIGIN`.
    authorization_endpoint:
      type: string
    token_endpoint:
      type: string
    registration_endpoint:
      type: string
    revocation_endpoint:
      type: string
    response_types_supported:
      type: array
      items:
        type: string
        enum: [code]
    grant_types_supported:
      type: array
      items:
        type: string
        enum: [authorization_code, refresh_token]
    code_challenge_methods_supported:
      type: array
      items:
        type: string
        enum: [S256]
    token_endpoint_auth_methods_supported:
      type: array
      items:
        type: string
        enum: [none]
    revocation_endpoint_auth_methods_supported:
      type: array
      items:
        type: string
        enum: [none]
    scopes_supported:
      type: array
      items:
        $ref: "#/McpScope"

ClientRegistrationRequest:
  type: object
  description: |
    RFC 7591 metadata for a public native client. Other metadata, such as
    `client_uri` or `application_type`, is accepted and ignored.
  required: [redirect_uris]
  properties:
    redirect_uris:
      type: array
      minItems: 1
      maxItems: 10
      description: |
        Each URI is a loopback `http` URL (`127.0.0.1`, `[::1]` or
        `localhost`), an `https` URL, or a reverse-domain private-use scheme
        such as `com.example.app:/callback`, without a fragment or
        credentials.
      items:
        type: string
    client_name:
      type: string
      maxLength: 100
    grant_types:
      type: array
      description: Must include `authorization_code`. Defaults to both supported grants.
      items:
        type: string
        enum: [authorization_code, refresh_token]
    response_types:
      type: array
      items:
        type: string
        enum: [code]
    token_endpoint_auth_method:
      type: string
      enum: [none]
    scope:
      type: string
      description: A space-separated subset of the MCP scopes.

ClientRegistrationResponse:
  type: object
  additionalProperties: false
  required: [client_id, client_id_issued_at, redirect_uris, grant_types, response_types, token_endpoint_auth_method, scope]
  properties:
    client_id:
      type: string
    client_id_issued_at:
      type: integer
      description: Unix epoch seconds.
    client_name:
      type: string
    redirect_uris:
      type: array
      items:
        type: string
    grant_types:
      type: array
      items:
        type: string
        enum: [authorization_code, refresh_token]
    response_types:
      type: array
      items:
        type: string
        enum: [code]
    token_endpoint_auth_method:
      type: string
      enum: [none]
    scope:
      type: string
      description: The MCP scopes the client may request.

ClientRegistrationError:
  type: object
  additionalProperties: false
  required: [error, error_description]
  properties:
    error:
      type: string
      enum: [invalid_redirect_uri, invalid_client_metadata, temporarily_unavailable]
    error_description:
      type: string

TokenRevocationRequest:
  type: object
  required: [token, client_id]
  properties:
    token:
      type: string
      description: A current access or refresh token of the client's grant.
    token_type_hint:
      type: string
      description: Ignored.
    client_id:
      type: string
