User:
  type: object
  additionalProperties: false
  required: [id, username, displayName, avatarUrl]
  properties:
    id:
      type: string
    username:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: [string, "null"]
      format: uri

PublicUser:
  $ref: "#/User"

ExternalIdentitySummary:
  type: object
  additionalProperties: false
  required: [provider, providerUsername]
  properties:
    provider:
      type: string
      enum: [github, google, discord]
    providerUsername:
      type: string

AuthenticationMethods:
  type: object
  additionalProperties: false
  required: [password, email, externalIdentities]
  properties:
    password:
      type: boolean
    email:
      type: [string, "null"]
      format: email
      description: Verified Email address used for passwordless sign-in, when the User has one.
    externalIdentities:
      type: array
      items:
        $ref: "#/ExternalIdentitySummary"

AnonymousSession:
  type: object
  additionalProperties: false
  required: [authenticated, githubOAuthEnabled, googleOAuthEnabled, discordOAuthEnabled, passwordAuthEnabled, emailAuthEnabled]
  properties:
    authenticated:
      const: false
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean

AuthenticatedSession:
  type: object
  additionalProperties: false
  required:
    - authenticated
    - githubOAuthEnabled
    - googleOAuthEnabled
    - discordOAuthEnabled
    - passwordAuthEnabled
    - emailAuthEnabled
    - trialDeployment
    - user
    - authenticationMethods
  properties:
    authenticated:
      const: true
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean
    trialDeployment:
      type: boolean
      description: Whether this deployment is a trial environment without a data durability guarantee.
    user:
      $ref: "#/User"
    authenticationMethods:
      $ref: "#/AuthenticationMethods"

SessionView:
  oneOf:
    - $ref: "#/AnonymousSession"
    - $ref: "#/AuthenticatedSession"

PasswordRegistration:
  type: object
  additionalProperties: false
  required: [username, displayName, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    password:
      type: string
      minLength: 8
      maxLength: 200

PasswordLogin:
  type: object
  additionalProperties: false
  required: [username, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    password:
      type: string

EmailLoginCodeRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254

EmailLoginCodeIssued:
  type: object
  additionalProperties: false
  required: [expiresIn, resendAfter]
  properties:
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime of the emailed code in seconds.
    resendAfter:
      type: integer
      minimum: 1
      description: Seconds before another code may be requested for the same address.

EmailLogin:
  type: object
  additionalProperties: false
  required: [email, code]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    code:
      type: string
      pattern: "^[0-9]{6}$"

CliAuthorizationStart:
  type: object
  additionalProperties: false
  required:
    - deviceCode
    - userCode
    - verificationUri
    - verificationUriComplete
    - expiresIn
    - interval
  properties:
    deviceCode:
      type: string
      minLength: 40
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
    verificationUri:
      type: string
      pattern: ^/
    verificationUriComplete:
      type: string
      pattern: ^/
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime in seconds.
    interval:
      type: integer
      minimum: 1
      description: Minimum polling interval in seconds.

CliAuthorizationApproval:
  type: object
  additionalProperties: false
  required: [userCode]
  properties:
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$"

CliAuthorizationExchange:
  type: object
  additionalProperties: false
  required: [deviceCode]
  properties:
    deviceCode:
      type: string
      minLength: 40

CliAuthorizationPending:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      const: pending

DiscordBotLogin:
  type: object
  additionalProperties: false
  required: [discordUserId]
  properties:
    discordUserId:
      type: string
      description: Stable Discord snowflake User ID from a trusted Bot event.
      pattern: "^[1-9][0-9]{0,19}$"
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    avatarUrl:
      type: [string, "null"]
      format: uri

PasswordChange:
  type: object
  additionalProperties: false
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
    newPassword:
      type: string
      minLength: 8
      maxLength: 200

UserProfilePatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    avatarUrl:
      type: [string, "null"]
      format: uri
