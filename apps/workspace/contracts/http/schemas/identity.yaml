User:
  type: object
  description: The authenticated User, with the kind of principal it is.
  additionalProperties: false
  required: [id, username, displayName, avatarUrl, kind]
  properties:
    id:
      type: string
    username:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: [string, "null"]
      format: uri
    kind:
      type: string
      enum: [human, agent]
    claimed:
      type: boolean
      description: Present only for an agent. Whether a human has claimed it.

PublicUser:
  type: object
  additionalProperties: false
  required: [id, username, displayName, avatarUrl]
  properties:
    id:
      type: string
    username:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: [string, "null"]
      format: uri

ExternalIdentitySummary:
  type: object
  additionalProperties: false
  required: [provider, providerUsername]
  properties:
    provider:
      type: string
      enum: [github, google, discord]
    providerUsername:
      type: string

AuthenticationMethods:
  type: object
  additionalProperties: false
  required: [password, email, externalIdentities]
  properties:
    password:
      type: boolean
    email:
      type: [string, "null"]
      format: email
      description: Verified Email address used for passwordless sign-in, when the User has one.
    externalIdentities:
      type: array
      items:
        $ref: "#/ExternalIdentitySummary"

AnonymousSession:
  type: object
  additionalProperties: false
  required: [authenticated, githubOAuthEnabled, googleOAuthEnabled, discordOAuthEnabled, passwordAuthEnabled, emailAuthEnabled, guestAuthEnabled]
  properties:
    authenticated:
      const: false
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean
    guestAuthEnabled:
      type: boolean
      description: Whether guest agents are on, for POST /api/auth/guest and POST /api/auth/authorize/guest. False when AGENT_CREATE_LIMIT_PER_HOUR is 0.

AuthenticatedSession:
  type: object
  additionalProperties: false
  required:
    - authenticated
    - githubOAuthEnabled
    - googleOAuthEnabled
    - discordOAuthEnabled
    - passwordAuthEnabled
    - emailAuthEnabled
    - trialDeployment
    - user
    - authenticationMethods
  properties:
    authenticated:
      const: true
    githubOAuthEnabled:
      type: boolean
    googleOAuthEnabled:
      type: boolean
    discordOAuthEnabled:
      type: boolean
    passwordAuthEnabled:
      type: boolean
    emailAuthEnabled:
      type: boolean
    trialDeployment:
      type: boolean
      description: Whether this deployment is a trial environment without a data durability guarantee.
    user:
      $ref: "#/User"
    authenticationMethods:
      $ref: "#/AuthenticationMethods"
    executorAccess:
      const: true
      description: Present only when an operator granted this User the shared MCP executor with `db:executor-access`.
    budget:
      $ref: "#/AgentBudget"

AgentBudget:
  type: object
  additionalProperties: false
  description: |
    Present only for an agent, on `GET /api/session`. What it has used of the limits every agent works
    within; people have none. A create or merge past a limit is refused with `403 AGENT_QUOTA_EXCEEDED`.
  required: [openWorktrees, merges]
  properties:
    openWorktrees:
      $ref: "#/BudgetUse"
      description: |
        Worktrees (pull requests) the agent created that are not merged or discarded, those still being
        created included. Merging or discarding one frees its place.
    merges:
      $ref: "#/BudgetUse"
      description: Merges the agent started in the last 24 hours. Each leaves the count 24 hours after it started.

BudgetUse:
  type: object
  additionalProperties: false
  required: [used, limit]
  properties:
    used:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1

SessionView:
  oneOf:
    - $ref: "#/AnonymousSession"
    - $ref: "#/AuthenticatedSession"

PasswordRegistration:
  type: object
  additionalProperties: false
  required: [username, displayName, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
      description: A Hangul filler or another invisible character fails with 400 `INVALID_INPUT` on `username`.
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Shown to everyone who opens the User's shared files. A value longer than 100 characters (code
        points) fails first. The server then replaces control characters, line and paragraph separators,
        U+2800 and U+1D159 with a space, and removes bidi controls, Hangul fillers, the other
        default-ignorable code points, format characters other than the prepended concatenation marks
        (such as U+0600 ARABIC NUMBER SIGN), unpaired surrogates and U+FFFD. It keeps a zero-width joiner
        or non-joiner between two characters, a zero-width joiner after a virama, a variation selector
        after a character and the tag characters of an RGI subdivision flag (England, Scotland, Wales),
        so emoji, Persian and Indic names keep their bytes. Whitespace runs collapse to one space and
        the ends are trimmed. The result is stored. It fails with 400 `INVALID_INPUT` on `displayName`
        when it has no visible character (spaces, combining marks, U+FFFC and private-use characters
        alone are not visible) or when it contains an email address. An address is `local@domain.tld`,
        also with spaces after `@` or on both sides of it, repeated `@`, U+FF20 or U+FE6B for `@`,
        U+2024, U+3002, U+FE52, U+FF0E or U+FF61 for the dot, a `mailto:` prefix, or an invisible local
        part. A space only before `@` makes a handle, as in `Team @acme.io`.
        `alice [at] example.com`, `alice(at)example.com` and `alice@example` are not detected.
    password:
      type: string
      minLength: 8
      maxLength: 200

PasswordLogin:
  type: object
  additionalProperties: false
  required: [username, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
    password:
      type: string

EmailLoginCodeRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254

EmailLoginCodeIssued:
  type: object
  additionalProperties: false
  required: [expiresIn, resendAfter]
  properties:
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime of the emailed code in seconds.
    resendAfter:
      type: integer
      minimum: 1
      description: Seconds before another code may be requested for the same address.

EmailLogin:
  type: object
  additionalProperties: false
  required: [email, code]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    code:
      type: string
      pattern: "^[0-9]{6}$"

CliAuthorizationStart:
  type: object
  additionalProperties: false
  required:
    - deviceCode
    - userCode
    - verificationUri
    - verificationUriComplete
    - expiresIn
    - interval
  properties:
    deviceCode:
      type: string
      minLength: 40
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
    verificationUri:
      type: string
      pattern: ^/
    verificationUriComplete:
      type: string
      pattern: ^/
    expiresIn:
      type: integer
      minimum: 1
      description: Lifetime in seconds.
    interval:
      type: integer
      minimum: 1
      description: Minimum polling interval in seconds.

CliAuthorizationApproval:
  type: object
  additionalProperties: false
  required: [userCode]
  properties:
    userCode:
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$"

CliAuthorizationExchange:
  type: object
  additionalProperties: false
  required: [deviceCode]
  properties:
    deviceCode:
      type: string
      minLength: 40

CliAuthorizationPending:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      const: pending

DiscordBotLogin:
  type: object
  additionalProperties: false
  required: [discordUserId]
  properties:
    discordUserId:
      type: string
      description: Stable Discord snowflake User ID from a trusted Bot event.
      pattern: "^[1-9][0-9]{0,19}$"
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
      description: |
        A new User's username drops invisible characters, and is `discord-<discordUserId>` when none
        is left.
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Cleaned as `PasswordRegistration.displayName` describes, but never refused: an email address
        keeps only its local part and a longer name is cut to 100 characters between whole graphemes.
        A name with no visible character falls back to the Discord username, cleaned the same way, and
        then to `Workspace User`.
    avatarUrl:
      type: [string, "null"]
      format: uri

PasswordChange:
  type: object
  additionalProperties: false
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
    newPassword:
      type: string
      minLength: 8
      maxLength: 200

UserProfilePatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{N}._-]+$'
      description: A changed username follows the rule in `PasswordRegistration.username`.
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Follows the rule in `PasswordRegistration.displayName`. A Personal Space still named
        `<old display name> 的个人空间` is renamed to match; a renamed Personal Space keeps its name.
    avatarUrl:
      type: [string, "null"]
      format: uri

WriteSource:
  type: string
  enum: [browser, agent, unknown]
  description: |
    Entry point of the Session that made a write. `browser` = the Workspace web app's sign-in routes.
    `agent` = any non-browser entry point (uvw CLI, Workspace Agent, OAuth clients, Discord bot); it does not
    identify who was typing. `unknown` = recorded before attribution existed, or by a Session issued before it.

McpScope:
  type: string
  enum: [read, write, publish, "worktree:merge"]

AccessTier:
  type: string
  enum: [read, read_write]
  description: What a person lets a connection do. `read` grants the `read` scope, and `read_write` grants `read write publish worktree:merge`.

AgentTokenScopes:
  type: array
  minItems: 1
  maxItems: 2
  uniqueItems: true
  contains:
    const: read
  items:
    type: string
    enum: [read, write, publish]
  description: Exactly [read], [read, write], or [read, publish], in either order, without duplicates.

AgentTokenCreate:
  type: object
  required: [scopes]
  properties:
    scopes:
      $ref: "#/AgentTokenScopes"

AgentTokenCreated:
  type: object
  additionalProperties: false
  required: [token, expiresAt, scopes, resource]
  properties:
    token:
      type: string
      pattern: "^uvw_at_"
      description: MCP access token. No refresh token is returned.
    expiresAt:
      type: integer
      description: Unix epoch milliseconds, one hour after issuance.
    scopes:
      $ref: "#/AgentTokenScopes"
    resource:
      type: string
      format: uri
      description: The configured /mcp URL at PUBLIC_ORIGIN.

AgentCreate:
  type: object
  properties:
    label:
      type: string
      maxLength: 64
      description: |
        Names the agent after it is cleaned as `PasswordRegistration.displayName` describes; an email
        address keeps only its local part. Blank, omitted or no visible character means `agent`.

GuestAgentCreate:
  type: object
  properties:
    label:
      type: string
      maxLength: 64
      description: |
        Names the agent after it is cleaned as `PasswordRegistration.displayName` describes; an email
        address keeps only its local part. Blank, omitted or no visible character means `agent`.

GuestAuthorizationCreate:
  type: object
  additionalProperties: false
  required: [oauthAuthorization]
  properties:
    oauthAuthorization:
      type: string
      description: The query string of the `/api/auth/authorize` request the connect page shows, without the leading `?`.

AgentIdentity:
  type: object
  additionalProperties: false
  required: [id, username]
  properties:
    id:
      type: string
    username:
      type: string

AgentCreated:
  type: object
  additionalProperties: false
  required: [agent, token, mcpUrl, expiresAt]
  properties:
    agent:
      $ref: "#/AgentIdentity"
    token:
      type: string
      pattern: "^uvw_pat_"
      description: Personal access token with every MCP scope.
    mcpUrl:
      type: [string, "null"]
      format: uri
      description: The first URL in MCP_RESOURCE_URLS, or null when none is configured.
    expiresAt:
      type: integer
      description: Unix epoch milliseconds when the unclaimed agent expires, 30 days after creation.

GuestAgentCreated:
  type: object
  additionalProperties: false
  required: [agent]
  properties:
    agent:
      $ref: "#/AgentIdentity"

AgentClaimCode:
  type: object
  additionalProperties: false
  required: [code, claimUrl, expiresIn]
  properties:
    code:
      type: string
      pattern: "^[A-Za-z0-9_-]{22}$"
    claimUrl:
      type: string
      pattern: "^/claim/"
      description: The handoff page as a path on this Workspace origin.
    expiresIn:
      type: integer
      const: 604800
      description: Seconds until the code stops working.

AgentClaim:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code:
      type: string

AgentSummary:
  type: object
  description: An agent as the human who claims or owns it sees it.
  additionalProperties: false
  required: [id, username, displayName, avatarUrl, spaceId, files, lastActiveAt, stopped]
  properties:
    id:
      type: string
    username:
      type: string
    displayName:
      type: string
    avatarUrl:
      type: [string, "null"]
      format: uri
    spaceId:
      type: string
      description: The agent's Personal Space.
    files:
      type: integer
      minimum: 0
      description: Files in the agent's Personal Space outside Trash.
    lastActiveAt:
      type: integer
      description: Unix epoch milliseconds when the agent last signed in or, before its claim, someone opened its handoff page or the page of one of its files. Recorded at most once a day.
    stopped:
      type: boolean
      description: The agent can no longer sign in. Its owner stopped it, or an operator banned it.

AgentSpace:
  type: object
  additionalProperties: false
  required: [id, type, name, files]
  properties:
    id:
      type: string
    type:
      type: string
      enum: [personal, team]
    name:
      type: string
    files:
      type: integer
      minimum: 0
      description: Files in the Space outside Trash.

AgentHandoff:
  type: object
  additionalProperties: false
  required: [agent, claimed, expiresAt, spaces]
  properties:
    agent:
      $ref: "#/AgentSummary"
    claimed:
      type: boolean
      description: The current human already owns the agent.
    expiresAt:
      type: string
      format: date-time
      description: When the code stops working.
    spaces:
      type: array
      description: Every Space the agent owns, its Personal Space first.
      items:
        $ref: "#/AgentSpace"

AgentClaimed:
  type: object
  additionalProperties: false
  required: [agent]
  properties:
    agent:
      $ref: "#/AgentSummary"

AgentClaimInvalid:
  description: AGENT_CLAIM_INVALID. The code is unknown, expired over seven days ago, or names a banned agent.
  content:
    application/json:
      schema:
        $ref: common.yaml#/ErrorResponse

AgentClaimExpired:
  description: AGENT_CLAIM_EXPIRED. The code is more than seven days old.
  content:
    application/json:
      schema:
        $ref: common.yaml#/ErrorResponse

AgentAlreadyClaimed:
  description: AGENT_ALREADY_CLAIMED. Another human already claimed the agent, through this code or another.
  content:
    application/json:
      schema:
        $ref: common.yaml#/ErrorResponse

ClaimedAgents:
  type: object
  additionalProperties: false
  required: [agents]
  properties:
    agents:
      type: array
      items:
        $ref: "#/AgentSummary"

PersonalAccessToken:
  type: object
  additionalProperties: false
  required: [id, name, scopes, createdAt, expiresAt, lastUsedAt, revokedAt]
  properties:
    id:
      type: string
    name:
      type: string
    scopes:
      type: array
      items:
        $ref: "#/McpScope"
    createdAt:
      type: integer
      description: Unix epoch milliseconds.
    expiresAt:
      type: [integer, "null"]
    lastUsedAt:
      type: [integer, "null"]
    revokedAt:
      type: [integer, "null"]

PersonalAccessTokenList:
  type: object
  additionalProperties: false
  required: [tokens]
  properties:
    tokens:
      type: array
      items:
        $ref: "#/PersonalAccessToken"

PersonalAccessTokenCreate:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    scopes:
      type: array
      minItems: 1
      items:
        $ref: "#/McpScope"
      description: Defaults to all scopes.
    expiresAt:
      type: [integer, "null"]
      description: Unix epoch milliseconds in the future. Defaults to null (no expiry).

PersonalAccessTokenCreated:
  type: object
  additionalProperties: false
  required: [token, record]
  properties:
    token:
      type: string
      description: Plaintext token, shown once.
    record:
      $ref: "#/PersonalAccessToken"

TokenExchangeRequest:
  type: object
  required: [grant_type, client_id, client_secret, subject_token, subject_token_type]
  properties:
    grant_type:
      type: string
      enum: [urn:ietf:params:oauth:grant-type:token-exchange]
    client_id:
      type: string
    client_secret:
      type: string
    subject_token:
      type: string
      description: A personal access token or an MCP OAuth access token.
    subject_token_type:
      type: string
      enum: [urn:ietf:params:oauth:token-type:access_token]
    resource:
      type: string
      description: Required for OAuth access tokens; ignored for personal access tokens.

TokenExchangeSubject:
  type: object
  additionalProperties: false
  required: [kind, id, client_id]
  properties:
    kind:
      type: string
      enum: [pat, oauth]
    id:
      type: string
    client_id:
      type: [string, "null"]
      description: The OAuth client the grant was issued to; null for personal access tokens.

OAuthTokenError:
  type: object
  additionalProperties: false
  required: [error]
  properties:
    error:
      type: string
      enum: [invalid_request, invalid_grant, unauthorized_client, invalid_client, unsupported_grant_type, temporarily_unavailable]
    error_description:
      type: string
      description: Present for MCP token errors, including unknown or missing clients.

McpAuthorizationCodeRequest:
  type: object
  description: Authorization code grant for a DCR or CIMD public MCP client.
  required: [grant_type, code, client_id, redirect_uri, code_verifier]
  properties:
    grant_type:
      type: string
      enum: [authorization_code]
    code:
      type: string
    client_id:
      type: string
      description: DCR client ID or the exact HTTPS CIMD URL used in authorization.
    redirect_uri:
      type: string
      description: The exact redirect URI of the authorization request, including a loopback port.
    code_verifier:
      type: string
    resource:
      type: string
      description: If present, must equal the `resource` of the authorization request. Defaults to the authorized resource when omitted.

McpRefreshTokenRequest:
  type: object
  description: Refresh token grant for a DCR or CIMD MCP client. The refresh token rotates; CIMD metadata is not fetched on refresh.
  required: [grant_type, refresh_token, client_id]
  properties:
    grant_type:
      type: string
      enum: [refresh_token]
    refresh_token:
      type: string
    client_id:
      type: string
      description: DCR client ID or the exact HTTPS CIMD URL used in authorization.
    resource:
      type: string
      description: If present, must equal the resource the grant was issued for. Defaults to the grant's stored resource when omitted.
    scope:
      type: string
      description: Ignored; a refreshed grant keeps its granted scopes.

McpTokenResponse:
  type: object
  additionalProperties: false
  required: [access_token, token_type, expires_in, refresh_token, scope]
  properties:
    access_token:
      type: string
      description: A `uvw_at_` access token bound to the grant's resource.
    token_type:
      type: string
      enum: [Bearer]
    expires_in:
      type: integer
    refresh_token:
      type: string
      description: A `uvw_rt_` refresh token. Presenting a rotated one within 60 seconds fails; later it revokes the grant.
    scope:
      type: string
      description: Granted MCP scopes, space-separated.

AuthorizationServerMetadata:
  type: object
  additionalProperties: false
  required:
    - issuer
    - authorization_endpoint
    - token_endpoint
    - registration_endpoint
    - revocation_endpoint
    - response_types_supported
    - grant_types_supported
    - code_challenge_methods_supported
    - token_endpoint_auth_methods_supported
    - revocation_endpoint_auth_methods_supported
    - authorization_response_iss_parameter_supported
    - scopes_supported
  properties:
    authorization_response_iss_parameter_supported:
      type: boolean
      const: true
      description: Every MCP authorization callback includes the issuer; static clients retain their original callbacks.
    client_id_metadata_document_supported:
      type: boolean
      const: true
      description: Present when CIMD is enabled (default); omitted when MCP_CIMD_ENABLED=0.
    issuer:
      type: string
      description: The configured `PUBLIC_ORIGIN`.
    authorization_endpoint:
      type: string
    token_endpoint:
      type: string
    registration_endpoint:
      type: string
    revocation_endpoint:
      type: string
    response_types_supported:
      type: array
      items:
        type: string
        enum: [code]
    grant_types_supported:
      type: array
      items:
        type: string
        enum: [authorization_code, refresh_token]
    code_challenge_methods_supported:
      type: array
      items:
        type: string
        enum: [S256]
    token_endpoint_auth_methods_supported:
      type: array
      items:
        type: string
        enum: [none]
    revocation_endpoint_auth_methods_supported:
      type: array
      items:
        type: string
        enum: [none]
    scopes_supported:
      type: array
      items:
        $ref: "#/McpScope"

ClientRegistrationRequest:
  type: object
  description: |
    RFC 7591 metadata for a public native client. Other metadata, such as
    `client_uri` or `application_type`, is accepted and ignored.
  required: [redirect_uris]
  properties:
    redirect_uris:
      type: array
      minItems: 1
      maxItems: 10
      description: |
        Each URI is a loopback `http` URL (`127.0.0.1`, `[::1]` or
        `localhost`), an `https` URL, or a reverse-domain private-use scheme
        such as `com.example.app:/callback`, or an allowlisted private-use
        scheme (currently `cursor`), without a fragment or credentials.
      items:
        type: string
    client_name:
      type: string
      maxLength: 100
    grant_types:
      type: array
      description: Must include `authorization_code`. Defaults to both supported grants.
      items:
        type: string
        enum: [authorization_code, refresh_token]
    response_types:
      type: array
      items:
        type: string
        enum: [code]
    token_endpoint_auth_method:
      type: string
      enum: [none]
    scope:
      type: string
      description: A space-separated subset of the MCP scopes.

ClientRegistrationResponse:
  type: object
  additionalProperties: false
  required: [client_id, client_id_issued_at, redirect_uris, grant_types, response_types, token_endpoint_auth_method, scope]
  properties:
    client_id:
      type: string
    client_id_issued_at:
      type: integer
      description: Unix epoch seconds.
    client_name:
      type: string
    redirect_uris:
      type: array
      items:
        type: string
    grant_types:
      type: array
      items:
        type: string
        enum: [authorization_code, refresh_token]
    response_types:
      type: array
      items:
        type: string
        enum: [code]
    token_endpoint_auth_method:
      type: string
      enum: [none]
    scope:
      type: string
      description: The MCP scopes the client may request.

ClientRegistrationError:
  type: object
  additionalProperties: false
  required: [error, error_description]
  properties:
    error:
      type: string
      enum: [invalid_redirect_uri, invalid_client_metadata, temporarily_unavailable]
    error_description:
      type: string

TokenRevocationRequest:
  type: object
  required: [token, client_id]
  properties:
    token:
      type: string
      description: A current access or refresh token of the client's grant.
    token_type_hint:
      type: string
      description: Ignored.
    client_id:
      type: string
      description: DCR client ID or HTTPS CIMD URL. Revocation does not fetch CIMD metadata.
