IssueState:
  type: string
  enum: [open, closed]

IssueStateReason:
  type: string
  enum: [completed, not_planned]

IssueLabelColor:
  type: string
  description: Palette key. The Browser maps each key to light and dark theme colors.
  enum: [gray, blue, green, yellow, orange, red, purple, pink]

IssueLabel:
  type: object
  additionalProperties: false
  required: [id, name, color, description]
  properties:
    id:
      type: string
    name:
      type: string
    color:
      type: string
      description: A palette key; historical labels are not rewritten if the palette changes.
    description:
      type: string

IssueLabelUsage:
  allOf:
    - $ref: "#/IssueLabel"
    - type: object
      required: [openIssueCount]
      properties:
        openIssueCount:
          type: integer
          minimum: 0
  unevaluatedProperties: false

IssueLabelList:
  type: object
  additionalProperties: false
  required: [labels]
  properties:
    labels:
      type: array
      items:
        $ref: "#/IssueLabelUsage"

IssueReference:
  type: object
  additionalProperties: false
  required: [nodeId, available, name, resource]
  properties:
    nodeId:
      type: string
    available:
      type: boolean
      description: False when the Node is in Trash, deleted or no longer readable by the caller.
    name:
      type: [string, "null"]
      description: Null when the reference is unavailable.
    resource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, kind, unitId, unitType]
          properties:
            id:
              type: string
            kind:
              type: string
              const: univer
            unitId:
              type: string
            unitType:
              $ref: ./nodes.yaml#/UnitType
        - type: object
          additionalProperties: false
          required: [id, kind, mediaType]
          properties:
            id:
              type: string
            kind:
              type: string
              const: blob
            mediaType:
              type: string
        - type: "null"

IssueSpaceRef:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string

IssueSummary:
  type: object
  additionalProperties: false
  required:
    - createdVia
    - id
    - number
    - space
    - title
    - state
    - stateReason
    - author
    - closedBy
    - closedAt
    - labels
    - assignees
    - commentCount
    - referenceCount
    - createdAt
    - updatedAt
  properties:
    createdVia:
      $ref: ./identity.yaml#/WriteSource
    id:
      type: string
    number:
      type: integer
      minimum: 1
      description: Human-facing number, unique inside the Space (#12).
    space:
      $ref: "#/IssueSpaceRef"
    title:
      type: string
    state:
      $ref: "#/IssueState"
    stateReason:
      oneOf:
        - $ref: "#/IssueStateReason"
        - type: "null"
    author:
      $ref: ./identity.yaml#/PublicUser
    closedBy:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
      description: Who closed the Issue; `null` while it is open and when the Space's acceptance deadline closed it.
    closedAt:
      type: [string, "null"]
      format: date-time
    labels:
      type: array
      items:
        $ref: "#/IssueLabel"
    assignees:
      type: array
      items:
        $ref: ./identity.yaml#/PublicUser
    commentCount:
      type: integer
      minimum: 0
    referenceCount:
      type: integer
      minimum: 0
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IssueCapabilities:
  type: object
  additionalProperties: false
  required: [edit, close, triage, comment]
  properties:
    edit:
      type: boolean
      description: The caller may change the title and body.
    close:
      type: boolean
      description: The caller may close or reopen the Issue.
    triage:
      type: boolean
      description: The caller may change labels, assignees and referenced files.
    comment:
      type: boolean

Issue:
  allOf:
    - $ref: "#/IssueSummary"
    - type: object
      required: [body, references, capabilities, pullRequests, acceptance]
      properties:
        body:
          type: string
          description: Markdown.
        acceptance:
          oneOf:
            - $ref: "#/IssueAcceptance"
            - type: "null"
          description: The latest verdict, or `null` when the Issue was never submitted.
        references:
          type: array
          items:
            $ref: "#/IssueReference"
        capabilities:
          $ref: "#/IssueCapabilities"
        pullRequests:
          type: array
          maxItems: 100
          description: |
            The pull requests linked to this Issue that the caller may see, newest first: the 100 most
            recently created links.
          items:
            $ref: "#/IssuePullRequest"
  unevaluatedProperties: false

IssueVerdictKind:
  type: string
  enum: [submitted, accepted, sent_back]

IssueAcceptance:
  type: object
  additionalProperties: false
  required: [kind, actor, body, createdAt, deadline]
  properties:
    kind:
      $ref: "#/IssueVerdictKind"
    actor:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
      description: Who recorded the verdict; `null` for an `accepted` verdict the Space's acceptance deadline recorded.
    body:
      type: string
      description: Markdown. What was done, checked and assumed for `submitted`; the reason for `sent_back`.
    createdAt:
      type: string
      format: date-time
    deadline:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
      description: >-
        When the Space's acceptance deadline accepts this Issue unless someone sends it back first:
        `acceptAfterHours` after the later of its latest submission and its last reopen. `null` unless the
        Issue is open and submitted and the Space has a deadline.

CreateIssueVerdict:
  type: object
  additionalProperties: false
  required: [kind]
  properties:
    kind:
      $ref: "#/IssueVerdictKind"
    body:
      type: string
      maxLength: 65536
      description: Required and not blank for `submitted` and `sent_back`; optional for `accepted`.

IssuePullRequest:
  type: object
  additionalProperties: false
  required: [id, number, title, state, author, mergedBy]
  properties:
    id:
      type: string
    number:
      type: [integer, "null"]
      minimum: 1
    title:
      type: string
    state:
      $ref: ./worktrees.yaml#/WorktreeState
    author:
      $ref: ./identity.yaml#/PublicUser
    mergedBy:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"

IssueAccessChanges:
  type: object
  additionalProperties: false
  required: [publicRead, members, membersTruncated, personalSharing]
  properties:
    publicRead:
      type: boolean
      description: Whether the Team Space reads publicly now. The product does not record who set it.
    members:
      type: array
      maxItems: 50
      description: |
        Memberships of this Team Space whose latest grant came from an assignee after its latest
        assignment, newest first: the 50 most recent.
      items:
        $ref: ./permissions.yaml#/TeamMembership
    membersTruncated:
      type: boolean
      description: True when more memberships matched than `members` holds.
    personalSharing:
      oneOf:
        - $ref: "#/IssuePersonalSharing"
        - type: "null"
      description: |
        Link Sharing settings and Node Grants that an assignee created or last changed after its
        latest assignment, in its own Personal Space. It covers only the assignees the caller is or
        claimed, and is `null` when the caller is none of them.

IssuePersonalSharing:
  type: object
  additionalProperties: false
  required: [items, truncated]
  properties:
    items:
      type: array
      maxItems: 50
      description: Newest first, the 50 most recent.
      items:
        $ref: "#/IssuePersonalSharingChange"
    truncated:
      type: boolean

IssuePersonalSharingChange:
  oneOf:
    - $ref: "#/IssueLinkSharingChange"
    - $ref: "#/IssueNodeGrantChange"
  discriminator:
    propertyName: kind
    mapping:
      link: "#/IssueLinkSharingChange"
      grant: "#/IssueNodeGrantChange"

IssueSharedNode:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string

IssueLinkSharingChange:
  type: object
  additionalProperties: false
  required: [kind, actor, node, role, enabled, updatedAt]
  properties:
    kind:
      type: string
      const: link
    actor:
      $ref: ./identity.yaml#/PublicUser
    node:
      $ref: "#/IssueSharedNode"
    role:
      $ref: ./permissions.yaml#/GrantRole
    enabled:
      type: boolean
    updatedAt:
      type: string
      format: date-time

IssueNodeGrantChange:
  type: object
  additionalProperties: false
  required: [kind, actor, node, role, user, updatedAt]
  properties:
    kind:
      type: string
      const: grant
    actor:
      $ref: ./identity.yaml#/PublicUser
    node:
      $ref: "#/IssueSharedNode"
    role:
      $ref: ./permissions.yaml#/GrantRole
    user:
      $ref: ./identity.yaml#/PublicUser
    updatedAt:
      type: string
      format: date-time

IssueList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, counts]
  properties:
    items:
      type: array
      items:
        $ref: "#/IssueSummary"
    nextCursor:
      type: [string, "null"]
    counts:
      type: object
      additionalProperties: false
      required: [open, closed]
      description: Match counts for every filter except `state`.
      properties:
        open:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0

IssueComment:
  type: object
  additionalProperties: false
  required: [id, author, body, createdAt, updatedAt]
  properties:
    id:
      type: string
    author:
      $ref: ./identity.yaml#/PublicUser
    body:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IssueEventKind:
  type: string
  enum:
    - closed
    - reopened
    - renamed
    - labeled
    - unlabeled
    - assigned
    - unassigned
    - node_referenced
    - node_unreferenced
    - submitted
    - accepted
    - sent_back

IssueTimelineComment:
  type: object
  additionalProperties: false
  required: [type, id, author, body, createdAt, updatedAt]
  properties:
    type:
      type: string
      const: comment
    id:
      type: string
    author:
      $ref: ./identity.yaml#/PublicUser
    body:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IssueTimelineEvent:
  type: object
  additionalProperties: false
  required: [type, id, kind, actor, payload, createdAt]
  properties:
    type:
      type: string
      const: event
    id:
      type: string
    kind:
      $ref: "#/IssueEventKind"
    actor:
      oneOf:
        - $ref: ./identity.yaml#/PublicUser
        - type: "null"
      description: |
        `null` only for an `accepted` verdict the Space's acceptance deadline recorded. That acceptance closes
        the Issue as completed without a `closed` event.
    payload:
      type: object
      additionalProperties: true
      description: |
        Snapshot taken when the event happened. `closed` carries `reason`;
        `renamed` carries `from` and `to`; `labeled` and `unlabeled` carry
        `labelId`, `name` and `color`; `assigned` and `unassigned` carry
        `userId`, `username` and `displayName`; `node_referenced` and
        `node_unreferenced` carry `nodeId` and `name`. The verdicts `submitted`,
        `accepted` and `sent_back` carry `body`.
    createdAt:
      type: string
      format: date-time

IssueTimelineItem:
  oneOf:
    - $ref: "#/IssueTimelineComment"
    - $ref: "#/IssueTimelineEvent"
  discriminator:
    propertyName: type
    mapping:
      comment: "#/IssueTimelineComment"
      event: "#/IssueTimelineEvent"

IssueTimelinePage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: "#/IssueTimelineItem"
    nextCursor:
      type: [string, "null"]

CreateIssue:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 256
    body:
      type: string
      maxLength: 65536
    labelIds:
      type: array
      maxItems: 20
      items:
        type: string
      description: Requires the triage capability.
    assigneeUserIds:
      type: array
      maxItems: 10
      items:
        type: string
      description: Requires the triage capability. Assignees must be the owner or a member of the Space.
    nodeIds:
      type: array
      maxItems: 20
      items:
        type: string
      description: Requires the triage capability. Nodes must be in the Space and not in Trash.

UpdateIssue:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 256
    body:
      type: string
      maxLength: 65536
    state:
      $ref: "#/IssueState"
    stateReason:
      $ref: "#/IssueStateReason"
      description: "Only valid together with `state: closed`; defaults to `completed`."
    labelIds:
      type: array
      maxItems: 20
      items:
        type: string
      description: Replaces the whole set. Requires the triage capability.
    assigneeUserIds:
      type: array
      maxItems: 10
      items:
        type: string
      description: Replaces the whole set. Existing assignees that left the Space may be kept.
    nodeIds:
      type: array
      maxItems: 20
      items:
        type: string
      description: Replaces the whole set. Existing references that became unavailable may be kept.

IssueCommentBody:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 65536

CreateIssueLabel:
  type: object
  additionalProperties: false
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
    color:
      $ref: "#/IssueLabelColor"
    description:
      type: string
      maxLength: 200

UpdateIssueLabel:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
    color:
      $ref: "#/IssueLabelColor"
    description:
      type: string
      maxLength: 200

IssueLimitParameter:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50

IssueStateParameter:
  name: state
  in: query
  required: false
  schema:
    type: string
    enum: [open, closed, all]
    default: open

IssueLabelParameter:
  name: label
  in: query
  required: false
  description: Label name, case-insensitive. Repeat to require several labels.
  style: form
  explode: true
  schema:
    type: array
    maxItems: 10
    items:
      type: string

IssueAssigneeParameter:
  name: assignee
  in: query
  required: false
  description: A User ID, `me`, or `none` for unassigned Issues.
  schema:
    type: string

IssueAuthorParameter:
  name: author
  in: query
  required: false
  description: A User ID or `me`.
  schema:
    type: string

IssueSearchParameter:
  name: q
  in: query
  required: false
  description: Case-insensitive substring match on title and body.
  schema:
    type: string
    maxLength: 200

IssueAcceptanceParameter:
  name: acceptance
  in: query
  required: false
  description: Only Issues whose latest verdict is this one.
  schema:
    type: string
    enum: [submitted, sent_back]

IssueSortParameter:
  name: sort
  in: query
  required: false
  schema:
    type: string
    enum: [created, updated]
    default: created

IssueOrderParameter:
  name: order
  in: query
  required: false
  schema:
    type: string
    enum: [asc, desc]
    default: desc
