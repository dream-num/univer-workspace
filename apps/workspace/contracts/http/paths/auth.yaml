/api/session:
  get:
    tags: [Session]
    operationId: getSession
    summary: Get the current login session.
    security:
      - {}
      - sessionCookie: []
    responses:
      "200":
        description: Current authenticated or anonymous session.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/SessionView

/api/auth/authorize:
  get:
    tags: [Authentication]
    operationId: oauthAuthorize
    summary: Start OAuth authorization for a configured, registered or CIMD client.
    description: |
      Static `OAUTH_CLIENTS_JSON` clients keep their rules: an exact
      registered `redirect_uri`, a 32 to 256 character base64url `state`, and
      a `scope` from the client's configured scopes (default `identity`). A
      static client needs a person signed in in a browser, so a browser
      without one goes to the sign-in page. A client with `requiresConsent`,
      such as the Workspace Agent or the Space plugin, gets a consent page
      with Allow and Deny; any other static client gets its code at once.

      When `MCP_RESOURCE_URLS` is set, dynamically registered MCP clients
      (`POST /api/auth/register`) and HTTPS Client ID Metadata Document (CIMD)
      clients may also authorize. CIMD is enabled by default; `MCP_CIMD_ENABLED=0`
      disables it. They must send `response_type=code`, `code_challenge_method=S256`
      and a `resource` equal to one of `MCP_RESOURCE_URLS`, optionally followed by
      a query such as `?toolsets=all`; the grant is bound to the listed URL. `scope`
      is a subset of `read`, `write`, `publish` and `worktree:merge` (default all
      four) and `state` is optional, 1 to 1024 printable ASCII characters. A
      loopback `redirect_uri` matches a registered one with any port (RFC 8252);
      every other URI matches exactly.

      An MCP client always gets the connect page, in one of two states. A
      session whose User is an agent counts as no session, and the page leaves
      its cookie as it is.

      - A person signed in in a browser connects with one button: as the agent
        they own that was made for a client of this name, otherwise as a new
        agent they own. Other buttons connect as another of up to five agents
        the person owns and has not stopped, most recently active first, or as
        the person (`self`), or deny. When the per-source agent creation limit
        refuses this browser's address, the page offers no new agent and says
        why. When the request includes `write`, a "Let it change content"
        switch is on by default; on grants `read write publish worktree:merge`
        and off grants `read`. A request without `write` gets no switch and
        can only read. The form posts to POST /api/auth/authorize/consent with
        a single-use consent token bound to the person for five minutes.
      - With no person signed in, the page offers "Sign in to connect", which
        returns to this URL after sign-in, and a deny link to the client's
        callback with `access_denied`. When guest agents are enabled it also
        offers "Try without signing in", a form post to POST
        /api/auth/authorize/guest, shown disabled with the reason to a source
        at the agent creation limit. This state issues no code and writes no
        session.

      A CIMD client's metadata document is fetched before the page: for the
      signed-in person, or anonymously under the limits POST
      /api/auth/authorize/guest describes when nobody is signed in and guest
      agents are enabled. A refused anonymous fetch goes to the sign-in page,
      and so does a signed-out CIMD request while guest agents are off, which
      fetches nothing. CIMD names are displayed with their URL hostname. An
      invalid document returns 400 and a temporary fetch failure 503, as an
      HTML page and never a client redirect; a signed-out browser is not told
      the cause. An unknown client or unregistered `redirect_uri` is answered
      here with 400; once both are verified, other errors redirect to the
      client with RFC 6749 `error` (`invalid_request`, `invalid_scope`,
      `invalid_target` or `unsupported_response_type`), `error_description`
      and `state`. Every MCP success, error and deny callback includes `iss`
      (RFC 9207); static callbacks are unchanged. Every page has
      Cache-Control: no-store, X-Frame-Options: DENY and a CSP whose
      `form-action` names only Workspace and the client's callback.
    security:
      - {}
      - sessionCookie: []

    parameters:
      - name: client_id
        in: query
        description: Static configured ID, DCR client ID, or HTTPS CIMD URL (at most 2000 characters, non-root path, no credentials, query, fragment or dot segments). CIMD identity is compared verbatim.
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Required for static clients, as a 32 to 256 character base64url value; optional for MCP clients.
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,128}$
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: response_type
        in: query
        required: false
        description: Required for MCP clients.
        schema:
          type: string
          enum: [code]
      - name: code_challenge_method
        in: query
        required: false
        description: Required for MCP clients.
        schema:
          type: string
          enum: [S256]
      - name: resource
        in: query
        required: false
        description: Required for MCP clients (RFC 8707); one of `MCP_RESOURCE_URLS`, compared exactly after removing a query string such as `?toolsets=all`.
        schema:
          type: string
    responses:
      "200":
        description: The connect page for an MCP client, signed in or signed out, or the consent page of a static client with `requiresConsent`.
        content:
          text/html:
            schema:
              type: string
      "302":
        description: Redirect to Workspace sign-in, to a static client's redirect_uri with a one-time code, or to an MCP client's redirect_uri with an OAuth error.
        headers:
          Location:
            required: true
            schema:
              type: string
      "400":
        description: Unknown client, invalid redirect or invalid CIMD document. No client redirect.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
          text/html:
            schema:
              type: string
      "503":
        description: A CIMD fetch failed temporarily, or a signed-in person's fetch found capacity busy, with no usable cached document. No client redirect; retry later.
        content:
          text/html:
            schema:
              type: string
      "403":
        description: INTERACTIVE_SESSION_REQUIRED. A person's CLI login or a session issued by token exchange is refused. A session whose User is an agent gets the signed-out page instead.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/authorize/guest:
  post:
    tags: [Authentication]
    operationId: authorizeAsGuestAgent
    summary: Try an MCP client as a new guest agent, without signing in.
    description: |
      The target of the connect page's "Try without signing in" form. Takes
      the query string of a `/api/auth/authorize` request from a dynamically
      registered or Client ID Metadata Document client and answers 303 to the
      client's `redirect_uri`. With a valid request the callback carries a
      code for a new guest agent. The code carries `read write publish
      worktree:merge` when the request includes `write`, and `read` otherwise.
      Redeeming it at POST /api/auth/token creates the agent under the
      per-source creation limit, named after the client, as in `Claude Code ·
      7f3k`. The server reads the name from the registration or the metadata
      document, cleans it as `PasswordRegistration.displayName` describes,
      keeps only the local part of an email address, cuts it to 40 characters
      between whole graphemes, and appends ` · ` and the username's
      four-character suffix. A code nobody redeems creates nothing. A request
      authorize would refuse with a redirect gets that OAuth error redirect
      instead. The callback gets `temporarily_unavailable` and no code when
      the source got 20 such codes in the last minute, redeemed or not, or
      while 10,000 codes wait unredeemed. A source at the creation limit is
      refused before anything is fetched. A Client ID Metadata Document is
      fetched now: guests may start 8 of the 32 metadata fetches the server
      runs at once, one in flight per source, and each source may start 10
      per hour, failed ones included. A cached document or a fetch already in
      flight costs nothing. The endpoint reads no session and sets no cookie.
      An error that cannot go to the client is an HTML page that names its
      code and links back to the connect page. All responses have
      Cache-Control: no-store.
    security: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: ../schemas/identity.yaml#/GuestAuthorizationCreate
    responses:
      "303":
        description: To the client's redirect_uri with a code, or with an RFC 6749 `error`, `error_description`, `state` and `iss`.
        headers:
          Location:
            required: true
            schema:
              type: string
          Cache-Control:
            schema:
              type: string
              const: no-store
      "400":
        description: |
          INVALID_INPUT. The body is not a form with `oauthAuthorization`, or it names a configured
          client, such as the Workspace Agent, that needs a person signed in. OAUTH_CLIENT_UNAVAILABLE,
          INVALID_REDIRECT_URI or INVALID_INPUT for an unknown client, an unregistered redirect, an
          invalid `state` or an invalid metadata document. No client redirect.
        content:
          text/html:
            schema:
              type: string
      "429":
        description: AGENT_CREATE_RATE_LIMITED. Guest agents are turned off, too many agents were created from this source IP in the last hour, or the source started 10 metadata fetches in the last hour.
        content:
          text/html:
            schema:
              type: string
      "503":
        description: |
          OAUTH_CLIENT_UNAVAILABLE. The client's metadata document could not be fetched right now.
          CLIENT_METADATA_BUSY, with Retry-After. Every metadata fetch guests may start is in
          use, or this source has another one in flight. Nothing was fetched. Retry after the delay.
        headers:
          Retry-After:
            description: Seconds to wait, sent only with CLIENT_METADATA_BUSY.
            schema:
              type: integer
        content:
          text/html:
            schema:
              type: string

/api/auth/authorize/consent:
  post:
    tags: [Authentication]
    operationId: submitOAuthConsent
    summary: Connect or deny a saved authorization request.
    description: |
      The form of the connect page and of a static client's consent page.
      Consumes the saved request without fetching CIMD metadata again.
      `decision=deny` refuses; without it the request is allowed. For an MCP
      client, `access=read_write` grants `read write publish worktree:merge`
      when the saved request includes `write`; otherwise, or without
      `access`, the code carries `read`. An MCP allow also needs
      `connect_as`. `self` makes the code act for the signed-in person.
      `new_agent` makes it act for a new agent that the person owns:
      redeeming the code creates the agent under the per-source agent
      creation limit, named after the client, owned by the person from the
      same write, with no expiry. A code nobody redeems creates no agent. Any
      other value is the id of an agent the person owns and has not stopped,
      and makes the code act for that agent; it creates nothing and counts
      toward no limit. The token endpoint checks again that the person still
      owns the agent and has not stopped it. An id that is not such an agent
      gets the same 400, whether or not a User has it. A 400, 403 or 429
      keeps the consent token valid, so the person can go back and choose
      again. Both successful and denied MCP callbacks include `iss`; static
      callbacks do not.
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [consent_token]
            properties:
              consent_token:
                type: string
              decision:
                type: string
                enum: [allow, deny]
                description: "`deny` refuses. The connect page sends it only from its Deny button; the static consent page sends `allow` or `deny`."
              access:
                $ref: ../schemas/identity.yaml#/AccessTier
              connect_as:
                type: string
                minLength: 1
                description: "`new_agent`, `self`, or the id of an agent the signed-in person owns, sent by the button the person clicks. Required to allow an MCP client. Ignored for static clients and on deny."
    responses:
      "303":
        description: Redirect to the verified callback with a one-time code or access_denied, the original state, and iss for MCP clients.
        headers:
          Location:
            required: true
            schema:
              type: string
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: INTERACTIVE_SESSION_REQUIRED. This action needs a person signed in to Workspace in a browser. An agent, a CLI login or a session issued by token exchange is refused.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: AGENT_CREATE_RATE_LIMITED. `new_agent` was submitted while this browser's address may create no agent. The message names the way out, connecting as the person or as an agent the person already owns, or trying again later.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/token:
  post:
    tags: [Authentication]
    operationId: oauthToken
    summary: Exchange a one-time authorization code for a registered client identity or MCP tokens, refresh MCP tokens, or exchange a personal access token or MCP access token for a downstream session.
    description: |
      Three grants share this endpoint.

      For dynamically registered MCP clients (only while `MCP_RESOURCE_URLS`
      is set), `authorization_code` and `refresh_token` take a form body with
      `client_id` (DCR ID or CIMD HTTPS URL) and no secret. If `resource` is
      omitted, the server uses the resource bound to the authorization code
      or stored grant. If present, it must match that resource. They return
      `McpTokenResponse` with `Cache-Control:
      no-store`. A code is good for one attempt; presenting an already
      redeemed code revokes the grant it produced. Redeeming a code for a new
      agent, a guest or an agent the consenting person owns, creates that
      agent; when its source reached the creation limit after authorization,
      the answer is `temporarily_unavailable` (429) and no agent is created.
      A code for an agent the consenting person already owns answers
      `invalid_grant` when that person no longer owns it or stopped it. A refresh token rotates;
      presenting a rotated one within 60 seconds fails without side effects,
      later it revokes the grant. Errors use the RFC 6749 section 5.2 body
      `{ "error": "<code>", "error_description": "<description>" }` with
      `Cache-Control: no-store`: `invalid_request` (400, malformed request),
      `invalid_client` (401, unknown or missing `client_id`),
      `unsupported_grant_type` (400, a grant the client may not use or the
      server does not support) or `invalid_grant` (400, a bad code or refresh
      token, including a wrong client, `redirect_uri`, `code_verifier` or
      `resource`). While MCP OAuth is enabled, every non-static client
      request and every `refresh_token` request uses these errors, including
      unknown or missing clients. Token exchange keeps the rules below.

      Static `OAUTH_CLIENTS_JSON` clients keep their existing
      `authorization_code` behavior (JSON or form body) and Workspace error
      objects. When MCP OAuth is disabled, all requests keep their existing
      behavior.

      `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693) accepts
      only an `application/x-www-form-urlencoded` body and is open only to a
      confidential client registered with `"tokenExchange": true` that
      authenticates with `client_secret`. The `subject_token` is a personal
      access token or an MCP OAuth access token. An OAuth access token
      requires `resource`, which must equal the resource its grant was issued
      for; a personal access token ignores `resource`. The revocation check
      and the session insert happen in one database transaction. The
      response `access_token` is a Workspace login session, presented as the
      `workspace_session` cookie. It lives for 10 minutes, or less when the
      subject token expires sooner or the deployment session lifetime is
      shorter; `expires_in` reports the actual lifetime. Such a session
      cannot create personal access tokens, approve CLI logins, authorize
      OAuth clients or link identities (403). Errors use the RFC 6749 body
      `{ "error": "<code>" }`: `invalid_request` (400, including a JSON
      body), `invalid_grant` (400, including a subject token that belongs
      to a banned agent), `unauthorized_client` (400, a
      confidential client without `tokenExchange`) or `invalid_client` (401,
      an unknown or public client or a wrong secret).

      When the granted scope includes `session`, the response also carries a
      Workspace login session token in `access_token`; the client presents
      it as the `workspace_session` cookie on product and collaboration
      endpoints, acting with the authorizing User's permissions until it
      expires. Identity-only grants return an empty `access_token`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grant_type, code, client_id, redirect_uri, code_verifier]
            properties:
              grant_type:
                type: string
                enum: [authorization_code]
              code:
                type: string
              client_id:
                type: string
              client_secret:
                type: string
                description: Required for confidential clients; omitted for public PKCE clients.
              redirect_uri:
                type: string
              code_verifier:
                type: string
        application/x-www-form-urlencoded:
          schema:
            oneOf:
              - $ref: ../schemas/identity.yaml#/TokenExchangeRequest
              - $ref: ../schemas/identity.yaml#/McpAuthorizationCodeRequest
              - $ref: ../schemas/identity.yaml#/McpRefreshTokenRequest
    responses:
      "200":
        description: The registered client identity and, for `session` grants, a login session token; or MCP tokens.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: ../schemas/identity.yaml#/McpTokenResponse
                - type: object
                  properties:
                    access_token:
                      type: string
                      description: |
                        Workspace session token for `session` grants, empty
                        string for identity-only grants.
                    token_type:
                      type: string
                    expires_in:
                      type: integer
                      description: |
                        Seconds until the issued session expires for `session`
                        grants and token exchange.
                    issued_token_type:
                      type: string
                      description: Present for token exchange only.
                      enum: [urn:univer:params:oauth:token-type:workspace-session]
                    scope:
                      type: string
                      description: Present for token exchange only. Granted MCP scopes, space-separated.
                    subject:
                      $ref: ../schemas/identity.yaml#/TokenExchangeSubject
                    user:
                      $ref: ../schemas/identity.yaml#/User
                    owner:
                      $ref: ../schemas/identity.yaml#/PublicUser
                      description: Token exchange only. Present only for a claimed agent, and names the person who claimed it.
                    executor_access:
                      const: true
                      description: |
                        Token exchange only. Present only when an operator
                        granted the user the shared MCP executor with
                        `db:executor-access`.
      "400":
        description: Workspace error for static clients or when MCP OAuth is disabled; otherwise `invalid_request`, `unsupported_grant_type` or `invalid_grant`. Token exchange may also return `unauthorized_client`.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/common.yaml#/ErrorResponse
                - $ref: ../schemas/identity.yaml#/OAuthTokenError
      "401":
        description: Workspace error for an invalid static-client secret or PKCE verifier; `invalid_client` for an unknown or missing MCP client or failed token-exchange client authentication.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/common.yaml#/ErrorResponse
                - $ref: ../schemas/identity.yaml#/OAuthTokenError
      "429":
        description: "`temporarily_unavailable`. The code was for a guest agent, and its source created too many agents since authorization. No agent was created."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError

/.well-known/oauth-authorization-server:
  get:
    tags: [Authentication]
    operationId: getOAuthAuthorizationServerMetadata
    summary: RFC 8414 authorization server metadata for MCP clients.
    description: |
      Served only while `MCP_RESOURCE_URLS` is set; otherwise 404. Endpoints
      are absolute URLs under `PUBLIC_ORIGIN`. Client ID Metadata Documents
      are not advertised.
    security: []
    responses:
      "200":
        description: Authorization server metadata.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AuthorizationServerMetadata
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/auth/register:
  post:
    tags: [Authentication]
    operationId: registerOAuthClient
    summary: RFC 7591 dynamic registration of a public MCP client.
    description: |
      Unauthenticated. Served only while `MCP_RESOURCE_URLS` is set;
      otherwise 404. Accepts a JSON body of at most 16 KiB. No client secret
      is issued. Registration stops with 503 once the deployment holds
      `MCP_MAX_REGISTERED_CLIENTS` clients (default 10,000).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/ClientRegistrationRequest
    responses:
      "201":
        description: The registered client.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationResponse
      "400":
        description: "`invalid_redirect_uri` or `invalid_client_metadata`."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "413":
        description: "`invalid_client_metadata`: the body is larger than 16 KiB."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError
      "503":
        description: "`temporarily_unavailable`: the registered-client cap is reached."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError

/api/auth/revoke:
  post:
    tags: [Authentication]
    operationId: revokeOAuthToken
    summary: RFC 7009 revocation of an MCP client's grant.
    description: |
      Served only while `MCP_RESOURCE_URLS` is set; otherwise 404. Revokes
      the grant behind a current access or refresh token, and the downstream
      sessions exchanged from it, when it belongs to `client_id`. Answers 200
      with an empty body whether or not the token was valid.
    security: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: ../schemas/identity.yaml#/TokenRevocationRequest
    responses:
      "200":
        description: Processed; the token is no longer valid if it was.
      "400":
        description: "`invalid_request`: a JSON body or a missing token."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError
      "401":
        description: "`invalid_client`: `client_id` is not a registered MCP client."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/auth/agent-token:
  post:
    tags: [Authentication]
    operationId: createAgentToken
    summary: Issue a one-hour MCP access token for the browser Agents module.
    description: |
      Requires a person signed in to Workspace in a browser; any other
      session gets 403. Accepts only [read], [read, write], or [read, publish],
      in either order, without duplicates. Never grants worktree:merge. The browser
      requests [read, publish] only for one explicitly approved tool call.
      The token is bound to /mcp at PUBLIC_ORIGIN, resolved against MCP_RESOURCE_URLS,
      and uses the first-party client univer-workspace-agents. No refresh token
      is returned. This is an OAuth grant and does not appear in the PAT list.
      All responses have Cache-Control: no-store.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentTokenCreate
    responses:
      "201":
        description: Created MCP access token.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentTokenCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "503":
        description: OAUTH_CLIENT_UNAVAILABLE. MCP_RESOURCE_URLS must include /mcp at PUBLIC_ORIGIN; MCP OAuth may be unconfigured.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents:
  get:
    tags: [Authentication]
    operationId: listClaimedAgents
    summary: List the agents the current human claimed.
    description: |
      Needs a human's browser login session; an agent or a session issued by
      token exchange or a CLI login gets 403. Agents come oldest claim first.
      All responses have Cache-Control: no-store.
    responses:
      "200":
        description: The claimed agents.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClaimedAgents
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
  post:
    tags: [Authentication]
    operationId: createAgent
    summary: Create an agent User and a personal access token for it.
    description: |
      Needs no credentials. Creates a User of kind agent with its own Personal
      Space, unclaimed and expiring 30 days later, and returns a personal access
      token with every MCP scope. The plaintext token is returned only in this
      response. The username is a slug of the label, or `agent`, followed by a
      hyphen and four random characters.
      Creation is limited per source IP, shared with POST /api/auth/guest. The
      default is 5 per hour, set by AGENT_CREATE_LIMIT_PER_HOUR; 0 disables
      creation. An IPv6 source counts as its /64 prefix.
      All responses have Cache-Control: no-store.
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentCreate
    responses:
      "201":
        description: Created agent and its token.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "429":
        description: AGENT_CREATE_RATE_LIMITED. Too many agents were created from this source IP in the last hour, or creation is disabled.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents/claim-codes:
  post:
    tags: [Authentication]
    operationId: createAgentClaimCode
    summary: Create a link that lets a human claim the current agent.
    description: |
      Needs the login session of an unclaimed agent, from any credential. The
      code lasts ten minutes and claims the agent once. The product database
      holds its hash, so any server replica accepts it and a restart keeps it.
      An agent holds at most ten live codes, and an eleventh replaces its
      oldest. All responses have Cache-Control: no-store.
    responses:
      "201":
        description: The claim code and the page that uses it.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimCode
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: FORBIDDEN. The current User is a human.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "503":
        description: AGENT_CLAIM_UNAVAILABLE. The server holds too many pending codes.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents/claim:
  get:
    tags: [Authentication]
    operationId: inspectAgentClaim
    summary: Show the agent a claim code names, before the current human claims it.
    description: |
      Needs a human's browser login session, like POST, and fails the same way
      for a code that cannot claim. All responses have Cache-Control: no-store.
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The agent, and whether the current human already owns it.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimPreview
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/identity.yaml#/AgentClaimInvalid
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "410":
        $ref: ../schemas/identity.yaml#/AgentClaimExpired
  post:
    tags: [Authentication]
    operationId: claimAgent
    summary: Make the current human the owner of the agent a claim code names.
    description: |
      Needs a human's browser login session. An agent, or a session issued by
      token exchange or a CLI login, gets 403. The agent gets an owner and a
      claim time and stops expiring. The owner holds the owner role in the
      agent's Personal Space; the agent gains no access to the owner's
      content. Claiming again as the same owner returns the agent unchanged.
      All responses have Cache-Control: no-store.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentClaim
    responses:
      "200":
        description: The claimed agent.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimed
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/identity.yaml#/AgentClaimInvalid
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "410":
        $ref: ../schemas/identity.yaml#/AgentClaimExpired

/api/agents/{agentId}/stop:
  post:
    tags: [Authentication]
    operationId: stopClaimedAgent
    summary: Stop an agent the current human claimed.
    description: |
      Needs a human's browser login session. Bans the agent: its sessions and
      tokens stop working, and its Personal Space, shared links included,
      gives a role to nobody but its owners. Its files stay. There is no undo.
      Stopping a stopped agent succeeds again.
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: The agent is stopped.
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        description: The current human did not claim this agent.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/guest:
  post:
    tags: [Authentication]
    operationId: continueAsGuestAgent
    summary: Create an agent User and sign a CLI in as it.
    description: |
      Needs no credentials. Creates the same agent User as POST /api/agents
      under the same per-source limit, but sets a login session cookie and
      returns no token. The session has the `agent` write source of a CLI
      login: it renews while in use, and it can never act for a person. A
      request that already carries a valid login session is refused with
      409, so it cannot replace a signed-in session.
      All responses have Cache-Control: no-store.
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/GuestAgentCreate
    responses:
      "201":
        description: Created agent. The response sets the session cookie.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/GuestAgentCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "409":
        description: CONFLICT. The request already carries a valid login session.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: AGENT_CREATE_RATE_LIMITED. Too many agents were created from this source IP in the last hour, or guest agents are turned off.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/tokens:
  get:
    tags: [Authentication]
    operationId: listPersonalAccessTokens
    summary: List the current User's personal access tokens.
    description: Token secrets and hashes are never returned.
    responses:
      "200":
        description: Personal access tokens, newest first.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/PersonalAccessTokenList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
  post:
    tags: [Authentication]
    operationId: createPersonalAccessToken
    summary: Create a personal access token.
    description: |
      The plaintext token is returned only in this response. Needs a person
      signed in to Workspace in a browser; an agent, a CLI login or a session
      issued by token exchange gets 403.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/PersonalAccessTokenCreate
    responses:
      "201":
        description: Created token.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/PersonalAccessTokenCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden

/api/auth/tokens/{id}:
  delete:
    tags: [Authentication]
    operationId: revokePersonalAccessToken
    summary: Revoke one of the current User's personal access tokens and end its downstream sessions.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Token revoked.
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/auth/logout:
  post:
