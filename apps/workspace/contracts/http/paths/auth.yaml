/api/session:
  get:
    tags: [Session]
    operationId: getSession
    summary: Get the current login session.
    security:
      - {}
      - sessionCookie: []
    responses:
      "200":
        description: Current authenticated or anonymous session.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/SessionView

/api/auth/authorize:
  get:
    tags: [Authentication]
    operationId: oauthAuthorize
    summary: Start OAuth authorization for a configured, registered or CIMD client.
    description: |
      Static `OAUTH_CLIENTS_JSON` clients keep their rules: an exact
      registered `redirect_uri`, a 32 to 256 character base64url `state`, and
      a `scope` from the client's configured scopes (default `identity`).

      When `MCP_RESOURCE_URLS` is set, dynamically registered MCP clients
      (`POST /api/auth/register`) and HTTPS Client ID Metadata Document (CIMD)
      clients may also authorize. CIMD is enabled by default; `MCP_CIMD_ENABLED=0`
      disables it. CIMD metadata is fetched only after interactive sign-in,
      when a browser continues as a guest agent (POST /api/auth/guest), or for
      a guest agent with no page as described below; invalid
      documents return 400 and temporary fetch failures return 503 here, never a
      client redirect. CIMD names are displayed with their URL hostname. They must send
      `response_type=code`, `code_challenge_method=S256` and a `resource`
      equal to one of `MCP_RESOURCE_URLS`, optionally followed by a query such as
      `?toolsets=all`; the grant is bound to the listed URL. `scope` is a subset of `read`,
      `write`, `publish` and `worktree:merge` (default all four) and `state`
      is optional, 1 to 1024 printable ASCII characters. A loopback
      `redirect_uri` matches a registered one with any port (RFC 8252); every
      other URI matches exactly. A signed-in user always sees a consent page that
      lists the requested scopes, each of which can be unchecked; the code
      carries only the checked scopes. A signed-in person also chooses whether
      the client connects as a new agent that they own or as themselves.

      A browser with no session gets no page when guest agents are enabled and
      the MCP client's `redirect_uri` is loopback `http` (`127.0.0.1`, `[::1]`
      or `localhost`, any port). The response redirects to the client with a
      code for a new guest agent, named after the client, that carries every
      requested scope, and sets no cookie. The agent is created when the code
      is redeemed, under the per-source limit POST /api/auth/guest uses, so a
      code nobody redeems creates nothing. A source at that limit gets 429
      before anything is fetched, and a CIMD document is fetched and refused
      as POST /api/auth/guest fetches and refuses it, answering here in JSON.
      While 10,000 codes wait unredeemed, such a guest gets
      `temporarily_unavailable` and no code; a code a signed-in user approves
      is never refused this way. A source that got 20 such codes in the last
      minute, redeemed or not, gets the same answer, with an
      `error_description` that says too many sign-ins came from this address.
      With any other `redirect_uri` the browser goes to the sign-in page,
      which offers that guest path. An unknown client or unregistered
      `redirect_uri` is answered here with 400; once both are verified, other
      errors redirect to the client with RFC 6749 `error` (`invalid_request`,
      `invalid_scope`, `invalid_target`, `unsupported_response_type`,
      `temporarily_unavailable` or `access_denied`), `error_description` and
      `state`. Every MCP success, error
      and deny callback includes `iss` (RFC 9207); static callbacks are unchanged.
    security:
      - {}
      - sessionCookie: []

    parameters:
      - name: client_id
        in: query
        description: Static configured ID, DCR client ID, or HTTPS CIMD URL (at most 2000 characters, non-root path, no credentials, query, fragment or dot segments). CIMD identity is compared verbatim.
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Required for static clients, as a 32 to 256 character base64url value; optional for MCP clients.
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,128}$
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: response_type
        in: query
        required: false
        description: Required for MCP clients.
        schema:
          type: string
          enum: [code]
      - name: code_challenge_method
        in: query
        required: false
        description: Required for MCP clients.
        schema:
          type: string
          enum: [S256]
      - name: resource
        in: query
        required: false
        description: Required for MCP clients (RFC 8707); one of `MCP_RESOURCE_URLS`, compared exactly after removing a query string such as `?toolsets=all`.
        schema:
          type: string
    responses:
      "302":
        description: Redirect to Workspace login, to the consent page, or back to the registered redirect_uri with a one-time code or an OAuth error.
        headers:
          Location:
            required: true
            schema:
              type: string
      "400":
        description: Unknown client, invalid redirect or invalid CIMD document. No client redirect.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
          text/html:
            schema:
              type: string
      "429":
        description: AGENT_CREATE_RATE_LIMITED, for a guest agent with no page. This source created too many agents or started too many metadata fetches in the last hour. No client redirect.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "503":
        description: CIMD fetch failed temporarily or capacity is busy, with no usable cached document. No client redirect; retry later. For a guest agent with no page, JSON OAUTH_CLIENT_UNAVAILABLE, or CLIENT_METADATA_BUSY with Retry-After.
        content:
          text/html:
            schema:
              type: string
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "403":
        description: The session was issued by token exchange; this action requires an interactive sign-in.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/authorize/consent:
  get:
    tags: [Authentication]
    operationId: getOAuthConsent
    summary: Show the interactive OAuth consent form.
    description: |
      Uses the same client, redirect, PKCE and resource validation as authorize.
      CIMD metadata is resolved only after interactive sign-in. The form saves the
      verified request with a single-use consent token bound to the signed-in user
      for five minutes. CIMD clients show their name and metadata URL hostname.
      For a signed-in person, an MCP client's form offers `connect_as`: a new
      agent that the person owns, preselected, or the person (`self`). When the
      per-source agent creation limit refuses this browser's address, the new
      agent is disabled with that reason and `self` is preselected. A signed-in
      agent connects only as itself.
    security:
      - {}
      - sessionCookie: []
    parameters:
      - $ref: "#/~1api~1auth~1authorize/get/parameters/0"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/1"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/2"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/3"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/4"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/5"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/6"
      - $ref: "#/~1api~1auth~1authorize/get/parameters/7"
    responses:
      "200":
        description: The consent form, with individually selectable MCP scopes.
        content:
          text/html:
            schema:
              type: string
      "302":
        $ref: "#/~1api~1auth~1authorize/get/responses/302"
      "400":
        $ref: "#/~1api~1auth~1authorize/get/responses/400"
      "403":
        $ref: "#/~1api~1auth~1authorize/get/responses/403"
      "503":
        $ref: "#/~1api~1auth~1authorize/get/responses/503"
  post:
    tags: [Authentication]
    operationId: submitOAuthConsent
    summary: Allow or deny a saved authorization request.
    description: |
      Consumes the form's saved request without fetching CIMD metadata again.
      Only checked MCP scopes are granted; at least one must be selected to allow.
      An MCP allow also needs `connect_as`. `self` makes the code act for the
      signed-in User. `new_agent`, only for a person, makes it act for a new
      agent that the person owns: redeeming the code creates the agent under the
      per-source agent creation limit, named after the client, and claims it
      for the person, so it is in the state of a guest agent that person claimed.
      A code nobody redeems creates no agent. A 400, 403 or 429 keeps the consent
      token valid, so the person can go back and choose again.
      Both successful and denied MCP callbacks include `iss`; static callbacks do not.
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [consent_token, decision]
            properties:
              consent_token:
                type: string
              decision:
                type: string
                enum: [allow, deny]
              scope:
                type: array
                items:
                  $ref: ../schemas/identity.yaml#/McpScope
              connect_as:
                type: string
                enum: [new_agent, self]
                description: Required to allow an MCP client. Ignored for static clients and on deny.
    responses:
      "303":
        description: Redirect to the verified callback with a one-time code or access_denied, the original state, and iss for MCP clients.
        headers:
          Location:
            required: true
            schema:
              type: string
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: The session was issued by token exchange and this action requires an interactive sign-in, or a signed-in agent chose `new_agent`.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: AGENT_CREATE_RATE_LIMITED. `new_agent` was chosen while this browser's address may create no agent. The message names the way out, connecting as yourself or trying again later.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/token:
  post:
    tags: [Authentication]
    operationId: oauthToken
    summary: Exchange a one-time authorization code for a registered client identity or MCP tokens, refresh MCP tokens, or exchange a personal access token or MCP access token for a downstream session.
    description: |
      Three grants share this endpoint.

      For dynamically registered MCP clients (only while `MCP_RESOURCE_URLS`
      is set), `authorization_code` and `refresh_token` take a form body with
      `client_id` (DCR ID or CIMD HTTPS URL) and no secret. If `resource` is
      omitted, the server uses the resource bound to the authorization code
      or stored grant. If present, it must match that resource. They return
      `McpTokenResponse` with `Cache-Control:
      no-store`. A code is good for one attempt; presenting an already
      redeemed code revokes the grant it produced. Redeeming a code for a new
      agent, a guest or an agent the consenting person owns, creates that
      agent; when its source reached the creation limit after authorization,
      the answer is `temporarily_unavailable` (429) and no agent is created. A refresh token rotates;
      presenting a rotated one within 60 seconds fails without side effects,
      later it revokes the grant. Errors use the RFC 6749 section 5.2 body
      `{ "error": "<code>", "error_description": "<description>" }` with
      `Cache-Control: no-store`: `invalid_request` (400, malformed request),
      `invalid_client` (401, unknown or missing `client_id`),
      `unsupported_grant_type` (400, a grant the client may not use or the
      server does not support) or `invalid_grant` (400, a bad code or refresh
      token, including a wrong client, `redirect_uri`, `code_verifier` or
      `resource`). While MCP OAuth is enabled, every non-static client
      request and every `refresh_token` request uses these errors, including
      unknown or missing clients. Token exchange keeps the rules below.

      Static `OAUTH_CLIENTS_JSON` clients keep their existing
      `authorization_code` behavior (JSON or form body) and Workspace error
      objects. When MCP OAuth is disabled, all requests keep their existing
      behavior.

      `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693) accepts
      only an `application/x-www-form-urlencoded` body and is open only to a
      confidential client registered with `"tokenExchange": true` that
      authenticates with `client_secret`. The `subject_token` is a personal
      access token or an MCP OAuth access token. An OAuth access token
      requires `resource`, which must equal the resource its grant was issued
      for; a personal access token ignores `resource`. The revocation check
      and the session insert happen in one database transaction. The
      response `access_token` is a Workspace login session, presented as the
      `workspace_session` cookie. It lives for 10 minutes, or less when the
      subject token expires sooner or the deployment session lifetime is
      shorter; `expires_in` reports the actual lifetime. Such a session
      cannot create personal access tokens, approve CLI logins, authorize
      OAuth clients or link identities (403). Errors use the RFC 6749 body
      `{ "error": "<code>" }`: `invalid_request` (400, including a JSON
      body), `invalid_grant` (400, including a subject token that belongs
      to a banned agent), `unauthorized_client` (400, a
      confidential client without `tokenExchange`) or `invalid_client` (401,
      an unknown or public client or a wrong secret).

      When the granted scope includes `session`, the response also carries a
      Workspace login session token in `access_token`; the client presents
      it as the `workspace_session` cookie on product and collaboration
      endpoints, acting with the authorizing User's permissions until it
      expires. Identity-only grants return an empty `access_token`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grant_type, code, client_id, redirect_uri, code_verifier]
            properties:
              grant_type:
                type: string
                enum: [authorization_code]
              code:
                type: string
              client_id:
                type: string
              client_secret:
                type: string
                description: Required for confidential clients; omitted for public PKCE clients.
              redirect_uri:
                type: string
              code_verifier:
                type: string
        application/x-www-form-urlencoded:
          schema:
            oneOf:
              - $ref: ../schemas/identity.yaml#/TokenExchangeRequest
              - $ref: ../schemas/identity.yaml#/McpAuthorizationCodeRequest
              - $ref: ../schemas/identity.yaml#/McpRefreshTokenRequest
    responses:
      "200":
        description: The registered client identity and, for `session` grants, a login session token; or MCP tokens.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: ../schemas/identity.yaml#/McpTokenResponse
                - type: object
                  properties:
                    access_token:
                      type: string
                      description: |
                        Workspace session token for `session` grants, empty
                        string for identity-only grants.
                    token_type:
                      type: string
                    expires_in:
                      type: integer
                      description: |
                        Seconds until the issued session expires for `session`
                        grants and token exchange.
                    issued_token_type:
                      type: string
                      description: Present for token exchange only.
                      enum: [urn:univer:params:oauth:token-type:workspace-session]
                    scope:
                      type: string
                      description: Present for token exchange only. Granted MCP scopes, space-separated.
                    subject:
                      $ref: ../schemas/identity.yaml#/TokenExchangeSubject
                    user:
                      $ref: ../schemas/identity.yaml#/User
                    executor_access:
                      const: true
                      description: |
                        Token exchange only. Present only when an operator
                        granted the user the shared MCP executor with
                        `db:executor-access`.
      "400":
        description: Workspace error for static clients or when MCP OAuth is disabled; otherwise `invalid_request`, `unsupported_grant_type` or `invalid_grant`. Token exchange may also return `unauthorized_client`.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/common.yaml#/ErrorResponse
                - $ref: ../schemas/identity.yaml#/OAuthTokenError
      "401":
        description: Workspace error for an invalid static-client secret or PKCE verifier; `invalid_client` for an unknown or missing MCP client or failed token-exchange client authentication.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../schemas/common.yaml#/ErrorResponse
                - $ref: ../schemas/identity.yaml#/OAuthTokenError
      "429":
        description: "`temporarily_unavailable`. The code was for a guest agent, and its source created too many agents since authorization. No agent was created."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError

/.well-known/oauth-authorization-server:
  get:
    tags: [Authentication]
    operationId: getOAuthAuthorizationServerMetadata
    summary: RFC 8414 authorization server metadata for MCP clients.
    description: |
      Served only while `MCP_RESOURCE_URLS` is set; otherwise 404. Endpoints
      are absolute URLs under `PUBLIC_ORIGIN`. Client ID Metadata Documents
      are not advertised.
    security: []
    responses:
      "200":
        description: Authorization server metadata.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AuthorizationServerMetadata
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/auth/register:
  post:
    tags: [Authentication]
    operationId: registerOAuthClient
    summary: RFC 7591 dynamic registration of a public MCP client.
    description: |
      Unauthenticated. Served only while `MCP_RESOURCE_URLS` is set;
      otherwise 404. Accepts a JSON body of at most 16 KiB. No client secret
      is issued. Registration stops with 503 once the deployment holds
      `MCP_MAX_REGISTERED_CLIENTS` clients (default 10,000).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/ClientRegistrationRequest
    responses:
      "201":
        description: The registered client.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationResponse
      "400":
        description: "`invalid_redirect_uri` or `invalid_client_metadata`."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "413":
        description: "`invalid_client_metadata`: the body is larger than 16 KiB."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError
      "503":
        description: "`temporarily_unavailable`: the registered-client cap is reached."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClientRegistrationError

/api/auth/revoke:
  post:
    tags: [Authentication]
    operationId: revokeOAuthToken
    summary: RFC 7009 revocation of an MCP client's grant.
    description: |
      Served only while `MCP_RESOURCE_URLS` is set; otherwise 404. Revokes
      the grant behind a current access or refresh token, and the downstream
      sessions exchanged from it, when it belongs to `client_id`. Answers 200
      with an empty body whether or not the token was valid.
    security: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: ../schemas/identity.yaml#/TokenRevocationRequest
    responses:
      "200":
        description: Processed; the token is no longer valid if it was.
      "400":
        description: "`invalid_request`: a JSON body or a missing token."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError
      "401":
        description: "`invalid_client`: `client_id` is not a registered MCP client."
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/OAuthTokenError
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/auth/agent-token:
  post:
    tags: [Authentication]
    operationId: createAgentToken
    summary: Issue a one-hour MCP access token for the browser Agents module.
    description: |
      Requires an interactive login session. Sessions issued by token exchange
      are rejected with 403. Accepts only [read], [read, write], or [read, publish],
      in either order, without duplicates. Never grants worktree:merge. The browser
      requests [read, publish] only for one explicitly approved tool call.
      The token is bound to /mcp at PUBLIC_ORIGIN, resolved against MCP_RESOURCE_URLS,
      and uses the first-party client univer-workspace-agents. No refresh token
      is returned. This is an OAuth grant and does not appear in the PAT list.
      All responses have Cache-Control: no-store.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentTokenCreate
    responses:
      "201":
        description: Created MCP access token.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentTokenCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "503":
        description: OAUTH_CLIENT_UNAVAILABLE. MCP_RESOURCE_URLS must include /mcp at PUBLIC_ORIGIN; MCP OAuth may be unconfigured.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents:
  get:
    tags: [Authentication]
    operationId: listClaimedAgents
    summary: List the agents the current human claimed.
    description: |
      Needs a human's browser login session; an agent or a session issued by
      token exchange or a CLI login gets 403. Agents come oldest claim first.
      All responses have Cache-Control: no-store.
    responses:
      "200":
        description: The claimed agents.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/ClaimedAgents
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
  post:
    tags: [Authentication]
    operationId: createAgent
    summary: Create an agent User and a personal access token for it.
    description: |
      Needs no credentials. Creates a User of kind agent with its own Personal
      Space, unclaimed and expiring 30 days later, and returns a personal access
      token with every MCP scope. The plaintext token is returned only in this
      response. The username is a slug of the label, or `agent`, followed by a
      hyphen and four random characters.
      Creation is limited per source IP, shared with POST /api/auth/guest. The
      default is 5 per hour, set by AGENT_CREATE_LIMIT_PER_HOUR; 0 disables
      creation. An IPv6 source counts as its /64 prefix.
      All responses have Cache-Control: no-store.
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentCreate
    responses:
      "201":
        description: Created agent and its token.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "429":
        description: AGENT_CREATE_RATE_LIMITED. Too many agents were created from this source IP in the last hour, or creation is disabled.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents/claim-codes:
  post:
    tags: [Authentication]
    operationId: createAgentClaimCode
    summary: Create a link that lets a human claim the current agent.
    description: |
      Needs the login session of an unclaimed agent, from any credential. The
      code lasts ten minutes and claims the agent once. The product database
      holds its hash, so any server replica accepts it and a restart keeps it.
      An agent holds at most ten live codes, and an eleventh replaces its
      oldest. All responses have Cache-Control: no-store.
    responses:
      "201":
        description: The claim code and the page that uses it.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimCode
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: FORBIDDEN. The current User is a human.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "503":
        description: AGENT_CLAIM_UNAVAILABLE. The server holds too many pending codes.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/agents/claim:
  get:
    tags: [Authentication]
    operationId: inspectAgentClaim
    summary: Show the agent a claim code names, before the current human claims it.
    description: |
      Needs a human's browser login session, like POST, and fails the same way
      for a code that cannot claim. All responses have Cache-Control: no-store.
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The agent, and whether the current human already owns it.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimPreview
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/identity.yaml#/AgentClaimInvalid
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "410":
        $ref: ../schemas/identity.yaml#/AgentClaimExpired
  post:
    tags: [Authentication]
    operationId: claimAgent
    summary: Make the current human the owner of the agent a claim code names.
    description: |
      Needs a human's browser login session. An agent, or a session issued by
      token exchange or a CLI login, gets 403. The agent gets an owner and a
      claim time and stops expiring. The owner holds the owner role in the
      agent's Personal Space; the agent gains no access to the owner's
      content. Claiming again as the same owner returns the agent unchanged.
      All responses have Cache-Control: no-store.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/AgentClaim
    responses:
      "200":
        description: The claimed agent.
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/AgentClaimed
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/identity.yaml#/AgentClaimInvalid
      "409":
        $ref: ../schemas/identity.yaml#/AgentAlreadyClaimed
      "410":
        $ref: ../schemas/identity.yaml#/AgentClaimExpired

/api/agents/{agentId}/stop:
  post:
    tags: [Authentication]
    operationId: stopClaimedAgent
    summary: Stop an agent the current human claimed.
    description: |
      Needs a human's browser login session. Bans the agent: its sessions and
      tokens stop working, and its Personal Space, shared links included,
      gives a role to nobody but its owners. Its files stay. There is no undo.
      Stopping a stopped agent succeeds again.
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: The agent is stopped.
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        description: The current human did not claim this agent.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/auth/guest:
  post:
    tags: [Authentication]
    operationId: continueAsGuestAgent
    summary: Create an agent User and sign the browser in as it.
    description: |
      Needs no credentials. Creates the same agent User as POST /api/agents
      under the same per-source limit, but sets a browser login session cookie
      and returns no token. A request that already carries a valid login
      session is refused with 409, so it cannot replace a signed-in session.
      A source at its limit is refused with 429 before anything is fetched.
      With `oauthAuthorization`, the authorization is checked first, as
      authorize checks it: a Client ID Metadata Document client's metadata is
      fetched now, and authorize reuses it. Guests may start 8 of the 32
      metadata fetches the server runs at once, one in flight per source, and
      each source may start 10 per hour, failed ones included. A cached
      document or a fetch already in flight costs nothing.
      A request authorize would refuse answers 400 or 503 and creates nothing.
      All responses have Cache-Control: no-store.
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/identity.yaml#/GuestAgentCreate
    responses:
      "201":
        description: Created agent. The response sets the session cookie.
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../schemas/identity.yaml#/GuestAgentCreated
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "409":
        description: CONFLICT. The request already carries a valid login session.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: AGENT_CREATE_RATE_LIMITED. Too many agents were created from this source IP in the last hour, the source started 10 metadata fetches in the last hour, or creation is disabled.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "503":
        description: |
          OAUTH_CLIENT_UNAVAILABLE. The client's metadata document could not be fetched right now.
          CLIENT_METADATA_BUSY, with Retry-After. Every metadata fetch guests may start is in
          use, or this source has another one in flight. Nothing was fetched. Retry after the delay.
        headers:
          Retry-After:
            description: Seconds to wait, sent only with CLIENT_METADATA_BUSY.
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

