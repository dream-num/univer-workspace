/api/spaces:
  get:
    tags: [Spaces]
    operationId: listSpaces
    summary: List Spaces the current User owns or has joined.
    description: Public Spaces belonging to others are available through Explore. Starred Spaces have a separate list.
    responses:
      "200":
        description: Personal Space followed by owned and joined Team Spaces.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/MySpaceList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized

/api/spaces/starred:
  get:
    tags: [Spaces]
    operationId: listStarredSpaces
    summary: List starred Spaces the current User can still read.
    description: Ordered by newest star first, then Space ID. Stars retained after access loss are omitted until access returns.
    responses:
      "200":
        description: Matching Spaces in display order.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized

/api/spaces/explore:
  get:
    tags: [Spaces]
    operationId: exploreSpaces
    summary: List public Spaces the current User neither owns nor has joined.
    description: Ordered by total stars descending, then name and ID. Includes starred public Spaces. This list is unpaginated.
    responses:
      "200":
        description: Matching Spaces in display order.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized

/api/spaces/pins:
  get:
    tags: [Spaces]
    operationId: getSpacePins
    summary: Get the current User's ordered sidebar pins.
    description: Owned or joined Spaces and starred public Spaces are eligible. Ineligible stored pins are omitted. If none survive, returns the first eight owned or joined Spaces with customized false. Stored pins remain available if eligibility returns.
    responses:
      "200":
        description: Current pins or defaults.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpacePins
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
  put:
    tags: [Spaces]
    operationId: setSpacePins
    summary: Replace the ordered sidebar pins.
    description: Accepts 1 to 12 unique IDs for owned or joined Spaces or starred public Spaces. Invalid, duplicate, over-limit, missing and ineligible IDs return the same 400 INVALID_INPUT with field spaceIds. Replacement is atomic and idempotent.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/spaces.yaml#/SetSpacePins
    responses:
      "200":
        description: Current pins or defaults.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpacePins
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
  delete:
    tags: [Spaces]
    operationId: resetSpacePins
    summary: Reset the sidebar pins to their defaults.
    description: Deletes stored pins and returns the first eight owned or joined Spaces with customized false. Idempotent.
    responses:
      "200":
        description: Current pins or defaults.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpacePins
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized

/api/team-spaces:
  post:
    tags: [Spaces]
    operationId: createTeamSpace
    summary: Create a Team Space owned by the current User.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/spaces.yaml#/CreateTeamSpace
    responses:
      "201":
        description: Created Team Space.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceView
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/spaces/lookup:
  get:
    tags: [Spaces]
    operationId: lookupSpace
    summary: Resolve `<owner>/<slug>` to a Space the current User may discover.
    description: |
      `owner` is a username (case-insensitive). `slug=personal` resolves the owner's Personal Space, including
      Personal Spaces of accounts that predate slugs. A hidden Space and a missing Space both return 404.
    parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
      - name: slug
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Space and effective capabilities.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceView
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/spaces/{spaceId}/star:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Spaces]
    operationId: getSpaceStar
    summary: Read the current User's star state and the Space's total stars.
    description: Requires login and existing Space access. A star never grants access.
    responses:
      "200":
        description: Current star state and count.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceStar
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  put:
    tags: [Spaces]
    operationId: starSpace
    summary: Star a Space for the current User.
    description: Idempotent and safe to retry. Requires login and existing Space access, including public-read access. Ignores client-supplied identities and counts.
    responses:
      "200":
        description: Starred state and updated total count.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceStar
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  delete:
    tags: [Spaces]
    operationId: unstarSpace
    summary: Remove the current User's star from a Space.
    description: Idempotent and safe to retry. Requires login and existing Space access. Removing an absent star leaves the count unchanged.
    responses:
      "200":
        description: Unstarred state and updated total count.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceStar
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/spaces/{spaceId}:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Spaces]
    operationId: getSpace
    summary: Get a Space the current User may discover.
    responses:
      "200":
        description: Space and effective capabilities.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceView
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  patch:
    tags: [Spaces]
    operationId: updateSpace
    summary: Update Space settings.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/spaces.yaml#/PatchSpace
    responses:
      "200":
        description: Updated Space.
        content:
          application/json:
            schema:
              $ref: ../schemas/spaces.yaml#/SpaceView
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/spaces/{spaceId}/activity:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema: { type: string }
  get:
    tags: [Spaces]
    operationId: getSpaceActivity
    summary: Daily Pull request and Issue activity for a Space, split by Session source.
    description: |
      Pull requests and Issues opened per day in the caller's time zone, merged Pull requests per day, and the
      newest events. Uses the same visibility as the Worktree and Issue lists. Personal Spaces report only
      their owner's User Worktrees and no Issues.
    parameters:
      - name: timeZone
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(UTC|[A-Za-z_]+(?:\/[A-Za-z0-9_+\-]+)+)$'
        description: IANA time zone accepted by Intl, for example `Asia/Shanghai`. Offset strings are rejected.
    responses:
      "200":
        description: Activity window.
        content:
          application/json:
            schema: { $ref: ../schemas/activity.yaml#/RepositoryActivity }
      "400": { $ref: ../schemas/common.yaml#/BadRequest }
      "401": { $ref: ../schemas/common.yaml#/Unauthorized }
      "404": { $ref: ../schemas/common.yaml#/NotFound }
