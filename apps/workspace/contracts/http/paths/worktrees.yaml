/api/worktrees/{worktreeId}/merge:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Worktrees]
    operationId: mergeWorktree
    summary: Merge Worktree Units and activate successful local Units.
    description: |
      The merge also publishes, as the merger, the page drafts that were pending and unexpired when it began, so
      the merger needs edit access to every Unit and to each of those page targets. The merge Operation records
      their IDs, so a replay or an Operation retry publishes the same drafts, and a draft that turns pending later
      waits for its author. A page whose target changed since its draft is left `conflicted` while the Units still
      merge. An agent starts at most 50 merges in 24 hours; one more returns `403 AGENT_QUOTA_EXCEEDED` until the
      oldest of them is 24 hours old. A replay or retry of a started merge is not counted again.

      In a Team Space whose `landing` is `checks`, an agent that does not own it merges only when every check
      that Trunk's `.agents/checks.md` declares has a counting `passed` result on the current content. Otherwise
      the merge returns `403 CHECKS_REQUIRED`, and the message names each check that has not passed with its
      state, or says why the declaration cannot be used. The server reads the declaration and decides again just
      before Trunk moves, so a merge Operation can also fail with `CHECKS_REQUIRED`. A refused merge does not
      count toward the 50.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/worktrees.yaml#/MergeWorktree
    responses:
      "200":
        description: Merge attempt reached a stable result.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeMergeResponse
      "202":
        description: Merge or Activation remains pending.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/operations.yaml#/OperationEnvelope
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: |
          The merger may not merge, as in the shared Forbidden response, or `CHECKS_REQUIRED`: the merger is an
          agent held to the declared checks, and not every one has passed on the current content.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        description: |
          The Worktree state does not allow a merge. `PAGE_REVIEW_REQUIRED`: a pending page's or file's author
          cannot write its target, so only a person signed in to the browser who sends `pageDraftIds` may merge. The
          message names the pages and files and the pull request URL. `PAGES_CHANGED`: `pageDraftIds` differs from the drafts this
          merge would publish, so the merger must review the pages again. The message names the pull request URL.
          A request that could get both gets `PAGE_REVIEW_REQUIRED`, which a newer review cannot clear outside the
          browser. Nothing changes.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/worktrees/{worktreeId}/discard:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Worktrees]
    operationId: discardWorktree
    summary: Discard a Draft or ready Worktree without rolling back merged Units.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    responses:
      "200":
        description: Worktree discarded.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeOperationResponse
      "202":
        description: Discard remains pending.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/operations.yaml#/OperationEnvelope
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/worktrees/{worktreeId}/checks:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Worktrees]
    operationId: listWorktreeChecks
    summary: List the declared checks and every reported result on a pull request.
    description: Declared checks are the `## name` headings in Trunk's `.agents/checks.md`, read as the caller. Needs review access.
    responses:
      "200":
        description: Checks and their results.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeChecks
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/worktrees/{worktreeId}/checks/{name}:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
    - name: name
      in: path
      required: true
      schema:
        $ref: ../schemas/worktrees.yaml#/WorktreeCheckName
  put:
    tags: [Worktrees]
    operationId: reportWorktreeCheck
    summary: Report whether one check passed on the pull request's current content.
    description: >-
      Needs review access and a ready pull request. The server binds the result to the current content. Reporting again
      on the same content replaces the caller's earlier result on this name, and the same report changes nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/worktrees.yaml#/ReportWorktreeCheck
    responses:
      "200":
        description: The check with every result on it.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeCheckEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/worktrees/{worktreeId}/units/{unitId}/removal:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
    - name: unitId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Worktrees]
    operationId: setWorktreeUnitRemoved
    summary: Mark a draft Unit for deletion or undo its deletion intent.
    description: Existing documents remain available until merge; canceled local Units are never published. Only editable drafts accept changes to deletion intent.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [removed]
            properties:
              removed:
                type: boolean
    responses:
      "200":
        description: Worktree with updated deletion intent.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
