/api/worktrees:
  get:
    tags: [Worktrees]
    operationId: listWorktrees
    summary: List reviewable Worktrees and private Team Worktrees manageable by an Owner or Admin.
    parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum: [active, processed, all]
          default: active
      - name: search
        in: query
        description: Literal substring of name, summary, creator display name or username, or Team Space name. ASCII case-insensitive; other characters match exactly. Applied before pagination.
        schema:
          type: string
          maxLength: 200
      - name: order
        in: query
        description: Descending product timestamp, with ascending Worktree ID as a stable tie-breaker. Cursors must be reused with the same filters and order.
        schema:
          type: string
          enum: [updatedAtDesc, createdAtDesc]
          default: updatedAtDesc
      - name: kind
        in: query
        required: false
        schema:
          $ref: ../schemas/worktrees.yaml#/WorktreeKind
      - name: teamSpaceId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Keep only Worktrees in these states. Repeat the parameter for several states. Applied before pagination, so a page is full unless the result is exhausted.
        schema:
          type: array
          items:
            $ref: ../schemas/worktrees.yaml#/WorktreeState
        style: form
        explode: true
      - $ref: ../schemas/common.yaml#/CursorParameter
      - $ref: ../schemas/common.yaml#/LimitParameter
    responses:
      "200":
        description: |
          Reviewable Worktrees plus Summary-only private Team Worktrees the
          current Space Owner or Admin may manage.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeList
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
  post:
    tags: [Worktrees]
    operationId: createWorktree
    summary: Create a User or Team Worktree.
    description: |
      An agent has at most 10 open Worktrees, those it is still creating included, every kind and every way of
      opening counted. One more returns `403 AGENT_QUOTA_EXCEEDED` until it merges or discards one. Repeating a
      pending or completed creation with the same Idempotency-Key is not counted again. A failed creation runs again
      only with a free place, whether repeated with its Idempotency-Key or retried through
      `POST /api/operations/{operationId}/retry`.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/worktrees.yaml#/CreateWorktree
    responses:
      "201":
        description: Worktree created.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeSummary
      "202":
        description: Worktree creation remains pending.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/operations.yaml#/OperationEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/spaces/{spaceId}/worktrees/{number}:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
    - name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  get:
    tags: [Worktrees]
    operationId: getWorktreeByNumber
    summary: Get a Worktree by its repository-level number.
    description: |
      In a Team Space the number addresses a Team Worktree. In the caller's own Personal Space it addresses one of
      the caller's User Worktrees. Hidden and missing Worktrees both return 404.
    responses:
      "200":
        description: Worktree detail.
        content:
          application/json:
            schema:
              $ref: ../schemas/worktrees.yaml#/WorktreeEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/worktrees/{worktreeId}:
