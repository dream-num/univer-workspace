/api/html-view-drafts:
  post:
    tags: [Blobs]
    operationId: submitHtmlViewDraft
    summary: Stage an HTML View for interactive author approval.
    description: |
      Every Unit the page binds must be in the source pull request or readable by the author, otherwise `403`.
      A draft attached to a pull request that is ready or merging is refused with `409`; reopen it first.
      A pull request holds at most 20 pending drafts; one more is refused with `409`, and a revision replaces its predecessor.
      The author of a Team pull request who may edit its draft proposes a page in its Team Space with read access to the page or its destination.
      Elsewhere the author needs edit access to the page, or may create at its destination.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/html-view-drafts.yaml#/SubmitHtmlViewDraft
    responses:
      "201":
        description: New draft.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftEnvelope
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
      "412":
        description: The target ETag changed before intake.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "413":
        $ref: ../schemas/common.yaml#/PayloadTooLarge
/api/html-view-drafts/{draftId}:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Blobs]
    operationId: getHtmlViewDraft
    summary: Read a draft as its author or as a reviewer of its source pull request, deriving expiry and stale target state.
    description: Anyone else, including a reviewer of a draft with no source pull request, gets `404`.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/html-view-drafts/{draftId}/content:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Blobs]
    operationId: getHtmlViewDraftContent
    summary: Read unpublished draft bytes as inert text, as the author or a reviewer of the source pull request.
    responses:
      "200":
        description: Current draft or idempotent replay.
        headers:
          Content-Security-Policy:
            schema:
              type: string
              const: sandbox
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          text/plain; charset=utf-8:
            schema:
              type: string
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/html-view-drafts/{draftId}/publish:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Blobs]
    operationId: publishHtmlViewDraft
    summary: Publish a draft as its interactive author.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/html-view-drafts/{draftId}/reject:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Blobs]
    operationId: rejectHtmlViewDraft
    summary: Reject a draft as its interactive author.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/worktrees/{worktreeId}/html-view-drafts:
  parameters:
    - name: worktreeId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Blobs]
    operationId: listWorktreeHtmlViewDrafts
    summary: List the HTML View drafts a pull request carries, for anyone who may review it.
    description: Includes drafts by any author and terminal drafts, so a reviewer sees each page's result. Callers without `review` on the pull request get `404`.
    responses:
      "200":
        description: Drafts attached to the pull request.
        content:
          application/json:
            schema:
              $ref: ../schemas/html-view-drafts.yaml#/HtmlViewDraftList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
