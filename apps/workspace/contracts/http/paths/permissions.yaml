/api/users/search:
  get:
    tags: [Users]
    operationId: searchUsers
    summary: Find Users for Team Membership or Direct Share.
    description: >-
      Match username or display name substrings, or an exact User ID, excluding the caller
      and every unclaimed or stopped agent.
      Exact ID and username matches come first, followed by username order.
      Username comparison ignores ASCII case only, matching SQLite NOCASE.
      An unclaimed agent gets `AGENT_NOT_ALLOWED`.
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
    responses:
      "200":
        description: At most twenty Public User summaries.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/UserSearchResult
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden

/api/team-spaces/{spaceId}/members:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Membership]
    operationId: listTeamMembers
    summary: List a Team Space Owner and Memberships.
    responses:
      "200":
        description: Team membership.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/TeamMemberList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/team-spaces/{spaceId}/members/{userId}:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
    - name: userId
      in: path
      required: true
      schema:
        type: string
  put:
    tags: [Membership]
    operationId: upsertTeamMember
    summary: Add a Team Member or change their Role.
    description: |
      Adding a member or raising a member's Role lets more people see data, so only a person signed in
      to Workspace in a browser may do it. Any other session that may manage members gets
      `403 INTERACTIVE_SESSION_REQUIRED` with `url` set to
      `/confirm/member?space=<spaceId>&user=<userId>&role=<role>`, and the Membership does not change.
      An unclaimed agent gets `403 AGENT_NOT_ALLOWED`. Every session that may manage members may lower
      a Role or repeat the stored one. A caller without that capability gets `403 FORBIDDEN` and no `url`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/permissions.yaml#/UpsertTeamMembership
    responses:
      "200":
        description: Current Membership.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/TeamMembership
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
  delete:
    tags: [Membership]
    operationId: removeTeamMember
    summary: Remove a Team Member or leave the Team Space.
    responses:
      "204":
        description: Membership removed.
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/nodes/{nodeId}/grants:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Sharing]
    operationId: listNodeGrants
    summary: List direct Grants on a Personal Space Node.
    responses:
      "200":
        description: Direct Grants only.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/NodeGrantList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/nodes/{nodeId}/grants/{userId}:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
    - name: userId
      in: path
      required: true
      schema:
        type: string
  put:
    tags: [Sharing]
    operationId: upsertNodeGrant
    summary: Create or change a Direct Share.
    description: |
      Sharing a Node with a User or raising that User's Role lets more people see data, so only a person
      signed in to Workspace in a browser may do it. Any other session that may share the Node gets
      `403 INTERACTIVE_SESSION_REQUIRED` with `url` set to
      `/confirm/grant?node=<nodeId>&user=<userId>&role=<role>`, and the Grant does not change. An
      unclaimed agent gets `403 AGENT_NOT_ALLOWED`. Every session that may share the Node may lower a
      Role or repeat the stored one. A caller without that capability gets `403 FORBIDDEN` and no `url`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/permissions.yaml#/UpsertNodeGrant
    responses:
      "200":
        description: Current direct and effective Role.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/NodeGrant
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
  delete:
    tags: [Sharing]
    operationId: removeNodeGrant
    summary: Remove one direct Grant.
    responses:
      "200":
        description: Effective Role remaining through ancestor Grants.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/GrantRemovalResult
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/nodes/{nodeId}/link-sharing:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Sharing]
    operationId: getNodeLinkSharing
    summary: Get Link Sharing settings for a Personal Space Node.
    responses:
      "200":
        description: Current Link Sharing settings.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/NodeLinkSharing
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  put:
    tags: [Sharing]
    operationId: updateNodeLinkSharing
    summary: Enable, disable, or change Link Sharing for a Personal Space Node.
    description: |
      Turning Link Sharing on, or changing its role from `viewer` to `editor`, lets more people see
      data, so only a person signed in to Workspace in a browser may do it. Any other session that may
      share the Node gets `403 INTERACTIVE_SESSION_REQUIRED` with `url` set to
      `/confirm/link-sharing?node=<nodeId>&role=<role>`, and the settings do not change. An unclaimed
      agent gets `403 AGENT_NOT_ALLOWED`. Every
      session that may share the Node may turn Link Sharing off or change `editor` to `viewer`. A
      caller without that capability gets `403 FORBIDDEN` and no `url`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/permissions.yaml#/UpdateNodeLinkSharing
    responses:
      "200":
        description: Updated Link Sharing settings.
        content:
          application/json:
            schema:
              $ref: ../schemas/permissions.yaml#/NodeLinkSharing
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
