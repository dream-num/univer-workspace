/api/forks:
  post:
    tags: [Forks]
    operationId: createFork
    summary: Fork a Team Space the current User can propose in.
    description: |
      Writes one product row and nothing else: no Node, Resource, Unit, Blob or Collaboration data.
      Repeating the request with the same `name` and `upstreamSpaceId` returns the existing fork with
      `200`. A name that one of the owner's forks of another upstream, or one of the owner's Team Space
      slugs, already uses returns `409 SPACE_SLUG_TAKEN`. An upstream the caller cannot read, and a
      Personal Space, return `404`. A caller who can read the upstream but may not propose in it, see
      `capabilities.propose` and the Space's `proposals` setting, gets `403 FORBIDDEN` with a message that
      names the setting. An unclaimed agent owns at most 3 forks (`403 AGENT_QUOTA_EXCEEDED`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/forks.yaml#/CreateFork
    responses:
      "200":
        description: The caller's existing fork of this name and upstream.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkView
      "201":
        description: Created fork.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkView
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
  get:
    tags: [Forks]
    operationId: listForks
    summary: List the current User's forks by name.
    description: Only a fork's owner sees it.
    responses:
      "200":
        description: The caller's forks.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkList
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized

/api/forks/lookup:
  get:
    tags: [Forks]
    operationId: lookupFork
    summary: Resolve `<owner>/<name>` to one of the current User's forks.
    description: |
      `owner` is a username and `name` a fork name, both case-insensitive. Another User's fork and a
      missing fork both return 404. `GET /api/spaces/lookup` never resolves a fork address.
    parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The fork.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkView
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/forks/{forkId}:
  parameters:
    - name: forkId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Forks]
    operationId: getFork
    summary: Read one of the current User's forks.
    description: Another User's fork returns 404. The fork stays readable after the owner loses the upstream, with `upstream` null.
    responses:
      "200":
        description: The fork.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkView
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  delete:
    tags: [Forks]
    operationId: deleteFork
    summary: Delete one of the current User's forks.
    description: |
      Deletes the fork row only. The upstream does not change, and every Worktree the fork had keeps its
      history and becomes an ordinary Team Worktree of the upstream. Another User's fork returns 404.
    responses:
      "200":
        description: The fork is gone. The response names the open Worktree it leaves behind.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkDeletion
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/forks/{forkId}/units:
  parameters:
    - name: forkId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Forks]
    operationId: addForkUnit
    summary: Write a Unit into the fork's open Worktree, opening that Worktree on the first write.
    description: |
      Takes the same body as `POST /api/worktrees/{worktreeId}/units`. When the fork has no open Worktree, the
      server opens one: a private Team Worktree of the upstream, authored by the fork's owner and named after
      the fork. Only this route links a Worktree to a fork, and `POST /api/worktrees` never does. A Trunk Resource
      joins with its own Unit ID, and its baseline is the upstream Trunk revision at this moment. A Trunk
      Resource already in the Worktree returns `200` and adds nothing. Two concurrent first writes end in one
      open Worktree that holds both Units. When the open Worktree is not a draft, the write returns
      `409 FORK_WORKTREE_NOT_DRAFT` and names its state. Reopen a ready Worktree first, and wait for a merge to
      finish. Once the open Worktree is merged or discarded the fork is `clean`, and the next write opens a new
      Worktree. Another User's fork, and a fork whose upstream its owner can no longer read, return `404`. An owner
      who may no longer propose in the upstream gets `403 FORBIDDEN`, and so does one who is not a Space Member
      and already holds 3 open proposals there. Opening the Worktree counts against an agent's 10 open Worktrees
      (`403 AGENT_QUOTA_EXCEEDED`), as `POST /api/worktrees` does. The Unit's content is then written through the
      Worktree, as in any other Worktree.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/worktrees.yaml#/AddWorktreeUnit
    responses:
      "200":
        description: The Trunk Resource was already in the fork's open Worktree.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkUnitWrite
      "201":
        description: The Unit joined the fork's open Worktree.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkUnitWrite
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/forks/{forkId}/worktree:
  parameters:
    - name: forkId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Forks]
    operationId: openForkWorktree
    summary: Open the fork's Worktree for a write that adds no Unit, or return the open one.
    description: |
      A page draft through a fork attaches to the fork's open Worktree, which this route returns. On a `clean`
      fork it opens that Worktree as `POST /api/forks/{forkId}/units` does, with no Unit, and returns `201`.
      The Collaboration SDK readies and merges a Worktree with no Unit, so a proposal of pages alone is a pull
      request like any other. When the open Worktree is not a draft, the request returns
      `409 FORK_WORKTREE_NOT_DRAFT` and names its state. Another User's fork, and a fork whose upstream its owner
      can no longer read, return `404`. An owner who may no longer propose in the upstream gets `403 FORBIDDEN`,
      and an agent already at 10 open Worktrees `403 AGENT_QUOTA_EXCEEDED`.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    responses:
      "200":
        description: The fork's open draft Worktree.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkWorktree
      "201":
        description: The Worktree this request opened.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkWorktree
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/forks/{forkId}/blob-resources/{resourceId}/content:
  parameters:
    - name: forkId
      in: path
      required: true
      schema:
        type: string
    - name: resourceId
      in: path
      required: true
      schema:
        type: string
  put:
    tags: [Forks]
    operationId: replaceForkBlobContent
    summary: Propose new bytes for an upstream file through the fork, as a draft its pull request's merge publishes.
    description: |
      Takes the request of `PUT /api/blob-resources/{resourceId}/content`, but never writes the upstream. The bytes
      become a `replace` draft (`page: false`) attached to the fork's open Worktree, which a `clean` fork opens as
      `POST /api/forks/{forkId}/units` does. When that Worktree is not a draft the request returns
      `409 FORK_WORKTREE_NOT_DRAFT`. The Resource must be a ready Blob of the upstream that the caller can read,
      otherwise `404`. A page (`.univer.html`) is refused with `403 HTML_VIEW_DRAFT_REQUIRED`; pages change through
      HTML View drafts. `If-Match` must be the file's current ETag, otherwise `412`. The draft supersedes the
      caller's pending draft of the same file in that Worktree, and a pull request holds at most 20 pending drafts,
      pages and files together (`409`). Repeating a request with the same Idempotency-Key, target, `If-Match` and
      `Content-Length` returns its draft with `200` and does not read the new body. While the first request still
      receives bytes, or after it failed, the key returns `409`; use a new key after a failure. Merging the pull
      request publishes the draft as the merger, by the rules for pages: the merger needs edit access to the file,
      a file whose upstream ETag changed after intake ends `conflicted` and keeps the upstream bytes, and when the
      draft's author cannot write the file, only a person merging in the browser with the reviewed list publishes it.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Exactly one quoted strong ETag of the upstream file, as Blob content or `blob_download` returns it.
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    responses:
      "200":
        description: The draft this Idempotency-Key already made.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkBlobWrite
      "201":
        description: The new draft, attached to the fork's open Worktree.
        content:
          application/json:
            schema:
              $ref: ../schemas/forks.yaml#/ForkBlobWrite
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: Insufficient permission, `HTML_VIEW_DRAFT_REQUIRED` for a page, or `AGENT_QUOTA_EXCEEDED` when an unclaimed agent stores a file above 10 MB or an agent at 10 open Worktrees writes to a `clean` fork.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
      "412":
        description: The upstream file changed since the supplied ETag. Download it through the fork again.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "413":
        $ref: ../schemas/common.yaml#/PayloadTooLarge
