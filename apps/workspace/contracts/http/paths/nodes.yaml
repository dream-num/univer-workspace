/api/spaces/{spaceId}/nodes:
  parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
  get:
    security:
      - {}
      - sessionCookie: []
    description: Anonymous readers receive viewer access through Link Sharing or Space public read; inaccessible content returns 404.
    tags: [Nodes]
    operationId: listSpaceRootNodes
    summary: List the root Nodes of a Space.
    parameters:
      - $ref: ../schemas/common.yaml#/CursorParameter
      - $ref: ../schemas/common.yaml#/LimitParameter
    responses:
      "200":
        description: Node page for the Space root.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodePage
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/nodes:
  post:
    tags: [Nodes]
    operationId: createNode
    summary: Create a pure organizational Node.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/nodes.yaml#/CreateNode
    responses:
      "201":
        description: Created Node.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodeSummary
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/nodes/{nodeId}:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  get:
    security:
      - {}
      - sessionCookie: []
    description: Anonymous readers receive viewer access through Link Sharing or Space public read; inaccessible content returns 404.
    tags: [Nodes]
    operationId: getNode
    summary: Get Node metadata without loading children or content.
    responses:
      "200":
        description: Node metadata and navigation context.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodeResponse
      "404":
        $ref: ../schemas/common.yaml#/NotFound
  patch:
    tags: [Nodes]
    operationId: updateNode
    summary: Atomically rename or move a Node.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/nodes.yaml#/PatchNode
    responses:
      "200":
        description: Updated Node.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodeSummary
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: Insufficient permission, or HTML_VIEW_DRAFT_REQUIRED when a token-issued session writes a .univer.html page. Use html_view_save drafts.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/nodes/{nodeId}/children:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  get:
    security:
      - {}
      - sessionCookie: []
    description: Anonymous readers receive viewer access through Link Sharing or Space public read; inaccessible content returns 404.
    tags: [Nodes]
    operationId: listNodeChildren
    summary: List the direct children of any Node.
    parameters:
      - $ref: ../schemas/common.yaml#/CursorParameter
      - $ref: ../schemas/common.yaml#/LimitParameter
    responses:
      "200":
        description: Direct child Node page.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodePage
      "404":
        $ref: ../schemas/common.yaml#/NotFound

/api/nodes/{nodeId}/reports:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  post:
    security:
      - {}
      - sessionCookie: []
    tags: [Nodes]
    operationId: reportNode
    summary: Report a Node for abuse.
    description: |
      Needs no credentials. The requester must be able to read the Node, as an
      anonymous reader or through its session; any other Node returns 404.
      Reports are limited to 10 per source IP per hour, and an IPv6 source
      counts as its /64 prefix. The reason is stored for operators and is not
      shown to anyone else.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/nodes.yaml#/CreateNodeReport
    responses:
      "201":
        description: Stored report.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/NodeReport
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "429":
        description: REPORT_RATE_LIMITED. Too many reports were sent from this source IP in the last hour.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse

/api/nodes/{nodeId}/copies:
  parameters:
    - name: nodeId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Nodes]
    operationId: copyNode
    summary: Copy a file into a file of the caller's own.
    description: |
      Copies a Sheet, Doc, Slide or Blob file the caller can open, with its
      embedded images. The copy lands at the root of the caller's Personal
      Space, or as a new file in a draft pull request the caller can add files
      to. It starts a history of its own and records its source, which
      `getNode` returns as `copiedFromNodeId`. Comments, history, grants and
      Link Sharing are not copied. A folder returns 400. A source the caller
      cannot open returns the same 404 as reading it. For an unclaimed agent
      the copied images of one file count together against the stored-file
      size ceiling.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/nodes.yaml#/CopyNode
    responses:
      "201":
        description: Copy created during the initial attempt.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/CopyNodeResponse
      "200":
        description: Existing completed result for the Idempotency Key.
        content:
          application/json:
            schema:
              $ref: ../schemas/nodes.yaml#/CopyNodeResponse
      "202":
        description: The copy remains pending, or failed and removed what it had created.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/operations.yaml#/OperationEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        description: Insufficient permission on the target, a ceiling, or HTML_VIEW_DRAFT_REQUIRED when a token-issued session copies a .univer.html page.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
