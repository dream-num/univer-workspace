/api/skill-drafts:
  post:
    tags: [Blobs]
    operationId: submitSkillDraft
    summary: Stage a Skill for interactive author approval.
    parameters:
      - $ref: ../schemas/common.yaml#/IdempotencyKeyParameter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/skill-drafts.yaml#/SubmitSkillDraft
    responses:
      "201":
        description: New draft.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillDraftEnvelope
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
      "413":
        $ref: ../schemas/common.yaml#/PayloadTooLarge
      "422":
        description: GitHub tree was truncated.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: Source hub rate limit. Upload the Skill zip to Space instead.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "502":
        description: Source hub could not be read.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
/api/skill-drafts/{draftId}:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Blobs]
    operationId: getSkillDraft
    summary: Read an author-owned immutable Skill draft with review and removal metadata.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/skill-drafts/{draftId}/content:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  get:
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: File path relative to the Skill folder.
      - name: version
        in: query
        schema:
          type: string
          enum: [draft, current]
          default: draft
        description: Current reads recheck destination and file access. Draft bytes exist only while pending and unexpired.
    tags: [Blobs]
    operationId: getSkillDraftContent
    summary: Read draft or current Skill file content as inert text.
    responses:
      "200":
        description: Current draft or idempotent replay.
        headers:
          Content-Security-Policy:
            schema:
              type: string
              const: sandbox
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          text/plain; charset=utf-8:
            schema:
              type: string
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/skill-drafts/{draftId}/publish:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Blobs]
    operationId: publishSkillDraft
    summary: Rescan and publish all files atomically as the interactive author.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
/api/skill-drafts/{draftId}/reject:
  parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Blobs]
    operationId: rejectSkillDraft
    summary: Reject a draft as its interactive author.
    responses:
      "200":
        description: Current draft or idempotent replay.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillDraftEnvelope
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "403":
        $ref: ../schemas/common.yaml#/Forbidden
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict

/api/skill-sources/read:
  post:
    tags: [Blobs]
    operationId: readSkillSource
    summary: Resolve a pinned external or readable Space source and list, scan or page its Skills.
    description: >-
      Source strings resolve GitHub and skills.sh to a commit, ClawHub to owner/slug/version,
      and a Space zip or folder node to its ETag. Repeat with the returned source object to
      stay on that version. skill is a candidate path, with . for a root Skill.
      No skill lists candidates. skill reads all file metadata, SKILL.md and a static scan.
      path pages a UTF-8 text file up to 256 KiB. Cursors bind the pinned source, skill,
      path and content and use character offsets without splitting surrogate pairs.
      GitHub rate limits return SKILL_SOURCE_RATE_LIMITED with zip-upload guidance.
      ClawHub ambiguity returns SKILL_SOURCE_AMBIGUOUS and candidate owner handles in the message.
      A truncated GitHub tree returns SKILL_SOURCE_TRUNCATED. Hub failures use SKILL_SOURCE_UNAVAILABLE.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/skill-drafts.yaml#/ReadSkillSource
    responses:
      "200":
        description: Candidate list, inspected Skill, or one text page. Only the requested variant is returned.
        content:
          application/json:
            schema:
              $ref: ../schemas/skill-drafts.yaml#/SkillSourceResult
      "400":
        $ref: ../schemas/common.yaml#/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/Unauthorized
      "404":
        $ref: ../schemas/common.yaml#/NotFound
      "409":
        $ref: ../schemas/common.yaml#/Conflict
      "413":
        $ref: ../schemas/common.yaml#/PayloadTooLarge
      "422":
        description: GitHub tree is truncated. Upload a smaller Skill zip to Space.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "429":
        description: Hub rate limit or GitHub access restriction. Ask the user to download a zip and upload it to Space.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
      "502":
        description: Hub response, redirect or request timeout prevented reading the source.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ErrorResponse
