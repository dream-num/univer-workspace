<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9ebf1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("univer-workspace-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 8v8.5a7 7 0 0 0 14 0V8h-4.4v8.3a2.6 2.6 0 0 1-5.2 0V8z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Univer Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/entry.tsx"></script>
  </body>
</html>
