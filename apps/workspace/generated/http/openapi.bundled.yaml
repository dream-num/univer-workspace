        - unitType
        - capabilities
      properties:
        id:
          type: string
        kind:
          type: string
          const: univer
        unitId:
          type: string
        unitType:
          $ref: '#/components/schemas/UnitType'
        capabilities:
          $ref: '#/components/schemas/ResourceCapabilities'
    BlobAvailability:
