        '202':
          description: Discard remains pending.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: workspace_session
      description: Opaque HttpOnly login session cookie.
    discordBotApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Shared secret configured on Workspace and the trusted Discord Bot server.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable diagnostic text.
        field:
          type: string
          description: Input field related to the error, when applicable.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
    PublicUser:
      $ref: '#/components/schemas/User'
    SessionView:
      oneOf:
        - $ref: '#/components/schemas/AnonymousSession'
        - $ref: '#/components/schemas/AuthenticatedSession'
    SpaceView:
      allOf:
        - $ref: '#/components/schemas/SpaceSummary'
        - type: object
          required:
            - accessRole
            - capabilities
          properties:
            accessRole:
              $ref: '#/components/schemas/SpaceRole'
            capabilities:
              $ref: '#/components/schemas/SpaceCapabilities'
      unevaluatedProperties: false
    NodeSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - parentNodeId
        - name
        - resource
        - hasChildren
        - updatedAt
        - accessRole
        - capabilities
      properties:
        id:
          type: string
        spaceId:
          type: string
        parentNodeId:
          type:
            - string
            - 'null'
        name:
          type: string
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceSummary'
            - type: 'null'
        hasChildren:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        accessRole:
          $ref: '#/components/schemas/AccessRole'
        capabilities:
          $ref: '#/components/schemas/NodeCapabilities'
    NodePage:
      type: object
      additionalProperties: false
      required:
        - space
        - parentNode
        - navigationRootNodeId
        - breadcrumbs
        - nodes
        - nextCursor
      properties:
        space:
          $ref: '#/components/schemas/SpaceSummary'
        parentNode:
          oneOf:
            - $ref: '#/components/schemas/NodeSummary'
            - type: 'null'
        navigationRootNodeId:
          type:
            - string
            - 'null'
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeSummary'
        nextCursor:
          type:
            - string
            - 'null'
    OperationView:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - state
        - createdAt
        - updatedAt
        - result
        - error
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/OperationKind'
        state:
          $ref: '#/components/schemas/OperationState'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          oneOf:
            - $ref: '#/components/schemas/OperationError'
            - type: 'null'
    ResourceOpenView:
      type: object
      additionalProperties: false
      required:
        - resource
      properties:
        resource:
          oneOf:
            - $ref: '#/components/schemas/OpenUniverResource'
            - $ref: '#/components/schemas/OpenBlobResource'
          discriminator:
            propertyName: kind
            mapping:
              univer: '#/components/schemas/OpenUniverResource'
              blob: '#/components/schemas/OpenBlobResource'
    BlobUploadSessionEnvelope:
      type: object
      additionalProperties: false
      required:
        - operation
        - upload
        - uploadTarget
      properties:
        operation:
          $ref: '#/components/schemas/OperationView'
        upload:
          $ref: '#/components/schemas/BlobUploadSession'
        uploadTarget:
          oneOf:
            - $ref: '#/components/schemas/BlobUploadTarget'
            - type: 'null'
    TrashBatchView:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - root
        - originalLocation
        - trashedBy
        - trashedAt
        - nodeCount
        - capabilities
        - restoreBlockedBy
        - removeBlockedBy
      properties:
        id:
          type: string
        spaceId:
          type: string
        root:
          $ref: '#/components/schemas/TrashRoot'
        originalLocation:
          type: object
          additionalProperties: false
          required:
            - breadcrumbs
          properties:
            breadcrumbs:
              type: array
              items:
                $ref: '#/components/schemas/Breadcrumb'
        trashedBy:
          $ref: '#/components/schemas/User'
        trashedAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
          minimum: 1
        capabilities:
          $ref: '#/components/schemas/TrashCapabilities'
        restoreBlockedBy:
          oneOf:
            - $ref: '#/components/schemas/TrashBlocker'
            - type: 'null'
        removeBlockedBy:
          oneOf:
            - $ref: '#/components/schemas/TrashBlocker'
            - type: 'null'
    TeamMembership:
      type: object
      additionalProperties: false
      required:
        - user
        - role
        - grantedBy
        - createdAt
        - updatedAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/TeamRole'
        grantedBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NodeGrant:
      type: object
      additionalProperties: false
      required:
        - user
        - role
        - effectiveRole
        - grantedBy
        - createdAt
        - updatedAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/GrantRole'
        effectiveRole:
          $ref: '#/components/schemas/GrantRole'
        grantedBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NodeLinkSharing:
      type: object
      additionalProperties: false
      required:
        - enabled
        - role
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        enabled:
          type: boolean
        role:
          $ref: '#/components/schemas/LinkSharingRole'
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    WorktreeSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - summary
        - kind
        - teamSpace
        - visibility
        - state
        - creator
        - unitCount
        - processedAt
        - createdAt
        - updatedAt
        - capabilities
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type:
            - string
            - 'null'
        kind:
          $ref: '#/components/schemas/WorktreeKind'
        teamSpace:
          oneOf:
            - $ref: '#/components/schemas/SpaceSummary'
            - type: 'null'
        visibility:
          $ref: '#/components/schemas/WorktreeVisibility'
        state:
          $ref: '#/components/schemas/WorktreeState'
        creator:
          $ref: '#/components/schemas/User'
        unitCount:
          type: integer
          minimum: 0
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        capabilities:
          $ref: '#/components/schemas/WorktreeCapabilities'
    WorktreeDetail:
      allOf:
        - $ref: '#/components/schemas/WorktreeSummary'
        - type: object
          required:
            - units
          properties:
            units:
              type: array
              items:
                $ref: '#/components/schemas/WorktreeUnit'
    AnonymousSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - githubOAuthEnabled
        - discordOAuthEnabled
      properties:
        authenticated:
          const: false
        githubOAuthEnabled:
          type: boolean
        discordOAuthEnabled:
          type: boolean
    ExternalIdentitySummary:
      type: object
      additionalProperties: false
      required:
        - provider
        - providerUsername
      properties:
        provider:
          type: string
          enum:
            - github
            - discord
        providerUsername:
          type: string
    AuthenticationMethods:
      type: object
      additionalProperties: false
      required:
        - password
        - externalIdentities
      properties:
        password:
          type: boolean
        externalIdentities:
          type: array
          items:
            $ref: '#/components/schemas/ExternalIdentitySummary'
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - githubOAuthEnabled
        - discordOAuthEnabled
        - user
        - authenticationMethods
      properties:
        authenticated:
          const: true
        githubOAuthEnabled:
          type: boolean
        discordOAuthEnabled:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        authenticationMethods:
          $ref: '#/components/schemas/AuthenticationMethods'
    PasswordRegistration:
      type: object
      additionalProperties: false
      required:
        - username
        - displayName
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\p{L}\p{N}._-]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 200
    PasswordLogin:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\p{L}\p{N}._-]+$
        password:
          type: string
    PasswordChange:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
    CliAuthorizationStart:
      type: object
      additionalProperties: false
      required:
        - deviceCode
        - userCode
        - verificationUri
        - verificationUriComplete
        - expiresIn
        - interval
      properties:
        deviceCode:
          type: string
          minLength: 40
        userCode:
          type: string
          pattern: ^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$
        verificationUri:
          type: string
          pattern: ^/
        verificationUriComplete:
          type: string
          pattern: ^/
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime in seconds.
        interval:
          type: integer
          minimum: 1
          description: Minimum polling interval in seconds.
    CliAuthorizationApproval:
      type: object
      additionalProperties: false
      required:
        - userCode
      properties:
        userCode:
          type: string
          pattern: ^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$
    CliAuthorizationExchange:
      type: object
      additionalProperties: false
      required:
        - deviceCode
      properties:
        deviceCode:
          type: string
          minLength: 40
    CliAuthorizationPending:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: pending
    DiscordBotLogin:
      type: object
      additionalProperties: false
      required:
        - discordUserId
      properties:
        discordUserId:
          type: string
          description: Stable Discord snowflake User ID from a trusted Bot event.
          pattern: ^[1-9][0-9]{0,19}$
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\p{L}\p{N}._-]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
    UserProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\p{L}\p{N}._-]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
    UserSearchResult:
      type: object
      additionalProperties: false
      required:
        - users
      properties:
        users:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/User'
    SpaceType:
      type: string
      enum:
        - personal
        - team
    SpaceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - publicRead
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/SpaceType'
        name:
          type: string
        publicRead:
          type: boolean
          description: Whether every authenticated User can browse and open this Space read-only.
    SpaceRole:
      type: string
      enum:
        - owner
        - admin
        - editor
        - viewer
    SpaceCapabilities:
      type: object
      additionalProperties: false
      required:
        - browseRoot
        - createAtRoot
        - renameSpace
        - manageMembers
        - viewTrash
      properties:
        browseRoot:
          type: boolean
        createAtRoot:
          type: boolean
        renameSpace:
          type: boolean
        manageMembers:
          type: boolean
        viewTrash:
          type: boolean
    SpaceList:
      type: object
      additionalProperties: false
      required:
        - spaces
      properties:
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/SpaceView'
    CreateTeamSpace:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        publicRead:
          type: boolean
          description: Whether signed-in users can read the Space without membership. Omit to keep it private.
    PatchSpace:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
