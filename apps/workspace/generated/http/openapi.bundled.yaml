          type: integer
          enum:
            - 1
            - 2
            - 3
            - 5
            - 6
          description: Univer protocol Unit type.
        baseRev:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 2
        userID:
          type: string
          description: Ignored on input and replaced with the authenticated User ID.
        memberID:
          type: string
          description: Ignored on input and replaced with a server-owned member ID.
        sid:
          type: string
          minLength: 1
        reqId:
          type: integer
          minimum: 1
        mutations:
          type: array
          items:
