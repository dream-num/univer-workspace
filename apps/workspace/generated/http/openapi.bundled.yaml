        space:
          $ref: '#/components/schemas/SpaceSummary'
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
        navigationRootNodeId:
          type:
            - string
            - 'null'
    PatchNode:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parentNodeId:
          type:
            - string
            - 'null'
    OperationKind:
      type: string
      enum:
        - createResource
        - createBlobResource
        - createWorktree
        - addWorktreeUnit
        - createWorktreeUnit
        - mergeWorktree
        - discardWorktree
        - activateWorktreeResource
    OperationState:
      type: string
      enum:
        - pending
        - completed
        - failed
    OperationError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateResource:
      type: object
      additionalProperties: false
      required:
        - kind
        - spaceId
        - parentNodeId
        - name
        - unitType
      properties:
        kind:
          type: string
          const: univer
        spaceId:
          type: string
        parentNodeId:
          type:
            - string
            - 'null'
        name:
          type: string
          minLength: 1
          maxLength: 255
        unitType:
          $ref: '#/components/schemas/UnitType'
        initialData:
          type: object
          description: Complete initial Univer Unit data for unitType. When omitted, the server creates a blank Unit. The server always overrides id with the Unit identity reserved from the Idempotency-Key and resets rev to the initial revision.
          additionalProperties: true
    ResourceCreateResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - node
      properties:
        operation:
          $ref: '#/components/schemas/OperationView'
        node:
          $ref: '#/components/schemas/NodeSummary'
    OperationEnvelope:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          $ref: '#/components/schemas/OperationView'
    ResourceResponse:
      type: object
      additionalProperties: false
      required:
        - resource
        - node
      properties:
        resource:
          $ref: '#/components/schemas/ResourceSummary'
        node:
          $ref: '#/components/schemas/NodeSummary'
    EditorMode:
      type: string
      enum:
