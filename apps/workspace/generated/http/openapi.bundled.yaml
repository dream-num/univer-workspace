    WorktreeOperationResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - worktree
      properties:
        operation:
          $ref: '#/components/schemas/OperationView'
        worktree:
          $ref: '#/components/schemas/WorktreeSummary'
  parameters:
    Cursor:
      $ref: '#/components/parameters/CursorParameter'
    Limit:
      $ref: '#/components/parameters/LimitParameter'
    IdempotencyKey:
      $ref: '#/components/parameters/IdempotencyKeyParameter'
    CursorParameter:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
    LimitParameter:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    IdempotencyKeyParameter:
      name: Idempotency-Key
      in: header
      required: true
      description: Random opaque key representing one user intent.
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: ^[A-Za-z0-9_-]+$
    BlobResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
      description: A single RFC 9110 bytes range.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Return 304 when the current content ETag matches.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A valid login session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
    Forbidden:
      description: The current User cannot perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not discoverable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: The resource was not found.
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The declared Blob size exceeds the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RangeNotSatisfiable:
      description: The requested byte range cannot be served.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BlobBytes:
      description: Blob bytes with media type, ETag, disposition, and Range headers.
      headers:
        Accept-Ranges:
          schema:
            type: string
        Content-Range:
          schema:
            type: string
        ETag:
          schema:
            type: string
      content:
        '*/*':
          schema:
            type: string
            format: binary
