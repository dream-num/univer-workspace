openapi: 3.1.2
info:
  title: Univer Workspace API
  version: 0.1.0
  summary: Product HTTP interface for the Univer Workspace collaboration example.
  description: |
    This contract exposes product concepts such as users, spaces, Nodes,
    Resources, trash batches, grants, operations, and worktrees. Univer
    Collaboration protocol endpoints are configured separately and are not
    redefined here.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: Session
    description: Browser login session bootstrap and logout.
  - name: Authentication
    description: Password, GitHub, Discord, and CLI browser authorization methods.
  - name: Users
    description: Current User profile and User discovery.
  - name: Spaces
    description: Personal and Team Space discovery and metadata.
  - name: Nodes
    description: Workspace tree browsing and modification.
  - name: Operations
    description: Durable cross-module operation progress and retry.
  - name: Resources
    description: Resource creation, metadata, and editor opening.
  - name: Blobs
    description: Blob upload sessions, publication, preview bytes, and downloads.
  - name: Views
    description: Recent and Shared With Me projections.
  - name: Trash
    description: Recoverable Trash Batch lifecycle.
  - name: Membership
    description: Team Space membership management.
  - name: Sharing
    description: Personal Space Direct Share management.
  - name: Worktrees
    description: Isolated collaborative draft and merge workflows.
paths:
  /api/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Get the current login session.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Current authenticated or anonymous session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
  /api/auth/authorize:
    get:
      tags:
        - Authentication
      operationId: oauthAuthorize
      summary: Start an OAuth-style authorization for a registered client.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{32,256}$
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Workspace login or back to the registered redirect_uri with a one-time code.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/token:
    post:
      tags:
        - Authentication
      operationId: oauthToken
      summary: Exchange a one-time authorization code for a registered client identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - client_id
                - client_secret
                - redirect_uri
                - code_verifier
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          description: The registered client identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid client secret or PKCE verifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
        - Session
      operationId: logout
      summary: Delete the current login session.
      responses:
        '204':
          description: The session is absent or has been deleted.
  /api/auth/password/register:
    post:
      tags:
        - Authentication
      operationId: registerWithPassword
      summary: Create a User, Personal Space, Password Credential, and session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRegistration'
      responses:
        '201':
          description: Registered and authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/password/login:
    post:
      tags:
        - Authentication
      operationId: loginWithPassword
      summary: Authenticate with a System Username and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          description: Username or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/password:
    put:
      tags:
        - Authentication
      operationId: changePassword
      summary: Change the current User's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/cli/authorizations:
    post:
      tags:
        - Authentication
      operationId: startCliAuthorization
      summary: Start a short-lived browser authorization for Workspace CLI.
      security: []
      responses:
        '201':
          description: CLI authorization request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorizationStart'
        '503':
          description: The server is temporarily at capacity for CLI authorization requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/cli/authorizations/approve:
    post:
      tags:
        - Authentication
      operationId: approveCliAuthorization
      summary: Approve a CLI authorization as the current signed-in User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationApproval'
      responses:
        '200':
          description: CLI authorization approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The CLI authorization request expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/cli/authorizations/exchange:
    post:
      tags:
        - Authentication
      operationId: exchangeCliAuthorization
      summary: Poll and exchange an approved CLI authorization for a login session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationExchange'
      responses:
        '200':
          description: Authorization approved and exchanged for a new CLI login session.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '202':
          description: The User has not approved the request yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorizationPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: The CLI authorization request expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/github/login:
    get:
      tags:
        - Authentication
      operationId: startGitHubLogin
      summary: Start the GitHub OAuth login flow.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/
      responses:
        '302':
          description: Redirect to GitHub.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
  /api/auth/github/link:
    get:
      tags:
        - Authentication
      operationId: startGitHubLink
      summary: Start GitHub OAuth to link the current User.
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/
      responses:
        '302':
          description: Redirect to GitHub.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/github/callback:
    get:
      tags:
        - Authentication
      operationId: finishGitHubOAuth
      summary: Validate the OAuth callback and finish login or linking.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to a validated local application path.
          headers:
            Location:
              required: true
              schema:
                type: string
  /api/auth/github:
    delete:
      tags:
        - Authentication
      operationId: unlinkGitHub
      summary: Unlink the current User's GitHub identity.
      responses:
        '200':
          description: Updated authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: GitHub is the last authentication method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/discord/login:
    get:
      tags:
        - Authentication
      operationId: startDiscordLogin
      summary: Start the Discord OAuth login flow.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/
      responses:
        '302':
          description: Redirect to Discord.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
  /api/auth/discord/bot-login:
    post:
      tags:
        - Authentication
      operationId: loginWithDiscordBot
      summary: Resolve or create a User from a trusted Discord Bot event and create a session.
      description: |
        This server-to-server endpoint trusts the Discord User ID asserted by the
        configured Bot server. The caller must authenticate with the shared API key.
      security:
        - discordBotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordBotLogin'
      responses:
        '200':
          description: Authenticated; a new User and Personal Space are created when necessary.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The Discord Bot API key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Discord Bot authentication is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/discord/link:
    get:
      tags:
        - Authentication
      operationId: startDiscordLink
      summary: Start Discord OAuth to link the current User.
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/
      responses:
        '302':
          description: Redirect to Discord.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/discord/callback:
    get:
      tags:
        - Authentication
      operationId: finishDiscordOAuth
      summary: Validate the Discord OAuth callback and finish login or linking.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to a validated local application path.
          headers:
            Location:
              required: true
              schema:
                type: string
  /api/auth/discord:
    delete:
      tags:
        - Authentication
      operationId: unlinkDiscord
      summary: Unlink the current User's Discord identity.
      responses:
        '200':
          description: Updated authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Discord is the last authentication method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/me:
    patch:
      tags:
        - Users
      operationId: updateCurrentUser
      summary: Update the current User's product profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfilePatch'
      responses:
        '200':
          description: Updated User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/search:
    get:
      tags:
        - Users
      operationId: searchUsers
      summary: Find Users for Team Membership or Direct Share.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: At most twenty Public User summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/spaces:
    get:
      tags:
        - Spaces
      operationId: listSpaces
      summary: List Spaces discoverable by the current User.
      responses:
        '200':
          description: Personal Space followed by owned and joined Team Spaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/team-spaces:
    post:
      tags:
        - Spaces
      operationId: createTeamSpace
      summary: Create a Team Space owned by the current User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamSpace'
      responses:
        '201':
          description: Created Team Space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Spaces
      operationId: getSpace
      summary: Get a Space the current User may discover.
      responses:
        '200':
          description: Space and effective capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Spaces
      operationId: updateSpace
      summary: Update Space settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSpace'
      responses:
        '200':
          description: Updated Space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/spaces/{spaceId}/nodes:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Nodes
      operationId: listSpaceRootNodes
      summary: List the root Nodes of a Space.
      parameters:
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Node page for the Space root.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/nodes:
    post:
      tags:
        - Nodes
      operationId: createNode
      summary: Create a pure organizational Node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNode'
      responses:
        '201':
          description: Created Node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/nodes/{nodeId}:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Nodes
      operationId: getNode
      summary: Get Node metadata without loading children or content.
      responses:
        '200':
          description: Node metadata and navigation context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Nodes
      operationId: updateNode
      summary: Atomically rename or move a Node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNode'
      responses:
        '200':
          description: Updated Node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/nodes/{nodeId}/children:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Nodes
      operationId: listNodeChildren
      summary: List the direct children of any Node.
      parameters:
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Direct child Node page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Operations
      operationId: getOperation
      summary: Get the current state of an Operation.
      responses:
        '200':
          description: Operation state.
          headers:
            Retry-After:
              description: Suggested polling delay for a pending Operation.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/operations/{operationId}/retry:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Operations
      operationId: retryOperation
      summary: Retry a failed Operation with its original immutable input.
      responses:
        '202':
          description: Operation returned to pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/resources:
    post:
      tags:
        - Resources
      operationId: createResource
      summary: Create a Univer Resource and its Node.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResource'
      responses:
        '200':
          description: Existing completed result for the Idempotency Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCreateResponse'
        '201':
          description: Resource created during the initial attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCreateResponse'
        '202':
          description: Resource creation remains pending.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/resources/{resourceId}:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Resources
      operationId: getResource
      summary: Get Resource and owning Node metadata.
      responses:
        '200':
          description: Current Resource and Node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/unit-resources/{unitId}:
    parameters:
      - name: unitId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Resources
      operationId: getResourceByUnit
      summary: Resolve Resource and owning Node metadata from a Univer Unit.
      responses:
        '200':
          description: Current Resource and Node accessible to the signed-in User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/resources/{resourceId}/open:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Resources
      operationId: openResource
      summary: Resolve the Unit and editor mode for a Resource.
      responses:
        '200':
          description: Resource open descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOpenView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/blob-upload-sessions:
