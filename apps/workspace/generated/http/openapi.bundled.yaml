      enum:
        - ready
        - quarantined
    BlobResourceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - mediaType
        - byteSize
        - availability
        - capabilities
      properties:
        id:
          type: string
        kind:
          type: string
          const: blob
        mediaType:
          type: string
        byteSize:
          type: integer
          minimum: 0
        availability:
