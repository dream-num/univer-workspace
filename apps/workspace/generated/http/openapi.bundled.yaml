        - readOnly
    OpenUniverResource:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - nodeId
        - spaceId
        - name
        - unitId
        - unitType
        - accessRole
        - editorMode
      properties:
        id:
          type: string
        kind:
          type: string
          const: univer
        nodeId:
          type: string
        spaceId:
          type: string
        name:
          type: string
        unitId:
          type: string
        unitType:
          $ref: '#/components/schemas/UnitType'
        accessRole:
          $ref: '#/components/schemas/AccessRole'
        editorMode:
          $ref: '#/components/schemas/EditorMode'
    OpenBlobResource:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - nodeId
        - spaceId
        - name
        - accessRole
        - originalFilename
        - mediaType
        - byteSize
        - sha256
        - contentUrl
        - downloadUrl
      properties:
        id:
          type: string
        kind:
          type: string
          const: blob
        nodeId:
          type: string
        spaceId:
          type: string
        name:
          type: string
        accessRole:
          $ref: '#/components/schemas/AccessRole'
        originalFilename:
          type: string
        mediaType:
          type: string
        byteSize:
          type: integer
          minimum: 0
        sha256:
          type: string
        contentUrl:
          type: string
        downloadUrl:
          type: string
    CreateBlobUpload:
      type: object
      additionalProperties: false
      required:
        - spaceId
        - parentNodeId
        - name
        - originalFilename
        - byteSize
      properties:
        spaceId:
          type: string
        parentNodeId:
          type:
            - string
            - 'null'
        name:
          type: string
          minLength: 1
          maxLength: 255
        originalFilename:
          type: string
          minLength: 1
          maxLength: 1024
        byteSize:
          type: integer
          minimum: 0
        declaredMediaType:
          type: string
          maxLength: 255
    BlobUploadState:
      type: string
      enum:
        - waitingForUpload
        - uploaded
        - verifying
        - completed
        - failed
        - expired
        - aborted
    BlobUploadSession:
      type: object
      additionalProperties: false
      required:
        - id
        - operationId
        - nodeId
        - resourceId
        - state
        - name
        - originalFilename
        - byteSize
        - receivedSize
        - detectedMediaType
        - sha256
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        operationId:
          type: string
        nodeId:
          type: string
        resourceId:
          type: string
        state:
          $ref: '#/components/schemas/BlobUploadState'
        name:
          type: string
        originalFilename:
          type: string
        byteSize:
          type: integer
          minimum: 0
        receivedSize:
          type:
            - integer
            - 'null'
          minimum: 0
        detectedMediaType:
          type:
            - string
            - 'null'
        sha256:
          type:
            - string
            - 'null'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlobUploadTarget:
      type: object
      additionalProperties: false
      required:
        - method
        - contentUrl
      properties:
        method:
          type: string
          const: PUT
        contentUrl:
          type: string
    Location:
      type: object
      additionalProperties: false
      required:
        - space
        - breadcrumbs
      properties:
