# univer-workspace-harness bundle patch. Applied after the dsh-web-app layer,
# so it may override rows by id and insert its own.
#
# It removes the surfaces ordinary internal users do not expose — the
# permission "Full Access" default selector and advanced settings pages —
# and mounts the harness core. The official DSH WorkspaceBrowser remains the
# sidebar owner; the harness only filters its data and routes authentication-
# aware actions. One row activates BOTH
# faces: the harness node half registers the OAuth login/callback and
# identity/template-fork routes, and its package manifest declares
# `dsh.client`, so the modules scanner loads the `./client` browser half from
# the same row.

# ── network server binding ───────────────────────────────────────────────────

# The CLI rejects an explicit `--host 0.0.0.0` invocation before the profile
# loads. This deployment sets the supported all-interfaces webserver value at
# composition time instead, while the connection row below adds the public
# authority to the browser trust fence.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: !!js process.env.UWH_BIND_HOST ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080

# ── hide Full Access / advanced settings ───────────────────────────────────

# Restate the `connection` row so its trust fence always includes the browser
# origin the harness is served on (the deployment's public host). A patch
# replaces the whole row config, so the `inject` edge that resolves
# `ctx.webRuntime` before the expression runs is restated too. The public host
# comes from the deployment (UWH_PUBLIC_HOST); a missing/blank value is a
# LOAD-TIME config error so DSH never silently trusts arbitrary Host headers.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime]
  config:
    trustedHosts: !!js >-
      (() => {
        const host = process.env.UWH_PUBLIC_HOST
        if (host === undefined || host.trim() === '') {
          throw new Error('UWH_PUBLIC_HOST is required: the harness is served on a fixed public host; without it DSH would reject the browser request as untrusted')
        }
        return [host.trim(), ...ctx.webRuntime.trustedHosts]
          .filter((value, index, values) => values.indexOf(value) === index)
      })()

# Keep the stock WorkspaceBrowser's content-search branch available. The web
# bundle deliberately defaults the SQLite query provider to `never`, which
# leaves the sidebar with title-only search and an "unavailable" warning.
# Harness sessions are already isolated at the list/API seam; the derived
# index is only an implementation cache, so it can live under this profile's
# DSH_HOME and be opened lazily on the first real query.
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

# `ui-permission` is the `settings.general.item` row letting the user pick the
# default permission preset; the `danger-full-access` preset is selectable
# there. Hide it for the harness.
- id: ui-permission
  disabled: true

# Keep the native plugin configuration cards and read-only inventory out of the
# default composition; the harness ships its plugin set as a deployment fact.
- id: ui-settings-plugins
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

# DSH's model/credential settings are profile-global, not account-scoped. The
# default production posture keeps them deployment-managed. Local/single-user
# profiles may opt in with UWH_MODEL_SETTINGS_ENABLED=true (or by running
# without NODE_ENV=production) so the stock Models page can recover a key that
# was configured in the isolated profile. The scoped API independently limits
# the opt-in to the two model namespaces and their credential calls.
- id: ui-settings-models
  disabled: !!js >-
    process.env.NODE_ENV === 'production' &&
    process.env.UWH_MODEL_SETTINGS_ENABLED !== 'true'

# ── harness core plugin row (host half + browser half) ─────────────────────

- insert:
    - id: univer-workspace-harness
      name: '@univerjs/univer-workspace-harness'
      config:
        # The configured emptyDir mount root for per-user directories. The host
        # plugin derives each per-user directory as a direct SHA-256-named child
        # of this root and provisions it before resolving the Workspace record.
        workspaceRoot: !!js process.env.UWH_WORKSPACE_ROOT

        # The Workspace service origin the harness authenticates against and
        # calls. It is a deployment value overridable at runtime through the
        # `univer-workspace-harness` settings namespace.
        workspaceOrigin: !!js process.env.UWH_WORKSPACE_ORIGIN ?? 'https://workspace.univer.plus'

        # The deployment origin the harness is served on; the OAuth callback URL
        # is built from it, never from a client-supplied Host header.
        publicOrigin: !!js process.env.UWH_PUBLIC_ORIGIN

        # Workspace OAuth confidential client credentials, set by the
        # deployment. The client secret and session secret are deployment
        # secrets and never reach the browser bundle.
        oauthClientId: !!js process.env.UWH_OAUTH_CLIENT_ID
        oauthClientSecret: !!js process.env.UWH_OAUTH_CLIENT_SECRET
        sessionSecret: !!js process.env.UWH_OAUTH_SESSION_SECRET
        authorizeScope: !!js process.env.UWH_OAUTH_SCOPE ?? 'identity session'

        # Workspace usernames that receive the admin flag; this only gates the
        # additional product UI and is not a second role database.
        adminUsernames: !!js JSON.parse(process.env.UWH_ADMIN_USERNAMES_JSON ?? '[]')

        # Route paths of the harness host plugin. The callback path must match
        # the redirect URI registered with the Workspace authorization server,
        # so it is a deployment value; the other paths are fixed.
        loginPath: /auth/login
        callbackPath: !!js process.env.UWH_OAUTH_CALLBACK_PATH ?? '/auth/callback'
        mePath: /api/uwh/me
        templateForkPath: /api/uwh/template-fork

        # HttpOnly session cookie (short-lived). An explicit override wins;
        # otherwise Secure follows the configured public origin so local HTTP
        # harnesses do not receive a cookie that the browser cannot return.
        sessionCookieName: dsh_session
        sessionTtlMs: !!js Number(process.env.UWH_OAUTH_SESSION_TTL_MS ?? 900000)
        stateTtlMs: !!js Number(process.env.UWH_OAUTH_STATE_TTL_MS ?? 120000)
        secureCookies: !!js process.env.UWH_OAUTH_SECURE_COOKIES === 'true' || (process.env.UWH_OAUTH_SECURE_COOKIES !== 'false' && new URL(process.env.UWH_PUBLIC_ORIGIN).protocol === 'https:')

        # DSH model settings/credentials are profile-global. Keep them off in
        # production unless the operator explicitly opts in; dev profiles
        # retain the native Models page for local key setup.
        modelSettingsEnabled: !!js >-
          process.env.UWH_MODEL_SETTINGS_ENABLED === 'true' ||
          process.env.NODE_ENV !== 'production'

        # Configured templates: stable key -> source session id; the browser
        # forks the source once and remembers the copy per user per browser.
        templates: !!js JSON.parse(process.env.UWH_TEMPLATES_JSON ?? '[]')
