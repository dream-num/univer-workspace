name: ${VERIFY_UVW_MCP_PROJECT:?}
services:
  gateway:
    image: ${VERIFY_UVW_MCP_IMAGE:?}
    environment:
      MCP_STAGING_DIRECTORY: /staging
      MCP_SYNC_BUDGET_MS: ${MCP_SYNC_BUDGET_MS:-30000}
      MCP_ROLE: gateway
      NODE_ENV: development
      MCP_DEV_SESSION_PASSTHROUGH: "1"
      MCP_OAUTH_CLIENT_ID: univer-workspace-mcp-gateway
      MCP_OAUTH_CLIENT_SECRET: ${VERIFY_UVW_MCP_OAUTH_SECRET:?}
      MCP_EXECUTOR_URLS: ${VERIFY_UVW_EXECUTOR_URLS:-http://executor:3000}
      MCP_INTERNAL_TOKEN: ${VERIFY_UVW_INTERNAL_TOKEN:?}
      HOST: 0.0.0.0
      PORT: "3000"
      WORKSPACE_ORIGIN: ${VERIFY_UVW_ORIGIN:?}
      WORKSPACE_TRANSPORT_URL: http://host.docker.internal:${VERIFY_UVW_SERVER_PORT:?}
      MCP_PUBLIC_URL: http://127.0.0.1:${VERIFY_UVW_MCP_PORT:?}/mcp
      METRICS_TOKEN: ${VERIFY_UVW_METRICS_TOKEN:?}
      LOG_LEVEL: info
    volumes:
      - "${VERIFY_UVW_MCP_STAGING_DIRECTORY:?}:/staging"
    ports:
      - "127.0.0.1:${VERIFY_UVW_MCP_PORT:?}:3000"
    depends_on:
      executor:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 1s
      retries: 30
  executor:
    image: ${VERIFY_UVW_MCP_IMAGE:?}
    environment:
      MCP_ROLE: executor
      NODE_ENV: development
      MCP_EXECUTOR_CREDENTIALS: session
      EXECUTOR_MAX_WORKERS: ${EXECUTOR_MAX_WORKERS:-4}
      EXECUTOR_IDLE_TTL_MS: ${EXECUTOR_IDLE_TTL_MS:-60000}
      MCP_INTERNAL_TOKEN: ${VERIFY_UVW_INTERNAL_TOKEN:?}
      MCP_RENDERER_URL: http://renderer:3000
      HOST: 0.0.0.0
      PORT: "3000"
      WORKSPACE_ORIGIN: ${VERIFY_UVW_ORIGIN:?}
      WORKSPACE_TRANSPORT_URL: http://host.docker.internal:${VERIFY_UVW_SERVER_PORT:?}
      LOG_LEVEL: info
    networks: [default, render]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 1s
      retries: 30
  renderer:
    image: ${VERIFY_UVW_MCP_IMAGE:?}
    environment:
      MCP_ROLE: renderer
      NODE_ENV: development
      MCP_INTERNAL_TOKEN: ${VERIFY_UVW_INTERNAL_TOKEN:?}
      METRICS_TOKEN: ${VERIFY_UVW_METRICS_TOKEN:?}
      RENDERER_MAX_RUNTIMES: ${RENDERER_MAX_RUNTIMES:-2}
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
    networks: [render]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 1s
      retries: 30
  executor-b:
    extends:
      service: executor
    profiles: [replicas]
networks:
  render:
    internal: true
