<!doctype html>
<!-- Scenario: Delivery desk.
Expected Sheet: Row 1 headers A Record ID, B Task, C Owner, D Status (Queued, Active, Done), E Due date (ISO text or Sheet date serial). Rows 2:101 records. At least 101 rows and 5 columns. New records insert below the header, moving older rows down.
Replace EVERY REPLACE_UNIT_ID with the actual Unit ID and EVERY REPLACE_SHEET_ID with the worksheet ID.
Use URI-encoded IDs in HTML binding attributes and raw IDs in JavaScript. No other placeholders.
Fixed ranges show at most 100 records; inspect worksheet bounds before adapting. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery desk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);caret-color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}:root{scrollbar-color:var(--accent) var(--bg);scrollbar-width:thin}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--accent);border:2px solid var(--bg);border-radius:8px}
main{max-width:1280px;margin:auto;padding:48px 40px}h1,h2,p{margin:0}h1{font:var(--title);letter-spacing:-.035em;line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}h2{font-size:22px;line-height:1.25;margin-bottom:16px}p{max-width:68ch}header{margin-bottom:40px}header p{margin-top:20px;color:var(--muted)}section,aside{min-width:0}label{display:block;font-weight:600}input,select,button{font:inherit;max-width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;background:var(--surface);color:var(--ink)}input,select{width:100%;accent-color:var(--accent)}button{background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:700}button:hover{filter:brightness(1.12)}input:hover,select:hover{border-color:var(--accent)}button:disabled,input:disabled,select:disabled{opacity:.6;cursor:wait}input::placeholder{color:var(--muted);opacity:1}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.state{font-size:14px;color:var(--muted);min-height:24px;margin:8px 0;overflow-wrap:anywhere}.state[data-error=true]{color:var(--error)}.muted{color:var(--muted)}.figure,output,td{font-variant-numeric:tabular-nums}.panel{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.split{display:grid;grid-template-columns:1fr 2fr;gap:32px}footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}.chart{height:340px;width:100%}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:14px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted);font-size:14px}form label+label{margin-top:16px}form button{margin-top:16px}.scroll{overflow:auto}small{font-size:14px}.empty{padding:32px 0;color:var(--muted)}
@media(max-width:700px){main{padding:28px 20px}.split{grid-template-columns:1fr;gap:24px}header{margin-bottom:28px}.panel{padding:20px}.chart{height:280px}td,th{padding:12px 6px}}
:root{--bg:#edf1f8;--surface:#fff;--ink:#1d2b4a;--muted:#53617d;--accent:#304ebb;--on-accent:#fff;--line:#7c89a4;--error:#ad2439;--radius:5px;--body:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;--title:700 clamp(32px,4vw,48px) var(--body)}.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}.task{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.task strong{display:block;overflow-wrap:anywhere}.task small{display:block;color:var(--muted);margin-top:6px}.task .state{grid-column:1/-1;margin:0}.task .state:empty{display:none}.summary{border-radius:40px;background:var(--ink);color:var(--surface);padding:8px 16px;display:inline-block;margin-top:20px}.new{border-top:4px solid var(--accent);align-self:start}@media(max-width:800px){.desk{grid-template-columns:1fr}.new{order:-1}.task{grid-template-columns:minmax(0,1fr) 120px}}</style></head><body><main><header><h1>Delivery desk</h1><p>A clear next step for every piece of work.</p><output id="summary" class="summary" data-univer-range-subscribe="REPLACE_UNIT_ID:REPLACE_SHEET_ID:A2:E101">Loading workload…</output></header><div class="desk"><section><h2>Work queue</h2><div id="tasks" data-univer-range-subscribe="REPLACE_UNIT_ID:REPLACE_SHEET_ID:A2:E101">Loading records…</div></section><aside class="panel new"><h2>Add to the queue</h2><form id="add"><label>Task<input id="task" required maxlength="160" placeholder="What needs doing?"></label><label>Owner<input id="owner" required maxlength="80" placeholder="Name or team"></label><label>Due date<input id="due" type="date" required></label><button id="submit" type="submit">Add record</button><p id="add-state" class="state" role="status"></p></form></aside></div><p id="load-state" class="state" role="status"></p><footer>Newest records first · Shows the first 100 records · Shared edits save to the source Sheet.</footer></main>
<script type="module">
const binding=window.univerBinding, unitId='REPLACE_UNIT_ID', sheetId='REPLACE_SHEET_ID';
const $=id=>document.getElementById(id), subscriptions=[];
const message=(id,text,error=false)=>{const el=$(id);el.textContent=text;el.dataset.error=String(error)};
const errorText=error=>(error instanceof Error?error.message:String(error)).replace(/[.。!！]+$/u,'');
const ref=(row,col)=>({unitId,sheetId,row,col});
const range=(endRow,endColumn)=>({unitId,sheetId,range:{startRow:1,endRow,startColumn:0,endColumn}});
async function watch(id,kind,listener){try{subscriptions.push(await binding[kind](id,listener))}catch(error){message('load-state',`Could not load live data: ${errorText(error)}`,true)}}
for(const control of document.querySelectorAll('[data-univer-cell-model]')){
  control.addEventListener('change',async()=>{const id=control.getAttribute('aria-describedby');message(id,'Saving…');try{await binding.flush();message(id,'Saved to source Sheet')}catch(error){message(id,`${errorText(error)}. Your draft is kept; press Escape to restore the source value.`,true)}});
  if(control.type==='range')control.addEventListener('input',()=>message(control.getAttribute('aria-describedby'),'Unsaved change…'));
}
window.addEventListener('pagehide',()=>subscriptions.forEach(subscription=>subscription.dispose()),{once:true});
function formatDue(value){
  if(typeof value!=='number')return String(value??'not set');
  // Sheet dates can arrive as serial days from 1899-12-30.
  const date=new Date(Date.UTC(1899,11,30)+value*86400000);
  return Number.isNaN(date.getTime())?String(value):date.toISOString().slice(0,10);
}
await watch('summary','subscribeRangeById',({value})=>{const rows=value.filter(([id])=>id!=null&&id!=='');$('summary').textContent=`${rows.filter(row=>row[3]==='Done').length} done / ${rows.length} records`});
const drafts=new Map();
await watch('tasks','subscribeRangeById',({value})=>{const list=$('tasks');list.replaceChildren();const rows=value.filter(([id])=>id!=null&&id!=='');if(!rows.length){list.textContent='The queue is clear. Add the first task.';return}for(const [id,title,owner,status,due] of rows){const item=document.createElement('article');item.className='task';const info=document.createElement('div'),name=document.createElement('strong'),meta=document.createElement('small');name.textContent=String(title??'Untitled task');meta.textContent=`${owner??'Unassigned'} · Due ${formatDue(due)}`;info.append(name,meta);const select=document.createElement('select');select.setAttribute('aria-label',`Status for ${title}`);for(const label of ['Queued','Active','Done'])select.add(new Option(label,label));select.value=drafts.get(id)?.value??String(status??'Queued');const result=document.createElement('p');result.className='state';result.setAttribute('role','status');result.textContent=drafts.get(id)?.message??'';result.dataset.error=String(drafts.get(id)?.error??false);select.disabled=drafts.get(id)?.busy??false;
select.addEventListener('change',async()=>{const draft={value:select.value,message:'Saving…',busy:true,error:false};drafts.set(id,draft);select.disabled=true;result.textContent=draft.message;try{const latest=await binding.getRangeState(range(100,4));const row=latest.value.findIndex(record=>record[0]===id);if(row<0)throw new Error('Record moved outside this view. Reload and find it in the source Sheet.');await binding.setCellValue(ref(row+1,3),draft.value);await binding.flush();draft.message='Saved to source Sheet';drafts.delete(id)}catch(error){draft.message=`${errorText(error)}. Draft kept; select a status to retry.`;draft.error=true}finally{draft.busy=false;result.textContent=draft.message;result.dataset.error=String(draft.error);select.disabled=false;const current=[...list.querySelectorAll('article')].find(el=>el.dataset.record===String(id));if(current){current.querySelector('select').disabled=false;current.querySelector('.state').textContent=draft.message;current.querySelector('.state').dataset.error=String(draft.error)}}});item.dataset.record=String(id);item.append(info,select,result);list.append(item)}});
let pendingRecordId=null;
$('add').addEventListener('submit',async event=>{event.preventDefault();if($('submit').disabled)return;const fields=['task','owner','due'].map($);if(!pendingRecordId&&fields.some(field=>!field.value.trim())){message('add-state','Complete all fields before adding a record.',true);return}$('submit').disabled=true;fields.forEach(field=>field.readOnly=true);message('add-state','Saving…');try{if(!pendingRecordId){const id=crypto.randomUUID();await binding.insertRowsWithValues({unitId,sheetId,startRow:1,rowCount:1,startColumn:0,values:[[id,$('task').value.trim(),$('owner').value.trim(),'Queued',$('due').value]]});pendingRecordId=id}await binding.flush();pendingRecordId=null;$('add').reset();message('add-state','Record saved. The queue has updated.')}catch(error){message('add-state',pendingRecordId?`Inserted; saving is unconfirmed: ${errorText(error)}. Retry save.`:`Submission unconfirmed: ${errorText(error)}. Check the source before resubmitting.`,true)}finally{$('submit').disabled=false;$('submit').textContent=pendingRecordId?'Retry save':'Add record';fields.forEach(field=>field.readOnly=pendingRecordId!==null)}});
</script></body></html>
