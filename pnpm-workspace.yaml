packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  protobufjs: true

# The SDK baseline is pinned to exact releases and updated on release day via
# `pnpm update:sdk`; only these scopes are exempt from minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@univer-cli/*"
  - "@univerjs/*"
  - "@univerjs-pro/*"

patchedDependencies:
  '@univer-cli/univer-collaboration-runtime-pool@1.0.0-beta.2': patches/@univer-cli__univer-collaboration-runtime-pool@1.0.0-beta.2.patch
