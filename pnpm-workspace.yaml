packages:
  - apps/*
  - apps/agent/desktop
  - packages/*

# Like DSH's signer patch, skip Framework symlinks; also bound file probing
# for the external runtime. Remove once osx-sign fixes both in a release.
# Unused patches stay a warning because `pnpm deploy --legacy` of
# packages/dsh-runtime builds a dedicated lockfile that legitimately does not
# use this patch.
allowUnusedPatches: true
patchedDependencies:
  "@electron/osx-sign@1.3.3": patches/@electron__osx-sign@1.3.3.patch

allowBuilds:
  # electron-builder includes Squirrel tooling; desktop uses NSIS instead.
  electron-winstaller: false
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true
  # Native/scripted builds required by the dsh-runtime cohort (packages/dsh-runtime).
  "node-pty": true
  koffi: true
  "@deepseek-ai/dsh-subprocess-local": true
  "node-addon-require-builtin": false
  "@google/genai": false

# Published 1.0.2 declarations still emit direct Redi type imports without declaring the
# dependency. Keep service identifiers in their host's React peer graph instead
# of resolving the workspace's hoisted copy. Prefer upstream declaration output
# that references DI types through @univerjs/core. Remove each extension once
# published declarations no longer leak an undeclared direct Redi import, and
# clean installs/typechecks pass in both host React peer graphs. Redi 1.1.3
# matches the exact dependency published by @univerjs/core@1.0.2.
packageExtensions:
  "@univerjs/network@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/engine-render@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/sheets-ui@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/thread-comment@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/boards-ui@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/slides-ui@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/collaboration@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/bases@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/boards@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs-pro/slides@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/docs-ui@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/drawing@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/engine-formula@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/engine-formula@1.0.2-insiders.20260925-bfcfbdc":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/sheets@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/sheets-formula@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  "@univerjs/sheets-numfmt@1.0.2":
    dependencies:
      "@wendellhu/redi": "1.1.3"
  # Router declarations import React types but omit the type peer. Bind them to
  # the consuming application's React major; remove once upstream declares it.
  "@tanstack/react-router@1.170.31":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true

# TEMPORARY (remove once the fix ships in a stable SDK release):
# univer-pro#5747 "fix(formula): rebuild cached other-formula precedents after
# source recovery" is only published on the insiders channel. Backport it by
# pinning the two changed formula packages to that insider build; the rest of the
# SDK stays on the stable 1.0.2 baseline.
#
# The insider build declares its sibling SDK dependencies as
# 1.0.2-insiders.20260925-bfcfbdc, so the scoped pins below hold those unchanged
# dependencies at 1.0.2. Without them a second @univerjs/core enters the graph,
# which would split Univer's singleton DI container. Only the formula packages
# are part of the fix: their public .d.ts is unchanged except one added `private`
# member. Remove these pins when the fix is published on a stable release.
overrides:

  # The dsh runtime cohort moves as one release family. Pin every package in
  # the packages/dsh-runtime closure to that family version so the workspace
  # graph and the deploy closure resolve a single instance set: split
  # instances of the same version split branded types (SessionId, Context)
  # across package boundaries and break consumer typechecks.
  # Upgrade = regenerate this list from the new family version, update the
  # packages/dsh-runtime manifest, the apps/agent peer declarations, and
  # DSH_WEB_BUNDLE, then commit with the lockfile.
