packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true

# This SDK release emits direct Redi type imports without declaring the
# dependency. Keep service identifiers in their host's React peer graph instead
# of resolving the workspace's hoisted copy. Remove these extensions when the
# upstream package manifests declare Redi themselves.
packageExtensions:
  "@univerjs/engine-render@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-ui@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/thread-comment@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/boards-ui@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/slides-ui@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/collaboration@1.0.0-insiders.20260902-a58c423":
    dependencies:
      "@wendellhu/redi": "1.1.2"

# The Univer SDK and DSH release trains are pinned to exact releases and may be
# updated on release day; only these selected scopes are exempt from
# minimumReleaseAge.
  "@univerjs-pro/bases@1.0.0-insiders.20260902-a58c423":
    dependencies:
