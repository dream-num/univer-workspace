packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  protobufjs: true

# The SDK baseline is pinned to exact releases and updated on release day via
# `pnpm update:sdk`; only these scopes are exempt from minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@univer-cli/*"
  - "@univerjs/*"
  - "@univerjs-pro/*"

# Temporary Worktree development release; keep the unrelated SDK baseline unchanged.
overrides:
  "@univerjs-pro/collaboration-endpoint": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-service": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-transport-node": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-worktree-client": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-worktree-database-memory": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-worktree-database-sqlite": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-worktree-endpoint": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-worktree-service": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-history-endpoint": "1.0.0-dev.worktree-removal.20260907"
  "@univerjs-pro/collaboration-comment-endpoint": "1.0.0-dev.worktree-removal.20260907"
