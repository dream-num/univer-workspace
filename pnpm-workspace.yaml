packages:
  - apps/*
  - packages/*

# `@deepseek-ai/dsh-subprocess-local`, koffi, and node-pty are reviewed
# builds: the harness runtime executes the dsh CLI from this workspace
# install. `@google/genai` ships an unrelated lifecycle script and stays
# unexecuted.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

# The SDK baseline is pinned to exact releases and updated on release day via
# `pnpm update:sdk`; only these scopes are exempt from minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@univer-cli/*"
  - "@univerjs/*"
  - "@univerjs-pro/*"

# The workspace composes the Univer SDKs (peer react >=16.8) alongside the dsh
# client types (react 18). Pin react to one version so @wendellhu/redi and the
# @univerjs/* packages resolve to a single instance instead of splitting into
# react 18/19 duplicates whose @wendellhu/redi IdentifierDecorator types no
# longer line up.
overrides:
  react: 19.2.8
  react-dom: 19.2.8
