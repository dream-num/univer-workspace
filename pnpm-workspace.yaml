packages:
  - apps/*
  - apps/agent/desktop
  - packages/*
  # The dsh runtime cohort is a standalone nested workspace with its own
  # committed lockfile: sharing the root graph re-resolves consumers' optional
  # peers and splits branded types across the workspace.
  - "!packages/dsh-runtime"
  # TASK-004 uses the current official DSH in an isolated npm dependency graph.
  - "!apps/space-plugin"

# Like DSH's signer patch, skip Framework symlinks; also bound file probing
# for the external runtime. Remove once osx-sign fixes both in a release.
patchedDependencies:
  "@electron/osx-sign@1.3.3": patches/@electron__osx-sign@1.3.3.patch

allowBuilds:
  # electron-builder includes Squirrel tooling; desktop uses NSIS instead.
  electron-winstaller: false
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true

# Router declarations import React types but omit the type peer. Bind them to
# the consuming application's React major; remove once upstream declares it.
packageExtensions:
  "@tanstack/react-router@1.170.31":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # DSH client UI declarations import React types but omit the type peer, so
  # they would resolve pnpm's hoisted @types/react, whose major depends on
  # install order (the SDK graph hoists React 19 types). Bind them to the
  # consuming application's React 18 types; remove once upstream declares it.
  "@deepseek-ai/dsh-client-ui-chat@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-conversation@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-input-trigger@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-layout@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-primitives@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-renderer@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-session@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-settings@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-sidebar@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-sidebar-right@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-slots@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@deepseek-ai/dsh-client-ui-workspace@0.1.5-rc.1":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true

# The Univer SDK and DSH release trains are pinned to exact releases and may be
# updated on release day; only these selected scopes are exempt from
# minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@deepseek-ai/cordis@4.0.2"
  - "@deepseek-ai/dsh*"
  - "@deepseek-ai/schemastery@3.18.2"
  - "@univer-cli/*"
  - "@univerjs/*"
  - "@univerjs-pro/*"
  - "@univerjs-labs/binding-engine@1.0.0-dev.6518eb0"
  - "@univerjs-labs/html-view@1.0.0-dev.6518eb0"
  - "@univerjs-labs/html-view-renderer@1.0.0-dev.6518eb0"
  - "@oxfmt/binding-android-arm-eabi@0.66.0"
  - "@oxfmt/binding-android-arm64@0.66.0"
  - "@oxfmt/binding-darwin-arm64@0.66.0"
