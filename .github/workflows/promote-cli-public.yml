name: Promote insider package to public npm (manual)
run-name: Promote ${{ inputs.package }}@${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || ' (publish)' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package already built on insider-npm
        required: true
        type: choice
        options:
          - univer-workspace-cli
      latest:
        description: Set public latest (false publishes new versions with the promoted tag)
        required: true
        type: boolean
        default: true
      version:
        description: Exact version already built on insider-npm
        required: true
        type: string
      dry_run:
        description: Validate only without publishing to public npm
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-public-promotion-manual
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with OIDC dist-tag support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts --userconfig=/dev/null
      - id: resolve
        name: Read expected digests from exact Insider metadata
        uses: dream-num/release-actions/assemble-npm-batch@eba8228ff0f12cca1735983db9beb9927e437087
        with:
          selection: >-
            ${{ format('{{"packages":[{{"name":{0},"version":{1},"tag":{2}}}]}}',
                        toJSON(inputs.package), toJSON(inputs.version),
                        toJSON(inputs.latest && 'latest' || 'promoted')) }}
      - name: Prepare and promote original Insider tarballs
        uses: dream-num/release-actions/promote-npm@eba8228ff0f12cca1735983db9beb9927e437087
        env:
          INSIDER_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          batch: ${{ steps.resolve.outputs.batch }}
          mode: ${{ inputs.dry_run && 'validate' || 'submit' }}
      - name: Upload batch evidence (no tarballs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-public-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .promotion/batch/batch-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
