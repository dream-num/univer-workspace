name: Promote insider package to public npm (manual)
run-name: Promote exact Insider batch ${{ inputs.dry_run && '(dry run)' || '(submit)' }}

on:
  workflow_dispatch:
    inputs:
      selection:
        description: JSON with batchId and exact npm name, version and tag per entry
        required: true
        type: string
      dry_run:
        description: Validate only without publishing to public npm
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-public-promotion-manual
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm with OIDC dist-tag support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts --userconfig=/dev/null
      - name: Enforce this caller's package scope
        env:
          PROMOTION_SELECTION: ${{ inputs.selection }}
        run: |
          node --input-type=module -e '
            const m = JSON.parse(process.env.PROMOTION_SELECTION);
            if (!Array.isArray(m?.packages) || !m.packages.length ||
                m.packages.some(p => p?.name !== "univer-workspace-cli")) throw Error("Package outside this Trusted Publisher caller scope");
          '
      - id: plan
        uses: dream-num/release-actions/assemble-npm-batch@23de8d9464c26cedfc93a12965ae67e8de607934
        with:
          selection: ${{ inputs.selection }}
      - name: Validate or submit original bytes with the shared batch action
        uses: dream-num/release-actions/promote-npm@23de8d9464c26cedfc93a12965ae67e8de607934
        env:
          INSIDER_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          batch: ${{ steps.plan.outputs.batch }}
          mode: ${{ inputs.dry_run && 'validate' || 'submit' }}
      - name: Upload batch evidence (no tarballs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-public-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .promotion/batch/batch-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
