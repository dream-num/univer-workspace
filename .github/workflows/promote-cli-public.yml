name: Promote insider package to public npm (manual)
run-name: Promote exact Insider batch ${{ inputs.dry_run && '(dry run)' || '(submit)' }}

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Validation only. JSON with batchId and exact package entries.
        required: false
        type: string
      reviewed_batch:
        description: Submission only. Copy batch.json from a successful reviewed validation run.
        required: false
        type: string
      dry_run:
        description: Validate only without publishing to public npm
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-public-promotion-manual
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm with OIDC dist-tag support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts --userconfig=/dev/null
      - id: input
        name: Require selection for validation or the reviewed batch for submission
        env:
          PROMOTION_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTION_SELECTION: ${{ inputs.selection }}
          PROMOTION_REVIEWED_BATCH: ${{ inputs.reviewed_batch }}
        run: node scripts/release/promotion-input.mjs
      - id: plan
        if: inputs.dry_run
        uses: dream-num/release-actions/assemble-npm-batch@23de8d9464c26cedfc93a12965ae67e8de607934
        with:
          selection: ${{ steps.input.outputs.input }}
      - name: Save the exact reviewed-batch candidate
        if: inputs.dry_run
        env:
          BATCH: ${{ steps.plan.outputs.batch }}
        run: |
          mkdir -p .promotion/batch
          printf '%s\n' "$BATCH" > .promotion/batch/batch.json
      - name: Validate or submit original bytes with the shared batch action
        uses: dream-num/release-actions/promote-npm@23de8d9464c26cedfc93a12965ae67e8de607934
        env:
          INSIDER_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          batch: ${{ inputs.dry_run && steps.plan.outputs.batch || steps.input.outputs.input }}
          mode: ${{ inputs.dry_run && 'validate' || 'submit' }}
      - name: Upload batch evidence (no tarballs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-public-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .promotion/batch/batch-result.json
            .promotion/batch/batch.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
