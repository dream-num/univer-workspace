name: Promote insider package to public npm (manual)
run-name: Promote exact Insider batch ${{ inputs.dry_run && '(dry run)' || '(submit)' }}

on:
  workflow_dispatch:
    inputs:
      selection:
        description: JSON package names and exact versions (optional tag defaults to latest)
        required: true
        type: string
      dry_run:
        description: Validate only without publishing to public npm
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-public-promotion-manual
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with OIDC dist-tag support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts --userconfig=/dev/null
      - name: Prepare and promote original Insider tarballs
        uses: dream-num/release-actions/promote-npm@52965d107859bcd009750ca06754b6ddf7078541
        env:
          INSIDER_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          selection: ${{ inputs.selection }}
          allowed_packages: univer-workspace-cli
          mode: ${{ inputs.dry_run && 'validate' || 'submit' }}
      - name: Upload batch evidence (no tarballs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-public-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .promotion/batch/batch-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
