name: CI

# Only docs and examples that no build, test, or package step reads. Required status
# checks stay pending on skipped runs, so a ruleset requiring `verify` needs a
# job-level skip instead.
on:
  pull_request:
    paths-ignore: &docs-only
      - "**/AGENTS.md"
      - README.md
      - README.zh-CN.md
      - DREAMNUM.md
      - docs/**
      - apps/workspace/.env.example
      - apps/workspace/*.md
      - apps/workspace/docs/**
      - apps/agent/desktop/docs/**
      - tasks/**
  push:
    branches:
      - main
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        stage: [static, test-workspace, test-cli, test-mcp, test-rest, package]
    name: verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify ${{ matrix.stage }}
        run: node scripts/verify.mjs --stage ${{ matrix.stage }} --install
        env:
          UVW_VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.stage }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
