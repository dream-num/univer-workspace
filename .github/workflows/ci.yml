name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - name: static
            run: pnpm --filter @univerjs/univer-workspace api:verify && pnpm typecheck
          - name: test-workspace
            run: pnpm --filter @univerjs/univer-workspace test
          - name: test-cli
            run: pnpm --filter univer-workspace-cli test
          - name: test-rest
            run: pnpm test:sdk-dependencies && pnpm test:univer-license && pnpm test:release && pnpm -r --no-sort --filter '!@univerjs/univer-workspace' --filter '!univer-workspace-cli' test
          - name: package
            run: pnpm build && pnpm package:workspace-cli && pnpm --filter univer-workspace-cli package:smoke && pnpm --filter @univerjs/univer-workspace test:production-import
    name: ${{ matrix.stage.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.stage.run }}
