name: CI

# Only docs and examples that no build, test, or package step reads. Required status
# checks stay pending on skipped runs, so a ruleset requiring `verify` needs a
# job-level skip instead.
on:
  pull_request:
    paths-ignore: &docs-only
      - "**/AGENTS.md"
      - README.md
      - README.zh-CN.md
      - DREAMNUM.md
      - docs/**
      - apps/workspace/.env.example
      - apps/workspace/*.md
      - apps/workspace/docs/**
      - apps/agent/desktop/docs/**
      - tasks/**
  push:
    branches:
      - main
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: static
            run: pnpm --filter @univerjs/univer-workspace api:verify && pnpm typecheck
          - stage: test-workspace
            run: pnpm --filter @univerjs/univer-workspace test
          - stage: test-cli
            run: pnpm --filter univer-workspace-cli test
          - stage: test-mcp
            run: pnpm --filter @univerjs/univer-workspace-mcp test --maxWorkers=2
          - stage: test-rest
            run: >-
              pnpm test:sdk-dependencies && pnpm test:univer-license && pnpm test:release && pnpm test:docker-inputs &&
              VITEST_MAX_WORKERS=2 pnpm -r --no-sort --workspace-concurrency=2
              --filter '!@univerjs/univer-workspace' --filter '!univer-workspace-cli'
              --filter '!@univerjs/univer-workspace-mcp' test
          - stage: package
            run: >-
              pnpm build && pnpm package:workspace-cli &&
              pnpm --filter univer-workspace-cli package:smoke &&
              pnpm --filter @univerjs/univer-workspace test:production-import
    name: verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
