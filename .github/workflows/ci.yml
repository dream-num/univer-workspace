name: CI

# Only Markdown that no build, test, or package step reads. Required status
# checks stay pending on skipped runs, so a ruleset requiring `verify` needs a
# job-level skip instead.
on:
  pull_request:
    paths-ignore: &docs-only
      - "**/AGENTS.md"
      - README.md
      - README.zh-CN.md
      - DREAMNUM.md
      - docs/**
      - apps/workspace/*.md
      - apps/workspace/docs/**
      - apps/agent/desktop/docs/**
      - tasks/**
  push:
    branches:
      - main
    paths-ignore: *docs-only

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @univerjs/univer-workspace api:verify
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:workspace-cli
      - run: pnpm --filter univer-workspace-cli package:smoke
      - run: pnpm --filter @univerjs/univer-workspace test:production-import
