name: CI

# Only docs and examples that no build, test, or package step reads. Required status
# checks stay pending on skipped runs, so a ruleset requiring `verify` needs a
# job-level skip instead.
on:
  pull_request:
    paths-ignore: &docs-only
      - "**/AGENTS.md"
      - README.md
      - README.zh-CN.md
      - DREAMNUM.md
      - docs/**
      - apps/workspace/.env.example
      - apps/workspace/*.md
      - apps/workspace/docs/**
      - apps/agent/desktop/docs/**
      - tasks/**
  push:
    branches:
      - main
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        stage: [static, test-workspace, test-cli, test-mcp, test-rest, package]
    name: verify (${{ matrix.stage }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify ${{ matrix.stage }}
        run: node scripts/verify.mjs --stage ${{ matrix.stage }} --install
        env:
          UVW_VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.stage }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  postgres:
    name: PostgreSQL product database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workspace_test
          POSTGRES_PASSWORD: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKSPACE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: workspace_test
      AWS_SECRET_ACCESS_KEY: workspace_test_secret
      WORKSPACE_TEST_POSTGRES_URL: postgresql://postgres:workspace_test@localhost:5432/workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable S3 storage
        run: |
          docker run -d --rm -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            univerai/minio:2024.8.3-debian-12-r1@sha256:acdd6085371272c8c22200d779bf3a0eedb86d76211245d16cae30d82c605041
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 "$WORKSPACE_TEST_S3_ENDPOINT/minio/health/ready"
      - run: pnpm --filter @univerjs/univer-workspace test:postgres
