name: Test CLI promotion scripts

on:
  pull_request:
    paths:
      - .github/workflows/promote-cli-public.yml
      - .github/workflows/test-cli-promotion.yml
      - scripts/release/**
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-cli-public.yml
      - .github/workflows/test-cli-promotion.yml
      - scripts/release/**

permissions:
  contents: read

concurrency:
  group: test-cli-promotion-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the publisher npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts --userconfig=/dev/null
      - name: Test release policy and isolated npm upload
        run: node --test scripts/release/*.test.mjs
  cross-repo-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - id: fixture
        env:
          FIXTURE_DIRECTORY: ${{ runner.temp }}/cross-repo-batch
        run: node scripts/release/test-fixtures/make-batch.mjs
      - id: plan
        uses: dream-num/release-actions/assemble-npm-batch@fad904b384f3af0ed39970458649c095af5ea400
        env:
          FIXTURE_DIRECTORY: ${{ runner.temp }}/cross-repo-batch
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/release/test-fixtures/batch-fetch.mjs
        with:
          selection: ${{ steps.fixture.outputs.selection }}
      - id: validate
        uses: dream-num/release-actions/promote-npm@fad904b384f3af0ed39970458649c095af5ea400
        env:
          FIXTURE_DIRECTORY: ${{ runner.temp }}/cross-repo-batch
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/release/test-fixtures/batch-fetch.mjs
          INSIDER_TOKEN: synthetic-not-a-credential
        with:
          batch: ${{ steps.plan.outputs.batch }}
          mode: validate
      - name: Check CLI and Collab both validated
        run: |
          node -e 'const r=require("./.promotion/batch/batch-result.json"); if (r.phase!=="validated" || r.packages.map(p=>p.name).join(",")!=="@synthetic/cli-sdk,@synthetic/collab-sdk" || r.packages.some(p=>p.status!=="validated")) process.exit(1)'
      - id: mismatch
        continue-on-error: true
        uses: dream-num/release-actions/promote-npm@fad904b384f3af0ed39970458649c095af5ea400
        env:
          FIXTURE_DIRECTORY: ${{ runner.temp }}/cross-repo-batch
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/release/test-fixtures/batch-fetch.mjs
          INSIDER_TOKEN: synthetic-not-a-credential
          FIXTURE_MUTATE_TARBALL: 'true'
        with:
          batch: ${{ steps.plan.outputs.batch }}
          mode: validate
      - name: Ensure repointed Insider bytes failed and cannot be submitted
        env:
          OUTCOME: ${{ steps.mismatch.outcome }}
        run: |
          test "$OUTCOME" = failure
          node -e 'const r=require("./.promotion/batch/batch-result.json"); if (r.phase!=="validation_failed" || r.packages.some(p=>["submitted","reused"].includes(p.status))) process.exit(1)'
