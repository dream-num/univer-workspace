name: Probe packaged macOS login registration
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: agent-desktop-mac-arm64
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: probe-artifacts
      - name: Inspect bundle registration on native macOS
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$RUNNER_TEMP/uwa-protocol-probe"
          mkdir -p "$probe_root"
          archives=(probe-artifacts/*.zip)
          ditto -x -k "${archives[0]}" "$probe_root"
          node apps/agent/desktop/scripts/probe-mac-protocol.mjs "$probe_root/Univer Workspace Agent.app"
