name: Build and release CLI (manual)
run-name: Release CLI to insider-npm ${{ inputs.version }}${{ !inputs.publish && ' (build only)' || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (latest requires selecting the matching vX.Y.Z tag as workflow ref)
        type: choice
        options: [insiders, latest]
        default: insiders
        required: true
      version:
        description: Exact version (X.Y.Z for latest; X.Y.Z-insider.<suffix> for insiders)
        required: true
        type: string
      publish:
        description: Publish the verified tarball to insider-npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: univer-workspace-cli-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release request
        id: release
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_DRY_RUN: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          VERSION="$DISPATCH_VERSION"
          CHANNEL="$DISPATCH_CHANNEL"
          DRY_RUN="$DISPATCH_DRY_RUN"
          if [[ "$CHANNEL" == "latest" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "Select the matching v$VERSION tag as the workflow ref for latest." >&2
              exit 1
            fi
          elif [[ "$CHANNEL" != "insiders" || "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$BASE_BRANCH" ]]; then
            echo "insiders releases must be dispatched from $BASE_BRANCH." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "dry_run=$DRY_RUN"
            echo "artifact_name=univer-workspace-cli-$VERSION"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "publish=false"
            else
              echo "publish=true"
            fi
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release CLI to insider-npm $VERSION"
            echo
            echo "- trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- channel: \`$CHANNEL\`"
            echo "- npm dist-tag: \`$CHANNEL\`"
            echo "- dry_run: \`$DRY_RUN\`"
            echo "- source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and gate exact tarball
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
        run: |
          set -euo pipefail
          MODE="--prepare-only"
          if [[ "$DRY_RUN" == "true" ]]; then
            MODE="--dry-run"
          fi
          pnpm release:cli -- \
            --channel="$RELEASE_CHANNEL" \
            --version="$RELEASE_VERSION" \
            "$MODE"

      - name: Upload reviewed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .release/release-manifest.json
            .release/*.tgz

  publish:
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download reviewed release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .release

      - name: Publish reviewed tarball
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/univer-workspace-cli.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm config set "//insider-npm-registry.univer.work/:_authToken" "$NODE_AUTH_TOKEN"
          node scripts/release/publish-cli.mjs \
            --manifest=.release/release-manifest.json \
            --publish
